name: V1 Advance CI

on:
  workflow_dispatch:
  push:
    branches:
      - V1-Advance
    paths:
      - 'EngineData/Frontend/RustApp/**'
      - 'EngineData/Backend/**'
      - 'UserData/.gitkeep'
      - 'DevelopingData/Documentation/Reports/Engineering/**'
      - '.github/workflows/v1-advance-ci.yml'
  pull_request:
    branches:
      - V1-Advance
    paths:
      - 'EngineData/Frontend/RustApp/**'
      - 'EngineData/Backend/**'
      - 'UserData/.gitkeep'
      - 'DevelopingData/Documentation/Reports/Engineering/**'
      - '.github/workflows/v1-advance-ci.yml'

permissions:
  contents: read

concurrency:
  group: v1-advance-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  source-contract-guards:
    name: Source contract guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate script profiles
        run: npm run validate:script-profiles

      - name: Validate imports
        run: npm run validate:imports

      - name: Validate file naming
        run: npm run validate:naming

      - name: Validate translation flow
        run: npm run validate:translation-flow

      - name: Validate runtime UX
        run: npm run validate:runtime-ux

      - name: Validate simple UI contract
        run: npm run validate:simple-ui

      - name: Validate functional surface contract
        run: node scripts/validate_functional_surface_contract.mjs

      - name: Validate runtime readiness scenarios
        run: node scripts/validate_runtime_readiness_scenarios.mjs

      - name: Validate error feedback contract
        run: node scripts/validate_error_feedback_contract.mjs

      - name: Validate settings surface contract
        run: node scripts/validate_settings_surface_contract.mjs

      - name: Validate startup readiness
        run: npm run validate:startup-readiness

      - name: Validate V1 CI scope
        run: npm run validate:ci-scope

      - name: Validate virtual route contract
        run: npm run validate:virtual-route

      - name: Rust manifest preflight
        run: npm run check:rust

      - name: Frontend build preflight
        run: npm run preflight:frontend-build

      - name: Generate contract report diagnostics
        run: npm run test:contract-reports

      - name: Generate auto test matrix diagnostics
        if: always()
        run: npm run test:auto-map

      - name: Upload source contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-advance-source-contract-diagnostics
          path: |
            UserData/LogData/RuntimeTestReports/**
          if-no-files-found: ignore

  frontend-build-guard:
    name: Frontend typecheck and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Typecheck frontend
        run: ./node_modules/.bin/tsc --noEmit --pretty false > typecheck.log 2>&1

      - name: Build frontend bundle
        run: ./node_modules/.bin/vite build --logLevel warn > vite-build.log 2>&1

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-advance-frontend-diagnostics
          path: |
            EngineData/Frontend/RustApp/typecheck.log
            EngineData/Frontend/RustApp/vite-build.log
          if-no-files-found: ignore

  rust-tauri-source-guard:
    name: Rust/Tauri source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust manifest preflight
        run: npm run check:rust

      - name: Tauri package preflight
        run: npm run preflight:tauri-package
