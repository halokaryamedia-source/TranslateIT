name: V1 Advance CI

on:
  workflow_dispatch:
  push:
    branches:
      - V1-Advance
    paths:
      - 'EngineData/Frontend/RustApp/**'
      - 'EngineData/Backend/LocalWorker/**'
      - 'DevelopingData/Documentation/Reports/Engineering/**'
      - '.github/workflows/v1-advance-ci.yml'
  pull_request:
    branches:
      - V1-Advance
    paths:
      - 'EngineData/Frontend/RustApp/**'
      - 'EngineData/Backend/LocalWorker/**'
      - 'DevelopingData/Documentation/Reports/Engineering/**'
      - '.github/workflows/v1-advance-ci.yml'

permissions:
  contents: read

concurrency:
  group: v1-advance-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  source-contract-guards:
    name: Source contract guards
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run quick source validation
        run: npm run validate:quick

      - name: Run contract reports
        run: |
          npm run test:frontend-backend-contract
          npm run test:worker-contract
          npm run test:rust-linkage-report
          npm run test:ui-binding-report
          npm run test:action-binding-report

  frontend-build-guard:
    name: Frontend typecheck and Vite build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build:frontend

  rust-tauri-compile-guard:
    name: Rust/Tauri compile guard
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Cargo check Tauri shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
