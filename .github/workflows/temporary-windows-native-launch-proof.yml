name: Temporary Windows Native Launch Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-windows-native-launch-proof.yml

jobs:
  launch:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp

    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Materialize frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Native Tauri build without bundle
        run: npx tauri build --no-bundle

      - name: Launch fresh native app and prove bootstrap survival
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'src-tauri\target\release\translateit.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected native executable was not produced: $exe"
          }

          # Isolate the app's writable Windows profile roots so this is a fresh-run
          # bootstrap and cannot inherit any pre-existing TranslateIT setup state.
          $isolatedLocal = Join-Path $env:RUNNER_TEMP 'TranslateITLocalAppData'
          $isolatedRoaming = Join-Path $env:RUNNER_TEMP 'TranslateITRoamingAppData'
          New-Item -ItemType Directory -Force -Path $isolatedLocal | Out-Null
          New-Item -ItemType Directory -Force -Path $isolatedRoaming | Out-Null
          $env:LOCALAPPDATA = $isolatedLocal
          $env:APPDATA = $isolatedRoaming

          $startedAt = Get-Date
          $process = Start-Process -FilePath $exe -PassThru
          Write-Host "TranslateIT process id: $($process.Id)"
          Start-Sleep -Seconds 15

          $process.Refresh()
          if ($process.HasExited) {
            throw "TranslateIT exited during the 15-second bootstrap survival window. Exit code: $($process.ExitCode)"
          }

          $native = Get-Process -Id $process.Id -ErrorAction Stop
          Write-Host "Process alive after bootstrap window: true"
          Write-Host "Responding: $($native.Responding)"
          Write-Host "MainWindowHandle: $($native.MainWindowHandle)"
          Write-Host "MainWindowTitle: $($native.MainWindowTitle)"

          # Fresh setup state must not start the local Python worker/provider. Check
          # direct descendants of the TranslateIT process for Python-family hosts.
          $children = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $process.Id }
          $pythonChildren = @($children | Where-Object { $_.Name -match '^(python|python3|py)\.exe$' })
          if ($pythonChildren.Count -gt 0) {
            $pythonChildren | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize | Out-String | Write-Host
            throw "Fresh native bootstrap unexpectedly spawned a Python child process."
          }
          Write-Host "Python child process count: 0"

          $item = Get-Item $exe
          Write-Host "Executable size bytes: $($item.Length)"
          Write-Host "Bootstrap observation seconds: $([int]((Get-Date) - $startedAt).TotalSeconds)"

          # Harness cleanup only. This deliberately does not claim safe-close behavior.
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2
          if (Get-Process -Id $process.Id -ErrorAction SilentlyContinue) {
            throw "TranslateIT test process did not terminate during harness cleanup."
          }
          Write-Host "Harness cleanup complete."
