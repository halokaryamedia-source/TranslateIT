name: Temporary R2 State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r2-state-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - name: Update canonical R2 state
        run: python .github/scripts/temp-r2-state-sync.py

      - name: Commit canonical state
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "docs/knowledge/next-action.md"
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -m 'Close R2 supply-chain static audit'
          git push origin HEAD:New
