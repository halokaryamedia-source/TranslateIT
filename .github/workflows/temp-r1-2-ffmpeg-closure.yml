name: Temporary R1.2 FFmpeg Provenance Closure

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-2-ffmpeg-closure.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact external FFmpeg candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autobuild-2026-08-10-13-17'
          $asset = 'ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-8.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$asset" -OutFile $zip
          $archiveSha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($archiveSha -ne 'b0531e470d73bf2e0d3e22a3a35f6e890781e0791c496950664da9be9ea8c0ab') { throw "Archive SHA mismatch: $archiveSha" }
          $root = Join-Path $env:RUNNER_TEMP 'ffmpeg-r1-2'
          Expand-Archive -Path $zip -DestinationPath $root
          $exe = Get-ChildItem -Path $root -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $license = Get-ChildItem -Path $root -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $exe -or -not $license) { throw 'Pinned archive is missing ffmpeg.exe or LICENSE.txt' }
          $exeSha = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $licenseSha = (Get-FileHash -Algorithm SHA256 $license.FullName).Hash.ToLowerInvariant()
          if ($exeSha -ne 'ad62137371b2111d52d29c9bc82d5aecf7065c8f937e95dfed087b2bc63ea88d') { throw "ffmpeg.exe SHA mismatch: $exeSha" }
          if ($licenseSha -ne 'da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768') { throw "LICENSE.txt SHA mismatch: $licenseSha" }
          if (@(Get-ChildItem -Path $root -Recurse -Filter '*.dll' -File).Count -ne 0) { throw 'Pinned static FFmpeg archive unexpectedly contains DLLs' }
          $version = & $exe.FullName -version 2>&1 | Out-String
          $licenseOutput = & $exe.FullName -L 2>&1 | Out-String
          if ($version -notmatch 'n8\.1\.2-34-g9b6c8969e0-20260810') { throw 'Unexpected FFmpeg version/source identity' }
          if ($version -notmatch '--pkg-config-flags=--static' -or $version -notmatch '--enable-version3') { throw 'Expected static/version3 configure profile missing' }
          if ($version -match '--enable-gpl' -or $version -match '--enable-nonfree') { throw 'GPL/nonfree configure marker found in LGPL candidate' }
          if ($licenseOutput -notmatch 'GNU Lesser General Public License' -or $licenseOutput -notmatch 'version 3 of the License') { throw 'Expected LGPL v3-or-later profile not reported' }
          "R12_FFMPEG_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '[r1.2] exact BtbN static LGPL candidate -> PASS'

      - name: Required VoiceLab decode operation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wav = Join-Path $env:RUNNER_TEMP 'r1-2-input.wav'
          $raw = Join-Path $env:RUNNER_TEMP 'r1-2-output.f32le'
          $env:R12_WAV = $wav
          @'
          import math, os, struct, wave
          rate = 32000
          with wave.open(os.environ['R12_WAV'], 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              samples = [int(5000 * math.sin(2 * math.pi * 440 * i / rate)) for i in range(rate // 4)]
              w.writeframes(b''.join(struct.pack('<h', s) for s in samples))
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'r1-2-wav.py') -Encoding utf8
          python (Join-Path $env:RUNNER_TEMP 'r1-2-wav.py')
          & $env:R12_FFMPEG_EXE -nostdin -y -i $wav -f f32le -acodec pcm_f32le -ac 1 -ar 32000 $raw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $raw) -or (Get-Item $raw).Length -ne 32000) { throw 'VoiceLab-shaped FFmpeg decode proof failed' }
          Write-Host '[r1.2] VoiceLab-shaped WAV -> f32le mono 32k decode -> PASS'

      - name: Apply bounded R1.2 source contract
        shell: pwsh
        run: |
          python .github/scripts/temp-r1-2-ffmpeg-patch.py
          git diff --check

      - name: Verify bounded ownership
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'EngineData/Backend/RuntimeAssets/Voice/README.md',
            'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected R1.2 product-source change: $path" }
          }

      - name: Validate release scripts
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          node --check scripts/validate_release_payload.mjs
          node --check scripts/validate_release_package_contract.mjs
          node scripts/validate_release_package_contract.mjs

      - name: Verify source contract matches inspected candidate
        shell: pwsh
        run: |
          $voice = Get-Content 'EngineData/Backend/RuntimeAssets/Voice/README.md' -Raw
          $payload = Get-Content 'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs' -Raw
          foreach ($marker in @(
            'autobuild-2026-08-10-13-17',
            'b0531e470d73bf2e0d3e22a3a35f6e890781e0791c496950664da9be9ea8c0ab',
            'ad62137371b2111d52d29c9bc82d5aecf7065c8f937e95dfed087b2bc63ea88d',
            'da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768',
            '9b6c8969e05b4f0b29f0f85cd501be6b3e582e6b',
            'LGPL-3.0-or-later'
          )) {
            if (-not $voice.Contains($marker)) { throw "Voice provenance contract missing: $marker" }
          }
          if (-not $payload.Contains('expectedFfmpegExeSha256') -or -not $payload.Contains('FFMPEG_LICENSE.txt') -or -not $payload.Contains('FFMPEG_SOURCE.txt')) { throw 'Release payload FFmpeg guard is incomplete' }
          Write-Host '[r1.2] persistent source contract matches inspected candidate -> PASS'

      - name: Commit R1.2 provenance contract
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Backend/RuntimeAssets/Voice/README.md EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs
          git commit -m 'Pin VoiceLab FFmpeg release provenance'
          git push origin HEAD:New
