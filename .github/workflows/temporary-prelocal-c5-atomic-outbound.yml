name: Temporary Pre-Local C5 Atomic Outbound Proof

on:
  push:
    branches:
      - New

permissions:
  contents: write

jobs:
  prove-c5:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply C5 atomic outbound patch
        shell: pwsh
        run: |
          python .tmp/prelocal_c5_atomic_outbound_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'C5 patch helper failed.' }
          rustfmt EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs `
            EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs
          if ($LASTEXITCODE -ne 0) { throw 'C5 rustfmt failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'C5 patch has whitespace errors.' }

      - name: Prove canonical source and frontend contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run validate:source-contracts
          if ($LASTEXITCODE -ne 0) { throw 'source validators failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'svelte-check failed.' }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed.' }

      - name: Prove C5 Rust compile surface
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Rust full test target failed to compile.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed.' }

      - name: Prove C5 atomic ordering and rollback ownership
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          output = Path('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs').read_text(encoding='utf-8')
          meeting = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs').read_text(encoding='utf-8')

          probe_start = output.index('pub fn probe_prepared_meeting_output_device_functionally(')
          probe_end = output.index('fn install_cancel_control(', probe_start)
          probe = output[probe_start:probe_end]
          for marker in [
              'prepared_output_device(requested_name)?',
              'Arc::new(vec![0.0_f32; sample_count])',
              'build_output_stream(',
              '.play()',
              'first_playback_rx.recv_timeout',
              'FUNCTIONAL_OUTPUT_PROBE_TIMEOUT_MS',
              'meeting_output:functional_probe_callback_timeout',
          ]:
              if marker not in probe:
                  raise SystemExit('C5 functional output probe marker missing: ' + marker)
          if 'thread::sleep' in probe:
              raise SystemExit('C5 functional output probe must not use arbitrary sleeps.')

          start = meeting.index('pub fn start_meeting_translation()')
          stop = meeting.index('#[tauri::command]\npub fn stop_meeting_translation()', start)
          body = meeting[start:stop]
          order_markers = [
              'begin_application_meeting_session()',
              'start_live_capture_runtime(starting.clone())',
              'probe_prepared_meeting_output_device_functionally(output_device, generation)',
              'start_meeting_outbound_consumer(generation, &session_id)',
              'commit_application_meeting_session_live(',
          ]
          positions = [body.index(marker) for marker in order_markers]
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit('C5 Start order is not authority -> microphone -> output probe -> consumer -> Live.')

          probe_failure = body.index('if let Err(blocker) =')
          consumer_failure = body.index('if let Err(error) = start_meeting_outbound_consumer', probe_failure)
          commit_index = body.index('let committed = commit_application_meeting_session_live(', consumer_failure)
          commit_failure_end = body.index('update_outbound_status(', commit_index)
          commit_failure = body[commit_index:commit_failure_end]
          if 'revoke_runtime_session_authority(' not in commit_failure:
              raise SystemExit('C5 commit rollback must revoke authority first.')
          if 'stop_meeting_outbound_consumer(generation)' not in commit_failure:
              raise SystemExit('C5 commit rollback must join the pre-created outbound consumer.')
          if consumer_failure >= commit_index:
              raise SystemExit('C5 outbound consumer failure handling is not pre-Live.')

          print('C5_ATOMIC_OUTBOUND_GUARD=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C5 ownership/order guard failed.' }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $expected = @(
            'CONTEXT.md',
            'EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs',
            'docs/knowledge/next-action.md',
            'docs/knowledge/source-ownership.md'
          )
          $changed = @(git diff --name-only | ForEach-Object { $_.Replace('\','/') })
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "Unexpected: $_" }
            throw 'Unexpected C5 changed path.'
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing: $_" }
            throw 'Expected C5 changed path missing.'
          }

      - name: Prove Tauri release link
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri release build failed.' }

      - name: Commit proven C5 implementation
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add CONTEXT.md `
            EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs `
            EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs `
            docs/knowledge/next-action.md `
            docs/knowledge/source-ownership.md
          git commit -m 'Close atomic outbound activation'
          if ($LASTEXITCODE -ne 0) { throw 'C5 substantive commit failed.' }
          git push origin HEAD:New
          if ($LASTEXITCODE -ne 0) { throw 'C5 substantive push failed.' }
