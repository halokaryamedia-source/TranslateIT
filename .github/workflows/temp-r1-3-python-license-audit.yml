name: Temporary R1.3 Python License Audit

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-3-python-license-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit frozen Python dependency metadata
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, tomllib, urllib.request
          from pathlib import Path

          lock_path = Path('EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock')
          lock = tomllib.loads(lock_path.read_text(encoding='utf-8'))
          packages = []
          for pkg in lock.get('package', []):
              name = str(pkg.get('name', '')).strip()
              version = str(pkg.get('version', '')).strip()
              if not name or not version:
                  continue
              packages.append((name, version))

          def fetch_pypi(name: str, version: str):
              url = f'https://pypi.org/pypi/{name}/{version}/json'
              req = urllib.request.Request(url, headers={'User-Agent': 'TranslateIT-R1.3-license-audit'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response).get('info', {})
              except Exception as exc:
                  return {'_error': type(exc).__name__}

          permissive_tokens = (
              'mit', 'apache', 'bsd', 'isc', 'python software foundation', 'psf',
              'mozilla public license 2.0', 'mpl-2.0', 'unlicense', 'public domain',
              'zlib', 'boost software license', 'cc0', 'artistic license 2.0',
          )
          copyleft_tokens = ('gpl', 'agpl', 'lgpl', 'epl', 'cddl', 'cecill')
          results = []
          for name, version in packages:
              info = fetch_pypi(name, version)
              expression = str(info.get('license_expression') or '').strip()
              license_text = str(info.get('license') or '').strip()
              classifiers = [c for c in info.get('classifiers', []) if 'License ::' in c]
              combined = ' | '.join([expression, license_text, *classifiers]).lower()
              if info.get('_error'):
                  status = 'metadata-unavailable'
              elif any(token in combined for token in copyleft_tokens):
                  status = 'review-copyleft'
              elif any(token in combined for token in permissive_tokens):
                  status = 'permissive-metadata'
              else:
                  status = 'review-unknown'
              results.append({
                  'name': name,
                  'version': version,
                  'status': status,
                  'license_expression': expression,
                  'license': re.sub(r'\s+', ' ', license_text)[:180],
                  'classifiers': classifiers,
                  'home_page': info.get('home_page') or info.get('project_url') or '',
                  'project_urls': info.get('project_urls') or {},
              })

          print(f'[r1.3] frozen_packages={len(results)}')
          groups = {}
          for row in results:
              groups[row['status']] = groups.get(row['status'], 0) + 1
          for key in sorted(groups):
              print(f'[r1.3] {key}={groups[key]}')
          print('[r1.3] REVIEW_ROWS_BEGIN')
          for row in results:
              if row['status'] != 'permissive-metadata':
                  print(json.dumps(row, sort_keys=True))
          print('[r1.3] REVIEW_ROWS_END')
          print('[r1.3] ALL_ROWS_BEGIN')
          for row in results:
              print(json.dumps(row, sort_keys=True))
          print('[r1.3] ALL_ROWS_END')
          PY
