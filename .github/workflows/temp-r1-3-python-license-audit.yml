name: Temporary R1.3 Python License Audit

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-3-python-license-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install reviewed uv resolver
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.12.0

      - name: Export actual Windows production closure
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        shell: pwsh
        run: |
          uv export --frozen --no-dev --python-platform windows --format requirements.txt --no-hashes --no-emit-project --output-file "$env:RUNNER_TEMP\windows-production.txt"
          Get-Content "$env:RUNNER_TEMP\windows-production.txt"

      - name: Audit Windows production dependency metadata
        shell: pwsh
        run: |
          $env:REQ_PATH = "$env:RUNNER_TEMP\windows-production.txt"
          @'
          from __future__ import annotations
          import json, os, re, urllib.request
          from pathlib import Path

          req_path = Path(os.environ['REQ_PATH'])
          packages = []
          seen = set()
          for raw in req_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('-'):
                  continue
              match = re.match(r'^([A-Za-z0-9_.-]+)==([^\s;]+)', line)
              if not match:
                  continue
              item = (match.group(1).lower().replace('_', '-'), match.group(2))
              if item not in seen:
                  seen.add(item)
                  packages.append(item)

          def fetch_pypi(name: str, version: str):
              candidates = [version]
              if '+' in version:
                  candidates.append(version.split('+', 1)[0])
              for candidate in candidates:
                  url = f'https://pypi.org/pypi/{name}/{candidate}/json'
                  req = urllib.request.Request(url, headers={'User-Agent': 'TranslateIT-R1.3-license-audit'})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          info = json.load(response).get('info', {})
                          info['_metadata_version_used'] = candidate
                          return info
                  except Exception:
                      pass
              return {'_error': 'metadata-unavailable'}

          permissive_tokens = (
              'mit', 'apache', 'bsd', 'isc', 'python software foundation', 'psf',
              'mozilla public license 2.0', 'mpl-2.0', 'unlicense', 'public domain',
              'zlib', 'boost software license', 'cc0', 'artistic license 2.0',
          )
          explicit_review_tokens = ('lgpl', 'agpl', 'gpl-', 'gplv', 'eclipse public license', 'cddl', 'cecill')
          results = []
          for name, version in packages:
              info = fetch_pypi(name, version)
              expression = str(info.get('license_expression') or '').strip()
              license_text = str(info.get('license') or '').strip()
              classifiers = [c for c in info.get('classifiers', []) if 'License ::' in c]
              combined = ' | '.join([expression, license_text, *classifiers]).lower()
              if info.get('_error'):
                  status = 'metadata-unavailable'
              elif any(token in combined for token in explicit_review_tokens):
                  status = 'review-copyleft'
              elif any(token in combined for token in permissive_tokens):
                  status = 'permissive-metadata'
              else:
                  status = 'review-unknown'
              results.append({
                  'name': name,
                  'version': version,
                  'metadata_version_used': info.get('_metadata_version_used', ''),
                  'status': status,
                  'license_expression': expression,
                  'license': re.sub(r'\s+', ' ', license_text)[:220],
                  'classifiers': classifiers,
                  'project_urls': info.get('project_urls') or {},
              })

          print(f'[r1.3] windows_production_packages={len(results)}')
          groups = {}
          for row in results:
              groups[row['status']] = groups.get(row['status'], 0) + 1
          for key in sorted(groups):
              print(f'[r1.3] {key}={groups[key]}')
          print('[r1.3] REVIEW_ROWS_BEGIN')
          for row in results:
              if row['status'] != 'permissive-metadata':
                  print(json.dumps(row, sort_keys=True))
          print('[r1.3] REVIEW_ROWS_END')
          print('[r1.3] PACKAGE_ROWS_BEGIN')
          for row in results:
              print(json.dumps(row, sort_keys=True))
          print('[r1.3] PACKAGE_ROWS_END')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\audit.py" -Encoding utf8
          python "$env:RUNNER_TEMP\audit.py"
