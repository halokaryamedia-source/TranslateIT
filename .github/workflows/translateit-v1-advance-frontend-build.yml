name: TranslateIT V1 Advance Frontend Build

on:
  push:
    branches: [V1-Advance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build Gate
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }
      - name: Run frontend build preflight
        run: npm run preflight:frontend-build
      - name: Run frontend build
        run: npm run build:frontend
      - name: Frontend build scope summary
        run: |
          @'
          TranslateIT V1-Advance frontend build gate completed.

          This validates the Vite frontend build only.
          It does not run Tauri packaging, cargo check, CUDA checks, model setup/loading,
          microphone capture, virtual microphone routing, or TTS provider runtime.
          '@ | Write-Host
