name: Temporary R3.1 Complete Staging Size

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-r31-complete-staging-size.yml"

concurrency:
  group: temp-r31-complete-staging-size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Windows complete controlled staging
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Recover bounded R3 staging harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage-release.ps1'
          $licenses = Join-Path $env:RUNNER_TEMP 'stage-python-license-material.py'
          $authority = 'b86041866d259587104cad991380cec2de90c844'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/halokaryamedia-source/TranslateIT/$authority/.github/scripts/temp-r3-stage-release.ps1" -OutFile $stage
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/halokaryamedia-source/TranslateIT/$authority/.github/scripts/temp-r3-stage-python-license-material.py" -OutFile $licenses
          $env:STAGE_SCRIPT = $stage
          @'
          import os
          from pathlib import Path

          path = Path(os.environ["STAGE_SCRIPT"])
          text = path.read_text(encoding="utf-8-sig")

          old = """Expand-Archive -LiteralPath $pythonZip -DestinationPath $PythonRoot -Force
          & (Join-Path $PythonRoot 'python.exe') --version
          """
          new = """Expand-Archive -LiteralPath $pythonZip -DestinationPath $PythonRoot -Force
          @('python312.zip','.','..\\WorkerRuntime') | Set-Content -LiteralPath (Join-Path $PythonRoot 'python312._pth') -Encoding ascii
          & (Join-Path $PythonRoot 'python.exe') --version
          """
          if old not in text:
              raise SystemExit("R3 CPython extraction anchor missing")
          text = text.replace(old, new, 1)

          old = """source_url=https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          archive_md5=$pythonMd5
          archive_sha256=$pythonSha
          """
          new = """source_url=https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          archive_bytes=$((Get-Item $pythonZip).Length)
          archive_md5=$pythonMd5
          archive_sha256=$pythonSha
          """
          if old not in text:
              raise SystemExit("R3 CPython provenance anchor missing")
          text = text.replace(old, new, 1)

          old = "$env:PYTHONPATH=$Worker\n$env:SOURCE_ROOT=$VoiceSource"
          new = "$env:SOURCE_ROOT=$VoiceSource"
          if old not in text:
              raise SystemExit("R3 PYTHONPATH proof anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          print("bounded R3 staging harness reconciled to current private-Python contract")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R3 staging harness reconciliation failed.' }
          "STAGE_SCRIPT=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LICENSE_SCRIPT=$licenses" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact controlled release inputs
        shell: pwsh
        run: '& $env:STAGE_SCRIPT'

      - name: Add reviewed exceptional Python license material
        shell: pwsh
        run: python $env:LICENSE_SCRIPT

      - name: Install frozen frontend release tooling
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

      - name: Validate complete controlled staging before optimization
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node scripts/generate_third_party_notices.mjs --write
          if ($LASTEXITCODE -ne 0) { throw 'Complete staging notice generation failed.' }
          npm run preflight:release-payload
          if ($LASTEXITCODE -ne 0) { throw 'Complete controlled staging preflight failed.' }

      - name: Measure complete staging before optimization
        shell: pwsh
        run: |
          $env:MEASURE_PHASE = 'before'
          $env:MEASURE_OUT = Join-Path $env:RUNNER_TEMP 'before-size.json'
          @'
          import json, os
          from pathlib import Path

          repo = Path.cwd()
          backend = repo / "EngineData" / "Backend"
          roots = {
              "PythonRuntime": backend / "LocalWorker" / "PythonRuntime",
              "ASR": backend / "RuntimeAssets" / "ASR" / "ModelData",
              "Translation": backend / "RuntimeAssets" / "Translation" / "ModelData",
              "Voice": backend / "RuntimeAssets" / "Voice" / "GPTSoVITS" / "Source",
              "VB-CABLE": backend / "RuntimeAssets" / "AudioProvider" / "VBCABLE" / "Package",
          }
          breakdown = {}
          for name, root in roots.items():
              breakdown[name] = sum(p.stat().st_size for p in root.rglob("*") if p.is_file())
          result = {"phase": os.environ["MEASURE_PHASE"], "controlled_component_bytes": sum(breakdown.values()), "components": breakdown}
          Path(os.environ["MEASURE_OUT"]).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Pre-optimization size measurement failed.' }

      - name: Apply production release optimizer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = (Resolve-Path 'EngineData/Backend').Path
          $privatePython = Join-Path $backend 'LocalWorker/PythonRuntime/python.exe'
          & $privatePython 'EngineData/Frontend/RustApp/scripts/optimize_release_payload.py' --backend-root $backend
          if ($LASTEXITCODE -ne 0) { throw 'Production release optimizer failed on complete staging.' }

      - name: Regenerate final optimized notices
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node scripts/generate_third_party_notices.mjs --write
          if ($LASTEXITCODE -ne 0) { throw 'Optimized staging notice generation failed.' }

      - name: Verify optimized Python closure
        shell: pwsh
        run: |
          $site = (Resolve-Path 'EngineData/Backend/LocalWorker/PythonRuntime').Path
          python EngineData/Frontend/RustApp/scripts/audit_release_python_runtime.py --site-packages $site --label optimized-complete --json-out (Join-Path $env:RUNNER_TEMP 'optimized-python.json')
          if ($LASTEXITCODE -ne 0) { throw 'Optimized complete Python audit failed.' }
          $env:AUDIT = Join-Path $env:RUNNER_TEMP 'optimized-python.json'
          @'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["AUDIT"]).read_text(encoding="utf-8"))
          if report["distribution_count"] != 97:
              raise SystemExit(f"expected 97 optimized distributions, got {report['distribution_count']}")
          present = {item["normalized_name"] for item in report["distributions"]}
          forbidden = {"accelerate","annotated-types","budoux","cn2an","colorlog","fast-langdetect","fasttext-predict","jieba","jieba-fast","pandas","peft","proces","pydantic","pydantic-core","pypinyin","robust-downloader","split-lang","typing-inspection","tzdata"}
          leaked = sorted(forbidden & present)
          if leaked:
              raise SystemExit(f"excluded optimized distributions remain: {leaked}")
          print("optimized complete Python closure: PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Optimized complete distribution contract failed.' }

      - name: Measure exact optimized release resources
        shell: pwsh
        run: |
          $env:BEFORE = Join-Path $env:RUNNER_TEMP 'before-size.json'
          $env:SUMMARY = Join-Path $env:RUNNER_TEMP 'complete-staging-summary.json'
          @'
          import json, os
          from pathlib import Path

          repo = Path.cwd()
          backend = repo / "EngineData" / "Backend"
          roots = {
              "PythonRuntime": backend / "LocalWorker" / "PythonRuntime",
              "ASR": backend / "RuntimeAssets" / "ASR" / "ModelData",
              "Translation": backend / "RuntimeAssets" / "Translation" / "ModelData",
              "Voice": backend / "RuntimeAssets" / "Voice" / "GPTSoVITS" / "Source",
              "VB-CABLE": backend / "RuntimeAssets" / "AudioProvider" / "VBCABLE" / "Package",
          }
          components = {name: sum(p.stat().st_size for p in root.rglob("*") if p.is_file()) for name, root in roots.items()}
          controlled_total = sum(components.values())

          config_path = repo / "EngineData" / "Frontend" / "RustApp" / "src-tauri" / "tauri.release.conf.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          resource_root = config_path.parent
          seen = set()
          resources = {}
          for source in config["bundle"]["resources"]:
              path = (resource_root / source).resolve()
              files = [path] if path.is_file() else [p for p in path.rglob("*") if p.is_file()]
              subtotal = 0
              for file in files:
                  real = file.resolve()
                  if real in seen:
                      continue
                  seen.add(real)
                  size = real.stat().st_size
                  subtotal += size
              resources[source] = subtotal
          resource_total = sum(resources.values())
          before = json.loads(Path(os.environ["BEFORE"]).read_text(encoding="utf-8"))
          result = {
              "pre_optimization_controlled_component_bytes": before["controlled_component_bytes"],
              "optimized_controlled_component_bytes": controlled_total,
              "optimized_controlled_component_saving_bytes": before["controlled_component_bytes"] - controlled_total,
              "optimized_components": components,
              "tauri_release_resource_bytes": resource_total,
              "tauri_release_resource_file_count": len(seen),
              "tauri_release_resources": resources,
          }
          Path(os.environ["SUMMARY"]).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Complete optimized controlled staging\n\n")
              handle.write(f"- Before optimization: {before['controlled_component_bytes']:,} bytes\n")
              handle.write(f"- Optimized controlled components: {controlled_total:,} bytes\n")
              handle.write(f"- Measured component saving: {before['controlled_component_bytes'] - controlled_total:,} bytes\n")
              handle.write(f"- Exact Tauri release resources: {resource_total:,} bytes across {len(seen):,} files\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Optimized exact resource measurement failed.' }

      - name: Upload bounded staging proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r31-complete-staging-size
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/before-size.json
            ${{ runner.temp }}/optimized-python.json
            ${{ runner.temp }}/complete-staging-summary.json
