name: Temporary Backend Wave A2 Ownership Proof

# Final A2 rerun verifies generation-scoped cleanup ownership.
on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-wave-a2.yml

permissions:
  contents: write

jobs:
  maintain-and-prove:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply final bounded Wave A2 ownership correction
        shell: pwsh
        run: python .tmp/backend_wave_a2_followup.py source

      - name: Format bounded Rust modules
        shell: pwsh
        run: |
          rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs
          rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/engine/capture_lifecycle.rs
          rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs

      - name: Validate bounded changed scope
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $allowed = @(
            'EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/capture_lifecycle.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected changed path missing: $path" }
          }
          git diff --stat

      - name: Materialize canonical frontend dependencies
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Build frontend prerequisite for Tauri test context
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend

      - name: Targeted runtime ownership and cleanup-state tests
        shell: pwsh
        run: cargo test --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml runtime_state::tests -- --test-threads=1

      - name: Targeted Meeting cleanup-truth test
        shell: pwsh
        run: cargo test --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml cleanup_truth_tests -- --test-threads=1

      - name: Windows Rust compile baseline
        shell: pwsh
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Native Tauri release build baseline
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npx tauri build --no-bundle

      - name: Reconcile final Wave A2 closure state
        shell: pwsh
        run: |
          python .tmp/backend_wave_a2_followup.py closure
          git diff --check

      - name: Commit proven Wave A2 ownership correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/engine/capture_lifecycle.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs
          git add docs/knowledge/next-action.md
          git commit -m "Close stale Stop cleanup ownership races"
          git push origin HEAD:New
