name: RustApp Validation

on:
  workflow_dispatch:

jobs:
  validate-rustapp:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run RustApp final validation
        shell: pwsh
        run: .\DevelopingData\Tooling\Scripts\Execution\run_rustapp_final_validation.ps1
