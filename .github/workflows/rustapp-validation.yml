name: RustApp Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "EngineData/LauncherApp/RustApp/**"
      - "DevelopingData/ToolKitData/Scripts/Execution/check_rust_app.py"
      - "DevelopingData/ToolKitData/Scripts/Execution/check_rust_runtime_boundaries.py"
      - "DevelopingData/ToolKitData/Scripts/Execution/check_rust_output_boundary.py"
      - "DevelopingData/ToolKitData/Scripts/Execution/check_rust_model_boundary.py"
      - "DevelopingData/ToolKitData/Scripts/Execution/run_rustapp_final_validation.ps1"

jobs:
  validate-rustapp:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run RustApp final validation
        shell: pwsh
        run: .\DevelopingData\ToolKitData\Scripts\Execution\run_rustapp_final_validation.ps1
