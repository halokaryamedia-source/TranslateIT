name: Temporary Backend Pre-Local B5 Proof

on:
  push:
    branches:
      - New

permissions:
  contents: write

jobs:
  prove-b5:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Resolve immutable Hugging Face revisions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repos = [ordered]@{
            HF_ASR_PRIMARY_REVISION = 'dropbox-dash/faster-whisper-large-v3-turbo'
            HF_ASR_FALLBACK_REVISION = 'Systran/faster-whisper-medium'
            HF_ID_EN_REVISION = 'Helsinki-NLP/opus-mt-id-en'
            HF_EN_ID_REVISION = 'Helsinki-NLP/opus-mt-en-id'
          }
          foreach ($entry in $repos.GetEnumerator()) {
            $line = git ls-remote "https://huggingface.co/$($entry.Value)" HEAD
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($line)) {
              throw "Could not resolve Hugging Face HEAD for $($entry.Value)"
            }
            $sha = ($line -split '\s+')[0].Trim()
            if ($sha -notmatch '^[0-9a-f]{40}$') {
              throw "Unexpected Hugging Face revision for $($entry.Value): $sha"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "$($entry.Key)=$sha"
            Write-Host "$($entry.Value) -> $sha"
          }

      - name: Apply bounded B5 correction and validator reconciliation
        shell: pwsh
        run: |
          python .tmp/backend_prelocal_b5_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'B5 patch helper failed.' }
          @'
          from pathlib import Path

          path = Path("EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs")
          body = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  \'if empty { "listening" } else { "attention_needed" }\',\n',
                  '  "Translation Live is listening. Rolling audio remains preview-only; finalized utterances receive shared Meeting event sequence before AI.",\n',
              ),
              (
                  '  "virtual_mic_generation_bound_route_pair_source_side_not_audio_routing_proof",\n',
                  '  "virtual_mic_generation_bound_route_pair_source_side_not_audio_delivery_proof",\n',
              ),
              (
                  'requireMarkers(source.runtimeState, "Meeting lifecycle", [\'phase: "starting".to_string()\',',
                  'requireMarkers(source.runtimeState, "Meeting lifecycle", [\'"starting",\',',
              ),
          ]
          for old, new in replacements:
              if old not in body:
                  raise SystemExit(f"stale startup validator marker was not found: {old!r}")
              body = body.replace(old, new, 1)

          old_route = '''requireMarkers(source.meetingSession, "Meeting route temporary TTS ownership", [
            "let route = dispatch_meeting_virtual_audio_route_provider(tts_path.clone(), generation);",
            "remove_temporary_tts(&tts_path);",
          ]);
          const routeDispatchIndex = source.meetingSession.indexOf("let route = dispatch_meeting_virtual_audio_route_provider(tts_path.clone(), generation);");
          const routeCleanupIndex = source.meetingSession.indexOf("remove_temporary_tts(&tts_path);", routeDispatchIndex);
          if (routeDispatchIndex < 0 || routeCleanupIndex < routeDispatchIndex) {
            throw new Error("Meeting temporary TTS must remain owned until synchronous route dispatch returns");
          }
          '''
          new_route = '''requireMarkers(source.meetingSession, "Rust Meeting route temporary TTS ownership", [
            "get_bound_virtual_mic_output_device(generation)",
            "deliver_meeting_output_wav(&tts_path, bound_output_device.as_deref().ok(), generation)",
            "remove_temporary_tts(&tts_path);",
          ]);
          const routeDispatchIndex = source.meetingSession.indexOf("deliver_meeting_output_wav(&tts_path, bound_output_device.as_deref().ok(), generation)");
          const routeCleanupIndex = source.meetingSession.indexOf("remove_temporary_tts(&tts_path);", routeDispatchIndex);
          if (routeDispatchIndex < 0 || routeCleanupIndex < routeDispatchIndex) {
            throw new Error("Meeting temporary TTS must remain owned until synchronous Rust audio delivery returns");
          }
          '''
          if old_route not in body:
              raise SystemExit("retired Python route validator block was not found")
          body = body.replace(old_route, new_route, 1)

          old_manifest = 'if (models.some((model) => Object.hasOwn(model, "revision") || Object.hasOwn(model, "checksum"))) throw new Error("Initial model inventory must not grow revision/checksum release-identity placeholders");'
          new_manifest = '''for (const model of models.filter((entry) => entry.source_type === "huggingface")) {
            if (!/^[0-9a-f]{40}$/.test(String(model.revision ?? ""))) throw new Error(`Hugging Face model ${model.model_id} must pin a full immutable revision`);
          }
          if (models.some((model) => Object.hasOwn(model, "checksum"))) throw new Error("Model inventory must not invent checksum identity without a current packaging requirement");'''
          if old_manifest not in body:
              raise SystemExit("retired manifest revision prohibition was not found")
          body = body.replace(old_manifest, new_manifest, 1)
          body = body.replace(
              "bounded Meeting route provider preflight before authority",
              "native Meeting output preflight before authority",
          )
          path.write_text(body, encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'B5 validator reconciliation failed.' }

      - name: Refresh canonical WorkerRuntime lock only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.3
          if ($LASTEXITCODE -ne 0) { throw 'uv install failed.' }
          Push-Location EngineData/Backend/LocalWorker/WorkerRuntime
          try {
            uv lock
            if ($LASTEXITCODE -ne 0) { throw 'uv lock failed.' }
            uv lock --check
            if ($LASTEXITCODE -ne 0) { throw 'uv lock --check failed.' }
          } finally {
            Pop-Location
          }

      - name: Prove reconciled frontend and source validators
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run validate:source-contracts
          if ($LASTEXITCODE -ne 0) { throw 'Source-contract validators failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'svelte-check failed.' }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed.' }

      - name: Prove incremental local Tauri compile helper
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          Remove-Item Env:TRANSLATEIT_CLEAN_RUST_TARGET -ErrorAction SilentlyContinue
          node scripts/run_local_tauri_compile_check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Incremental local Tauri compile helper failed.' }

      - name: Prove Tauri release link
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri release build failed.' }

      - name: Verify B5 scope and canonical state
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $expected = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/README.md',
            'EngineData/Backend/LocalWorker/WorkerRuntime/model_manifest.json',
            'EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml',
            'EngineData/Backend/LocalWorker/WorkerRuntime/run_realtime_worker_smoke.ps1',
            'EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_prepare_model_assets.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'EngineData/Frontend/RustApp/scripts/README.md',
            'EngineData/Frontend/RustApp/scripts/run_local_tauri_compile_check.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_frontend_build_preflight.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs',
            'docs/knowledge/next-action.md'
          )
          $changed = @(git status --porcelain --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "Unexpected: $_" }
            throw 'Unexpected B5 changed path.'
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing: $_" }
            throw 'Expected B5 changed path missing.'
          }
          $next = Get-Content docs/knowledge/next-action.md -Raw
          if (-not $next.Contains('## Backend Pre-Local B5 — CLOSED')) { throw 'B5 closure missing.' }
          if (-not $next.Contains('## Next Step — Backend Pre-Local B6: Proven Dead / Legacy Cleanup')) { throw 'B6 next step missing.' }
          git diff --stat

      - name: Commit proven B5 correction
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add `
            EngineData/Backend/LocalWorker/WorkerRuntime/README.md `
            EngineData/Backend/LocalWorker/WorkerRuntime/model_manifest.json `
            EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets.py `
            EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml `
            EngineData/Backend/LocalWorker/WorkerRuntime/run_realtime_worker_smoke.ps1 `
            EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_prepare_model_assets.py `
            EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock `
            EngineData/Frontend/RustApp/scripts/README.md `
            EngineData/Frontend/RustApp/scripts/run_local_tauri_compile_check.mjs `
            EngineData/Frontend/RustApp/scripts/validate_frontend_build_preflight.mjs `
            EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs `
            docs/knowledge/next-action.md
          git commit -m 'Make local model proof tooling deterministic'
          git push origin HEAD:New
