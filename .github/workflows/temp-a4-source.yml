name: Temporary VoiceLab Pre-Local Audit Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a4-source.yml
  workflow_dispatch:

jobs:
  source-proof:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VoiceLab Python contract proof
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) { throw 'uv install failed' }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw 'uv lock check failed' }
          uv sync --frozen --no-install-project
          if ($LASTEXITCODE -ne 0) { throw 'frozen worker sync failed' }
          uv run python -m py_compile voice_lab_build.py voice_lab_gpt_sovits.py test_voice_lab_build_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'VoiceLab Python syntax gate failed' }
          uv run python -m unittest test_voice_lab_build_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'VoiceLab build contract tests failed' }
      - name: Frontend proof
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'frontend typecheck failed' }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }
      - name: Rust compile gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }
