name: Temporary R3 VB-CABLE Provider Contract Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r3-provider-contract-proof.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded provider contract patch
        shell: pwsh
        run: |
          python .github/scripts/temp-r3-provider-contract.py
          git diff --check

      - name: Verify bounded four-owner product diff
        shell: pwsh
        run: |
          $changed=@(git diff --name-only)
          $allowed=@(
            'EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/README.md',
            'EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/NOTICE.txt',
            'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs'
          )
          foreach ($path in $changed) { if ($allowed -notcontains $path) { throw "Unexpected R3 product change: $path" } }
          foreach ($path in $allowed) { if ($changed -notcontains $path) { throw "Expected R3 product change missing: $path" } }
          Write-Host '[r3] exact four-owner provider contract diff -> PASS'

      - name: Verify persistent Pack45 pins against official package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip'
          $zip=Join-Path $env:RUNNER_TEMP 'VBCABLE_Driver_Pack45.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $archiveHash=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($archiveHash -ne 'b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb') { throw "Official archive drift: $archiveHash" }
          $extract=Join-Path $env:RUNNER_TEMP 'vbcable45'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $env:VB_ROOT=$extract
          $env:VALIDATOR=(Resolve-Path 'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs').Path
          @'
          import os,re,hashlib
          from pathlib import Path
          root=Path(os.environ['VB_ROOT'])
          source=Path(os.environ['VALIDATOR']).read_text(encoding='utf-8')
          block=re.search(r'const expectedVbCableFiles = \{(.*?)\n\};', source, re.S)
          if not block: raise SystemExit('expectedVbCableFiles block missing')
          pairs=dict(re.findall(r'"([^"]+)": "([0-9a-f]{64})"', block.group(1)))
          files={p.name:p for p in root.iterdir() if p.is_file()}
          if set(pairs)!=set(files) or len(pairs)!=31:
              raise SystemExit(f'Pack45 pin/file mismatch pins={len(pairs)} files={len(files)} missing={set(files)-set(pairs)} extra={set(pairs)-set(files)}')
          for name,expected in pairs.items():
              actual=hashlib.sha256(files[name].read_bytes()).hexdigest()
              if actual!=expected: raise SystemExit(f'Pack45 hash mismatch {name}: {actual}')
          print('[r3] all 31 persistent Pack45 file pins match official archive -> PASS')
          '@ | Set-Content "$env:RUNNER_TEMP\verify_pack.py" -Encoding utf8
          python "$env:RUNNER_TEMP\verify_pack.py"

          foreach ($exeName in @('VBCABLE_Setup.exe','VBCABLE_Setup_x64.exe')) {
            $exe=Join-Path $extract $exeName
            $sig=Get-AuthenticodeSignature -LiteralPath $exe
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'BUREL VINCENT') { throw "Invalid official signer for $exeName" }
          }
          Write-Host '[r3] official setup Authenticode -> PASS'

      - name: Verify release source contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node --check scripts/validate_release_payload.mjs
          node scripts/validate_release_package_contract.mjs

      - name: Commit provider evidence contract
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/README.md EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/NOTICE.txt EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs
          git commit -m 'Pin official VB-CABLE release payload'
          git push origin HEAD:New
