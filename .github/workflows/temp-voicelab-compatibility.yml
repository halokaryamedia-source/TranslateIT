name: Temporary VoiceLab Compatibility Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temp-voicelab-compatibility.yml
  workflow_dispatch:

jobs:
  single-runtime-compatibility:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout TranslateIT
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Materialize canonical WorkerRuntime baseline
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --dev
          if ($LASTEXITCODE -ne 0) { throw 'Canonical uv sync failed' }
          uv run python -c "import sys, torch, ctranslate2, faster_whisper, transformers, numpy; print('PYTHON', sys.version); print('TORCH', torch.__version__); print('CTRANSLATE2', ctranslate2.__version__); print('FASTER_WHISPER', faster_whisper.__version__); print('TRANSFORMERS', transformers.__version__); print('NUMPY', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical identity probe failed' }
          uv run pytest
          if ($LASTEXITCODE -ne 0) { throw 'Canonical worker baseline tests failed' }

      - name: Fetch pinned GPT-SoVITS source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = 'd523079fc05d9a8028d6085bffe4a2757c32abb6'
          git init .tmp-gpt-sovits
          git -C .tmp-gpt-sovits remote add origin https://github.com/RVC-Boss/GPT-SoVITS.git
          git -C .tmp-gpt-sovits fetch --depth 1 origin $sha
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GPT-SoVITS fetch failed' }
          git -C .tmp-gpt-sovits checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GPT-SoVITS checkout failed' }
          $actual = (git -C .tmp-gpt-sovits rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw "Pinned GPT-SoVITS revision mismatch: $actual" }
          Write-Host "GPT_SOVITS_REVISION=$actual"

      - name: Prove wholesale upstream requirements are out of scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requirements = Get-Content .tmp-gpt-sovits/requirements.txt -Raw
          $outOfScope = @(
            'gradio',
            'funasr',
            'modelscope',
            'fastapi',
            'x_transformers',
            'rotary_embedding_torch'
          )
          foreach ($name in $outOfScope) {
            if ($requirements.ToLowerInvariant() -notmatch [regex]::Escape($name)) {
              throw "Expected upstream tooling marker missing: $name"
            }
          }
          Write-Host 'UPSTREAM_FULL_REQUIREMENTS_NOT_ADOPTED=true'

      - name: Prove bounded upstream pruning points are non-V2ProPlus responsibilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $lrPath = '.tmp-gpt-sovits/GPT_SoVITS/AR/modules/lr_schedulers.py'
          $lr = Get-Content $lrPath -Raw
          if ($lr -notmatch 'from matplotlib import pyplot as plt') { throw 'Expected demo-only matplotlib import not found' }
          $lrRuntime = ($lr -split 'if __name__ == "__main__":')[0]
          if (($lrRuntime -replace 'from matplotlib import pyplot as plt', '') -match '\bplt\.') {
            throw 'Matplotlib participates in scheduler behavior; pruning is unsafe'
          }

          $modelsPath = '.tmp-gpt-sovits/GPT_SoVITS/module/models.py'
          $models = Get-Content $modelsPath -Raw
          if ($models -notmatch 'from f5_tts\.model import DiT') { throw 'Expected eager V3 DiT import not found' }
          $synth = ($models -split 'class SynthesizerTrn\(nn\.Module\):', 2)[1]
          $synth = ($synth -split 'class SynthesizerTrnV3\(nn\.Module\):', 2)[0]
          if ($synth -match '\bDiT\(') { throw 'V2/V2Pro SynthesizerTrn uses DiT; pruning is unsafe' }

          $coreVq = Get-Content .tmp-gpt-sovits/GPT_SoVITS/module/core_vq.py -Raw
          if ($coreVq -notmatch 'from einops import rearrange, repeat') { throw 'Expected direct V2ProPlus vector-quantizer einops use not found' }

          $dataset = Get-Content .tmp-gpt-sovits/GPT_SoVITS/AR/data/dataset.py -Raw
          if ($dataset -notmatch 'import pandas as pd') { throw 'Expected raw dataset pandas dependency not found' }
          if ($dataset -notmatch 'pd\.read_csv') { throw 'Expected raw semantic TSV pandas read not found' }

          $utils = Get-Content .tmp-gpt-sovits/tools/my_utils.py -Raw
          if ($utils -notmatch 'import gradio as gr') { throw 'Expected raw upstream UI dependency not found' }
          if ($utils -notmatch 'def load_audio') { throw 'Expected raw upstream audio loader not found' }

          $tts = Get-Content .tmp-gpt-sovits/GPT_SoVITS/TTS_infer_pack/TTS.py -Raw
          if ($tts -notmatch 'torchaudio\.transforms\.Resample') { throw 'Expected TTS torchaudio resample call not found' }
          if ($tts -notmatch 'torchaudio\.load') { throw 'Expected TTS torchaudio load call not found' }
          if ($tts -notmatch 'from tools\.audio_sr import AP_BWE') { throw 'Expected optional AP_BWE eager import not found' }
          if ($tts -notmatch 'from peft import') { throw 'Expected optional PEFT eager import not found' }

          $pre = Get-Content .tmp-gpt-sovits/GPT_SoVITS/TTS_infer_pack/TextPreprocessor.py -Raw
          if ($pre -notmatch 'from text import chinese') { throw 'Expected eager multilingual text import not found' }
          if ($pre -notmatch 'elif language == "en"') { throw 'Expected English branch not found' }

          Write-Host 'RAW_UPSTREAM_ADAPTER_IS_TOO_BROAD=true'
          Write-Host 'DEFER_TO_A2=pandas-dataset-loader,gradio-tools-wrapper,torchaudio-audio-wrapper,multilingual-preprocessor'
          Write-Host 'PRUNE_NOW=matplotlib-demo-import,V3-only-DiT-eager-import'
          Write-Host 'DIRECT_CORE_DEPENDENCY=einops'

      - name: Apply proof-only non-V2ProPlus eager import pruning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $lrPath = '.tmp-gpt-sovits/GPT_SoVITS/AR/modules/lr_schedulers.py'
          $lr = Get-Content $lrPath -Raw
          $lr = $lr -replace '(?m)^from matplotlib import pyplot as plt\r?\n', ''
          Set-Content -Path $lrPath -Value $lr -Encoding UTF8

          $modelsPath = '.tmp-gpt-sovits/GPT_SoVITS/module/models.py'
          $models = Get-Content $modelsPath -Raw
          $models = $models -replace '(?m)^from f5_tts\.model import DiT\r?\n', ''
          Set-Content -Path $modelsPath -Value $models -Encoding UTF8

          if ((Get-Content $lrPath -Raw) -match 'from matplotlib import pyplot as plt') { throw 'Failed to prune demo-only matplotlib import' }
          if ((Get-Content $modelsPath -Raw) -match 'from f5_tts\.model import DiT') { throw 'Failed to prune V3-only DiT eager import' }
          Write-Host 'MATPLOTLIB_PRODUCT_DEPENDENCY=NO'
          Write-Host 'X_TRANSFORMERS_PRODUCT_DEPENDENCY_FOR_V2PROPLUS=NO'

      - name: Install minimal candidate dependencies without changing canonical core constraints
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          uv pip install --python $python `
            'pytorch-lightning>=2.4' `
            tensorboard `
            'librosa==0.10.2' `
            g2p_en `
            wordsegment `
            einops
          if ($LASTEXITCODE -ne 0) { throw 'Minimal VoiceLab candidate dependency install failed' }
          uv pip check --python $python
          if ($LASTEXITCODE -ne 0) { throw 'Minimal VoiceLab candidate dependency check failed' }

      - name: Verify canonical core identities survived minimal candidate installation
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -c "import torch, ctranslate2, faster_whisper, transformers, numpy; assert torch.__version__.split('+')[0] == '2.13.0', torch.__version__; assert ctranslate2.__version__ == '4.8.1', ctranslate2.__version__; assert faster_whisper.__version__ == '1.2.1', faster_whisper.__version__; assert transformers.__version__ == '5.15.0', transformers.__version__; assert numpy.__version__ == '2.5.2', numpy.__version__; print('CANONICAL_CORE_IDENTITIES_PRESERVED', torch.__version__, ctranslate2.__version__, faster_whisper.__version__, transformers.__version__, numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical core identity changed during VoiceLab compatibility probe' }

      - name: Verify GPT-SoVITS V2ProPlus core on current canonical versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path 'EngineData/Backend/LocalWorker/WorkerRuntime/.venv/Scripts/python.exe').Path
          $root = (Resolve-Path '.tmp-gpt-sovits/GPT_SoVITS').Path
          $env:PYTHONPATH = $root
          Push-Location $root
          try {
            & $python -c "import pytorch_lightning; from AR.models.t2s_lightning_module import Text2SemanticLightningModule; from AR.models.t2s_model import Text2SemanticDecoder; from module.models import SynthesizerTrn; import process_ckpt; print('TRAINING_MODEL_CORE_IMPORT_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS training/model core import failed' }

            & $python -c "import json; from module.models import SynthesizerTrn; cfg=json.load(open('configs/s2v2ProPlus.json', encoding='utf-8')); m=SynthesizerTrn(cfg['data']['filter_length']//2+1, cfg['train']['segment_size']//cfg['data']['hop_length'], n_speakers=cfg['data']['n_speakers'], version='v2ProPlus', **cfg['model']); assert m.is_v2pro; print('V2PROPLUS_SOVITS_GRAPH_INSTANTIATED', sum(p.numel() for p in m.parameters())); del m"
            if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS V2ProPlus SoVITS graph instantiation failed' }

            & $python -c "from transformers import HubertModel, Wav2Vec2FeatureExtractor; from feature_extractor.cnhubert import CNHubert; from sv import SV; print('V2PROPLUS_ACOUSTIC_CORE_IMPORT_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS V2ProPlus acoustic core import failed' }

            & $python -c "from text.cleaner import clean_text; phones, _, norm = clean_text('Tomorrow we will review the project timeline.', 'en', 'v2'); assert phones and norm; print('ENGLISH_FRONTEND_OK', len(phones), norm)"
            if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS English frontend failed' }

            & $python -c "import yaml; cfg=yaml.safe_load(open('configs/tts_infer.yaml', encoding='utf-8')); assert cfg['v2ProPlus']['version']=='v2ProPlus'; print('V2PROPLUS_CONFIG_CONTRACT_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS V2ProPlus config contract failed' }
          }
          finally {
            Pop-Location
          }

      - name: Verify rejected dependencies stayed out of the candidate environment
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -c "import importlib.util; rejected=['torchaudio','matplotlib','pandas','gradio','funasr','modelscope','fastapi','peft','x_transformers']; present=[name for name in rejected if importlib.util.find_spec(name) is not None]; assert not present, present; print('REJECTED_DEPENDENCIES_ABSENT', rejected)"
          if ($LASTEXITCODE -ne 0) { throw 'Out-of-scope dependency entered the candidate environment' }

      - name: Re-run TranslateIT worker deterministic tests after compatibility mutation
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'TranslateIT worker tests regressed after VoiceLab candidate install' }

      - name: Report bounded proof result
        shell: pwsh
        run: |
          Write-Host 'VOICELAB_SINGLE_RUNTIME_CORE_COMPATIBILITY=PASS'
          Write-Host 'CANONICAL_CORE_VERSION_CHANGES=NONE'
          Write-Host 'UPSTREAM_FULL_REQUIREMENTS_ADOPTED=NO'
          Write-Host 'REJECTED_WRAPPER_DEPENDENCIES_ADOPTED=NO'
          Write-Host 'DIRECT_ADDITIONAL_CORE_DEPENDENCY=einops'
          Write-Host 'REQUIRED_A2_ADAPTER=English-only text preprocessing + exact TSV/data loading + bounded audio load/resample + V2ProPlus-only inference wrapper'
          Write-Host 'CLAIM_BOUNDARY=dependency-resolution-model-core-import-v2proplus-graph-English-frontend-only'
          Write-Host 'NOT_PROVEN=pretrained-weight-load-training-generated-audio-speaker-fidelity-cuda-vram-latency-meeting-audio'
