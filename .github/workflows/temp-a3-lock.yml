name: Temporary A3 Cargo Lock

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a3-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
      - name: Materialize only the VoiceLab resampler lock delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = 'EngineData/Frontend/RustApp/src-tauri/Cargo.lock'
          git show d5b551f9a2c6d9efb5775e5ddbda550d299f7f4c:$lock | Set-Content -Path $lock -Encoding utf8
          cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed while minimally updating Cargo.lock' }

          $numstat = git diff --numstat -- $lock
          if (-not $numstat) { throw 'Expected a bounded Cargo.lock update for rubato, but no lock delta was produced' }
          $parts = $numstat -split '\s+'
          $changed = [int]$parts[0] + [int]$parts[1]
          if ($changed -gt 200) { throw "Cargo.lock delta is too broad for one VoiceLab dependency: $changed changed lines" }

          git diff -- $lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lock
          git commit -m 'Narrow VoiceLab resampler lock delta'
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock commit failed' }
          git push origin HEAD:New
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock push failed' }
