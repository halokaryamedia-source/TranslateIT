name: Stable Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable:
    name: Stable release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require Local release source
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || { echo "Stable promotion must come from this repository." >&2; exit 1; }
          test "$HEAD_REF" = "Local" || { echo "Stable promotion must come from Local." >&2; exit 1; }
      - name: Require Local manual source
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "Local" || { echo "Manual Stable Release Gate must run on Local." >&2; exit 1; }
      - name: Checkout merge candidate/current stable tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - name: Repository contract
        run: python tools/verify_repository.py
      - name: Frontend contract
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          npm run typecheck
          npm run validate:command-parity
          npm run validate:virtual-route
          npm run build:frontend
      - name: Python lock and source contract
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          uv lock --check
          python -m compileall -q .
      - name: MiLMMT repository contract
        run: python tools/translation_quality/validate_canonical_milmmt_repo.py
      - name: Release source validators
        working-directory: EngineData/Frontend/RustApp
        run: |
          node --check scripts/generate_third_party_notices.mjs
          node scripts/validate_tauri_package_preflight.mjs
          node scripts/validate_release_package_contract.mjs
      - name: Install Linux Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libasound2-dev patchelf
      - name: Rust contract
        working-directory: EngineData/Frontend/RustApp/src-tauri
        run: cargo check --locked
      - name: Stable boundary reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Source branch: Local"
          echo "Required merge method: normal merge commit"
          echo "This validates GitHub's pull-request merge candidate."
          echo "Do not merge main-only stable markers back into Local for ancestry cosmetics."
