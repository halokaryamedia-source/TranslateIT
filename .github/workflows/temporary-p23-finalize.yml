name: Temporary P2.3 Canonical State Finalize

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-p23-finalize.yml

permissions:
  contents: write

jobs:
  finalize-p23-state:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Record bounded P2.3 remote evidence
        shell: pwsh
        run: python .tmp/p23_finalize.py

      - name: Validate canonical-state-only change
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $expected = @('CONTEXT.md', 'docs/knowledge/next-action.md')
          foreach ($path in $changed) {
            if ($expected -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "Expected changed path missing: $path" }
          }
          git diff --stat

      - name: Commit canonical P2.3 state
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add CONTEXT.md docs/knowledge/next-action.md
          git commit -m "Record remote P2.3 model execution proof"
          git push origin HEAD:New
