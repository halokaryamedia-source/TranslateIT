name: Temporary First Setup P4 State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-first-setup-p4-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - name: Update canonical next action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/knowledge/next-action.md')
          text = path.read_text(encoding='utf-8')

          old_mode = '**Developing / Frontend P3 Shell Status Cleanup CLOSED — P4 FIRST SETUP POLISH NEXT**'
          new_mode = '**Developing / Frontend P4 First Setup Polish CLOSED — P5 FRONTEND SOURCE CLOSURE AUDIT NEXT**'
          if old_mode not in text:
              raise SystemExit('current mode anchor not found')
          text = text.replace(old_mode, new_mode, 1)

          marker = '## Existing Source-Closed Boundaries\n'
          section_lines = [
              '## Frontend P4 First Setup Polish Closure',
              '',
              'The bounded First Setup normal-user polish wave is source-closed at the existing `FirstSetup.svelte` owner. The wizard keeps the same five persisted checkpoints, setup state transitions, candidate device transactions, readiness checks, Set Up Later behavior, My Voice handoff, setup repair, and completion rules.',
              '',
              'The progress header now presents `Step X of 5` without a redundant percentage; the existing progress bar still derives from the same five-step checkpoint value. Step 4 now uses ordinary `Meeting microphone` language: the instruction asks the user to choose the exact microphone shown in their meeting app, and the status detail explains that TranslateIT uses that microphone to send the English voice into the meeting. The previous `paired virtual-audio route` implementation wording and the `Meeting microphone device` label were removed from the normal setup surface.',
              '',
              'No readiness logic, audio route, device selection transaction, persisted schema, setup checkpoint semantics, My Voice behavior, or new wizard/state/component owner was changed.',
              '',
              'Accepted hosted source proof:',
              '',
              '```text',
              'run 31799647424',
              'First Setup P4 normal-user contract -> PASS',
              'bounded single-owner frontend change -> PASS',
              'frontend typecheck -> PASS',
              'frontend production build -> PASS',
              'source commit -> df8c54b588bfb3d27dca299660547e4cd2bc9ebb',
              '```',
              '',
              'The temporary P4 patch/proof files were removed after the successful proof.',
              '',
          ]
          section = '\n'.join(section_lines) + '\n'
          if '## Frontend P4 First Setup Polish Closure' not in text:
              if marker not in text:
                  raise SystemExit('source-closed marker not found')
              text = text.replace(marker, section + marker, 1)

          old_list = 'Frontend P3 shell / Meeting status redundancy cleanup\nP3 private Python/runtime/model packaging contract'
          new_list = 'Frontend P3 shell / Meeting status redundancy cleanup\nFrontend P4 First Setup normal-user polish\nP3 private Python/runtime/model packaging contract'
          if old_list in text:
              text = text.replace(old_list, new_list, 1)

          old_next = '**P4 — First Setup normal-user polish. Keep the existing five persisted setup checkpoints, device transactions, readiness checks, Set Up Later behavior, My Voice handoff, and completion rules, but remove the redundant percentage beside `Step X of 5`, simplify the remaining normal-user copy that mentions a paired virtual-audio route, and make the Meeting microphone instruction read like the rest of the product. Do not change setup state semantics, audio routing, readiness logic, or add new wizard/state/component systems.**'
          new_next = '**P5 — Frontend source-closure audit. Review the current normal-user frontend owners and shared UI primitives against PR-166 and the completed P0-P4 alignment waves for any remaining concrete inconsistency, technical leakage, redundant status/action, or AI-slop. Do not create cosmetic churn, a new design system, or another abstraction wave; patch only issues with a clear current source owner and current acceptance value. If no concrete source issue remains, record `No change required` and keep rendered/local Windows validation deferred by the user.**'
          if old_next not in text:
              raise SystemExit('current Next Step anchor not found')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical state
        shell: bash
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -m 'Close First Setup P4 frontend polish'
          git push origin HEAD:New
