name: Temporary R3 Controlled Installer Rehearsal

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r3-controlled-installer-rehearsal.yml

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Show hosted capacity and toolchain
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          node --version
          npm --version
          python --version
          rustc --version
          cargo --version

      - name: Align temporary staging harness to proven private-Python contract
        shell: pwsh
        run: |
          $env:STAGE_SCRIPT=(Resolve-Path '.github/scripts/temp-r3-stage-release.ps1').Path
          @'
          import os
          from pathlib import Path
          path=Path(os.environ['STAGE_SCRIPT'])
          text=path.read_text(encoding='utf-8-sig')
          old="""Expand-Archive -LiteralPath $pythonZip -DestinationPath $PythonRoot -Force
          & (Join-Path $PythonRoot 'python.exe') --version
          """
          new="""Expand-Archive -LiteralPath $pythonZip -DestinationPath $PythonRoot -Force
          @('python312.zip','.','..\\WorkerRuntime') | Set-Content -LiteralPath (Join-Path $PythonRoot 'python312._pth') -Encoding ascii
          & (Join-Path $PythonRoot 'python.exe') --version
          """
          if old not in text:
              raise SystemExit('temporary CPython extraction anchor missing')
          text=text.replace(old,new,1)
          old="""source_url=https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          archive_md5=$pythonMd5
          archive_sha256=$pythonSha
          """
          new="""source_url=https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          archive_bytes=$((Get-Item $pythonZip).Length)
          archive_md5=$pythonMd5
          archive_sha256=$pythonSha
          """
          if old not in text:
              raise SystemExit('temporary CPython provenance anchor missing')
          text=text.replace(old,new,1)
          old="$env:PYTHONPATH=$Worker\n$env:SOURCE_ROOT=$VoiceSource"
          new="$env:SOURCE_ROOT=$VoiceSource"
          if old not in text:
              raise SystemExit('temporary PYTHONPATH proof anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text, encoding='utf-8')
          print('[r3] temporary staging harness aligned to isolated sibling WorkerRuntime path')
          '@ | Set-Content "$env:RUNNER_TEMP\align_stage.py" -Encoding utf8
          python "$env:RUNNER_TEMP\align_stage.py"

      - name: Stage exact controlled release inputs
        shell: pwsh
        run: .github/scripts/temp-r3-stage-release.ps1

      - name: Complete reviewed Python wheel license material
        shell: pwsh
        run: python .github/scripts/temp-r3-stage-python-license-material.py

      - name: Install frozen frontend release tooling
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          npm run typecheck
          node scripts/validate_release_package_contract.mjs

      - name: Generate notices and prove full staged payload
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node scripts/generate_third_party_notices.mjs --write
          npm run preflight:release-payload

      - name: Disable NSIS compression for size-boundary probe
        shell: pwsh
        run: |
          $env:CONFIG=(Resolve-Path 'EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json').Path
          @'
          import json, os
          from pathlib import Path
          path=Path(os.environ['CONFIG'])
          data=json.loads(path.read_text(encoding='utf-8'))
          bundle=data.setdefault('bundle', {})
          windows=bundle.setdefault('windows', {})
          nsis=windows.setdefault('nsis', {})
          nsis['compression']='none'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('[r3] temporary NSIS compression=none probe configured')
          '@ | Set-Content "$env:RUNNER_TEMP\set_nsis_none.py" -Encoding utf8
          python "$env:RUNNER_TEMP\set_nsis_none.py"

      - name: Rehearse controlled Tauri NSIS build
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          ./scripts/build_release.ps1

      - name: Verify generated NSIS installer evidence
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          $bundle=Join-Path (Get-Location) 'src-tauri\target\release\bundle\nsis'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) { throw 'NSIS output directory missing.' }
          $installers=@(Get-ChildItem -LiteralPath $bundle -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer=$installers[0]
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          Write-Host "[r3][installer] name=$($installer.Name)"
          Write-Host "[r3][installer] bytes=$($installer.Length)"
          Write-Host "[r3][installer] sha256=$hash"
          if ($installer.Length -le 0) { throw 'Generated installer is empty.' }
          Write-Host '[r3][installer] controlled NSIS generation -> PASS'

      - name: Final disk report
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
