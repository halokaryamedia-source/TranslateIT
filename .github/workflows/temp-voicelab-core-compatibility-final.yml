name: Temporary VoiceLab Core Compatibility Final

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temp-voicelab-core-compatibility-final.yml
  workflow_dispatch:

jobs:
  bounded-core-proof:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout TranslateIT
        uses: actions/checkout@v4

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Prove canonical worker baseline
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --dev
          if ($LASTEXITCODE -ne 0) { throw 'canonical uv sync failed' }
          uv run python -c "import torch, ctranslate2, faster_whisper, transformers, numpy; print('BASELINE', torch.__version__, ctranslate2.__version__, faster_whisper.__version__, transformers.__version__, numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'canonical identity probe failed' }
          uv run pytest
          if ($LASTEXITCODE -ne 0) { throw 'canonical worker tests failed' }

      - name: Fetch audited GPT-SoVITS revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = 'd523079fc05d9a8028d6085bffe4a2757c32abb6'
          git init .tmp-gpt-sovits
          git -C .tmp-gpt-sovits remote add origin https://github.com/RVC-Boss/GPT-SoVITS.git
          git -C .tmp-gpt-sovits fetch --depth 1 origin $sha
          if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS fetch failed' }
          git -C .tmp-gpt-sovits checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'GPT-SoVITS checkout failed' }
          $actual = (git -C .tmp-gpt-sovits rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw "revision mismatch: $actual" }
          Write-Host "GPT_SOVITS_REVISION=$actual"

      - name: Prove and prune only non-core eager imports in temporary source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.tmp-gpt-sovits/GPT_SoVITS'

          $lrPath = "$root/AR/modules/lr_schedulers.py"
          $lr = Get-Content $lrPath -Raw
          if ($lr -notmatch 'from matplotlib import pyplot as plt') { throw 'matplotlib demo import not found' }
          $runtimePart = ($lr -split 'if __name__ == "__main__":')[0]
          if (($runtimePart -replace 'from matplotlib import pyplot as plt', '') -match '\bplt\.') { throw 'matplotlib is runtime scheduler behavior' }

          $modelsPath = "$root/module/models.py"
          $models = Get-Content $modelsPath -Raw
          if ($models -notmatch 'from f5_tts\.model import DiT') { throw 'V3 DiT eager import not found' }
          $v2Model = ($models -split 'class SynthesizerTrn\(nn\.Module\):', 2)[1]
          $v2Model = ($v2Model -split 'class SynthesizerTrnV3\(nn\.Module\):', 2)[0]
          if ($v2Model -match '\bDiT\(') { throw 'V2ProPlus SynthesizerTrn actually uses DiT' }

          $hubertPath = "$root/feature_extractor/cnhubert.py"
          $hubert = Get-Content $hubertPath -Raw
          if ($hubert -notmatch 'import utils') { throw 'CNHubert demo utils import not found' }
          $hubertRuntime = ($hubert -split 'if __name__ == "__main__":')[0]
          if (($hubertRuntime -replace 'import utils', '') -match '\butils\.') { throw 'CNHubert runtime actually uses broad utils' }

          $lr = $lr.Replace("from matplotlib import pyplot as plt`r`n", '').Replace("from matplotlib import pyplot as plt`n", '')
          $models = $models.Replace("from f5_tts.model import DiT`r`n", '').Replace("from f5_tts.model import DiT`n", '')
          $hubert = $hubert.Replace("import utils`r`n", '').Replace("import utils`n", '')
          Set-Content $lrPath $lr -Encoding UTF8
          Set-Content $modelsPath $models -Encoding UTF8
          Set-Content $hubertPath $hubert -Encoding UTF8

          if ((Get-Content $lrPath -Raw) -match 'from matplotlib import pyplot as plt') { throw 'matplotlib prune failed' }
          if ((Get-Content $modelsPath -Raw) -match 'from f5_tts\.model import DiT') { throw 'DiT prune failed' }
          if ((Get-Content $hubertPath -Raw) -match 'import utils') { throw 'CNHubert utils prune failed' }

          Write-Host 'PRUNED_NON_CORE_EAGER_IMPORTS=matplotlib-demo,V3-DiT,CNHubert-demo-utils'

      - name: Install only proven core additions
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          uv pip install --python $python 'pytorch-lightning>=2.4' einops
          if ($LASTEXITCODE -ne 0) { throw 'bounded core dependency install failed' }
          uv pip check --python $python
          if ($LASTEXITCODE -ne 0) { throw 'bounded dependency check failed' }

      - name: Prove canonical package identities remain unchanged
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -c "import torch, ctranslate2, faster_whisper, transformers, numpy; assert torch.__version__.split('+')[0]=='2.13.0'; assert ctranslate2.__version__=='4.8.1'; assert faster_whisper.__version__=='1.2.1'; assert transformers.__version__=='5.15.0'; assert numpy.__version__=='2.5.2'; print('CORE_IDENTITIES_UNCHANGED')"
          if ($LASTEXITCODE -ne 0) { throw 'canonical core package identity changed' }

      - name: Prove V2ProPlus model core compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path 'EngineData/Backend/LocalWorker/WorkerRuntime/.venv/Scripts/python.exe').Path
          $repoRoot = (Resolve-Path '.tmp-gpt-sovits').Path
          $engineRoot = (Resolve-Path '.tmp-gpt-sovits/GPT_SoVITS').Path
          $env:PYTHONPATH = "$repoRoot;$engineRoot"
          Push-Location $repoRoot
          try {
            & $python -c "import pytorch_lightning; from GPT_SoVITS.AR.models.t2s_lightning_module import Text2SemanticLightningModule; from GPT_SoVITS.AR.models.t2s_model import Text2SemanticDecoder; from GPT_SoVITS.module.models import SynthesizerTrn; print('GPT_MODEL_CORE_IMPORT_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'GPT model core import failed' }

            & $python -c "import json; from GPT_SoVITS.module.models import SynthesizerTrn; cfg=json.load(open('GPT_SoVITS/configs/s2v2ProPlus.json', encoding='utf-8')); m=SynthesizerTrn(cfg['data']['filter_length']//2+1, cfg['train']['segment_size']//cfg['data']['hop_length'], n_speakers=cfg['data']['n_speakers'], version='v2ProPlus', **cfg['model']); assert m.is_v2pro; print('V2PROPLUS_GRAPH_OK', sum(p.numel() for p in m.parameters())); del m"
            if ($LASTEXITCODE -ne 0) { throw 'V2ProPlus graph instantiation failed' }

            & $python -c "from transformers import HubertModel, Wav2Vec2FeatureExtractor; from GPT_SoVITS.feature_extractor.cnhubert import CNHubert; from GPT_SoVITS.sv import SV; print('V2PROPLUS_ACOUSTIC_CORE_IMPORT_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'V2ProPlus acoustic core import failed' }

            & $python -c "import yaml; cfg=yaml.safe_load(open('GPT_SoVITS/configs/tts_infer.yaml', encoding='utf-8')); assert cfg['v2ProPlus']['version']=='v2ProPlus'; print('V2PROPLUS_CONFIG_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'V2ProPlus config contract failed' }
          }
          finally { Pop-Location }

      - name: Prove broad wrappers are deliberately not product dependencies
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -c "import importlib.util; rejected=['torchaudio','librosa','matplotlib','pandas','gradio','funasr','modelscope','peft','x_transformers','g2p_en','wordsegment','tensorboard']; present=[x for x in rejected if importlib.util.find_spec(x) is not None]; assert not present, present; print('BROAD_WRAPPERS_ABSENT')"
          if ($LASTEXITCODE -ne 0) { throw 'broad wrapper dependency entered candidate environment' }

      - name: Re-prove TranslateIT worker after bounded compatibility mutation
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'TranslateIT deterministic tests regressed' }

      - name: Report exact A1 claim boundary
        shell: pwsh
        run: |
          Write-Host 'VOICELAB_A1_SINGLE_RUNTIME_CORE_COMPATIBILITY=PASS'
          Write-Host 'ADOPTED_CORE_CANDIDATES=pytorch-lightning,einops'
          Write-Host 'NOT_ADOPTED=full-upstream-requirements,torchaudio,librosa,matplotlib,pandas,gradio,funasr,modelscope,peft,x_transformers,g2p_en,wordsegment,tensorboard'
          Write-Host 'A2_MUST_OWN=English-offline-frontend,exact-guided-dataset-loader,bounded-WAV-load-resample,V2ProPlus-inference-wrapper,build-lifecycle'
          Write-Host 'NOT_PROVEN=pretrained-weight-load,training,generated-speech,speaker-fidelity,CUDA,VRAM,latency,Meeting-audio,packaging'
