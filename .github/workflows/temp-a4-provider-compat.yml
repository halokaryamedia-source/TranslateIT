name: Temporary A4 Lock Generation

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a4-provider-compat.yml
  workflow_dispatch:

jobs:
  lock:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate lock from canonical pyproject
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check uv
          if ($LASTEXITCODE -ne 0) { throw 'uv bootstrap failed' }
          uv lock
          if ($LASTEXITCODE -ne 0) { throw 'uv lock failed' }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw 'generated uv.lock is inconsistent' }
          Write-Host 'A4_LOCK_GENERATION=PASS'
      - name: Guard generated change surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -ne 'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock' })
          if ($unexpected.Count -gt 0) { throw "uv lock changed unexpected files: $($unexpected -join ', ')" }
          Write-Host 'A4_LOCK_CHANGE_SURFACE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: a4-worker-lock
          path: EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock
          if-no-files-found: error
          retention-days: 1
