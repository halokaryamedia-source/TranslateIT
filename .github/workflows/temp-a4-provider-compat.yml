name: Temporary A4 Exact Lock Blob

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a4-provider-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-blob:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate canonical lock from clean state
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check uv
          if ($LASTEXITCODE -ne 0) { throw 'uv bootstrap failed' }

          Remove-Item -Force uv.lock
          uv lock
          if ($LASTEXITCODE -ne 0) { throw 'clean uv lock generation failed' }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw 'clean generated uv.lock is inconsistent' }

          $localSha = (git hash-object uv.lock).Trim()
          $sha256 = (Get-FileHash uv.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'uv.lock'))
          $payload = @{
            content = [Convert]::ToBase64String($bytes)
            encoding = 'base64'
          } | ConvertTo-Json -Compress
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs"
          $response = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload
          if ($response.sha -ne $localSha) { throw "GitHub blob SHA mismatch: local=$localSha remote=$($response.sha)" }
          Write-Host "A4_EXACT_LOCK_BLOB_SHA=$localSha"
          Write-Host "A4_EXACT_LOCK_SHA256=$sha256"
