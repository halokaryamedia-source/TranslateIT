name: Temporary A4 Provider Compatibility

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a4-provider-compat.yml
  workflow_dispatch:

jobs:
  provider-compat:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: RVC-Boss/GPT-SoVITS
          ref: d523079fc05d9a8028d6085bffe4a2757c32abb6
          path: upstream-gptsovits
      - name: Materialize current worker runtime
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check uv
          if ($LASTEXITCODE -ne 0) { throw 'uv bootstrap failed' }
          uv sync --frozen --no-install-project
          if ($LASTEXITCODE -ne 0) { throw 'current worker lock failed' }
      - name: Install one-runtime Torch candidate
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          uv pip install --python $python --index-url https://download.pytorch.org/whl/cu126 'torch==2.11.0' 'torchaudio==2.11.0'
          if ($LASTEXITCODE -ne 0) { throw 'Torch 2.11 / TorchAudio 2.11 candidate install failed' }
      - name: Install bounded A4 candidate dependencies
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          uv pip install --python $python `
            'transformers>=4.44.0,<=4.50.0' 'numpy<2.0' scipy pandas tensorboard 'librosa==0.10.2' numba `
            'pytorch-lightning>=2.4' ffmpeg-python tqdm cn2an pypinyin g2p_en 'peft<0.18.0' `
            PyYAML psutil jieba_fast jieba split-lang 'fast_langdetect>=0.3.1' wordsegment `
            rotary_embedding_torch x_transformers 'torchmetrics<=1.5' matplotlib
          if ($LASTEXITCODE -ne 0) { throw 'bounded A4 dependency install failed' }
      - name: Prepare explicit English NLTK assets
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          $nltkRoot = Join-Path $env:RUNNER_TEMP 'voice-lab-nltk'
          New-Item -ItemType Directory -Force -Path $nltkRoot | Out-Null
          & $python -m nltk.downloader -d $nltkRoot averaged_perceptron_tagger averaged_perceptron_tagger_eng cmudict
          if ($LASTEXITCODE -ne 0) { throw 'VoiceLab NLTK asset preparation failed' }
          "NLTK_DATA=$nltkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preserve current TranslateIT worker imports
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          & $python -c "import torch, transformers, realtime_local_worker; assert torch.__version__.split('+')[0]=='2.11.0'; assert tuple(map(int, transformers.__version__.split('.')[:2])) >= (4,44); assert tuple(map(int, transformers.__version__.split('.')[:2])) <= (4,50); assert realtime_local_worker.torch_status()['import_ready']; print('A4_CURRENT_WORKER_IMPORTS=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'current TranslateIT worker compatibility failed' }
      - name: Prove English resources are offline-owned
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          & $python -c "import nltk; nltk.download=lambda *a, **k: (_ for _ in ()).throw(RuntimeError('network_download_forbidden')); from g2p_en import G2p; phones=G2p()('VoiceLab keeps English speech local.'); assert phones; print('A4_NLTK_OFFLINE=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'VoiceLab offline English resource probe failed' }
      - name: Import exact headless English V2ProPlus path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = (Resolve-Path 'EngineData\Backend\LocalWorker\WorkerRuntime').Path
          $python = (Resolve-Path 'EngineData\Backend\LocalWorker\WorkerRuntime\.venv\Scripts\python.exe').Path
          $root = (Resolve-Path 'upstream-gptsovits').Path
          $gsv = Join-Path $root 'GPT_SoVITS'
          $env:PYTHONPATH = "$worker;$root;$gsv"
          $env:version = 'v2ProPlus'
          Push-Location $root
          try {
            $probe = @'
import sys
from pathlib import Path
import nltk
nltk.download = lambda *a, **k: (_ for _ in ()).throw(RuntimeError('network_download_forbidden'))
from voice_lab_upstream_stage import install_headless_my_utils
source = Path.cwd()
install_headless_my_utils(source)
import torch, torchaudio
assert torch.__version__.split('+')[0] == '2.11.0'
assert torchaudio.__version__.split('+')[0] == '2.11.0'
import text.english
assert text.english.g2p('VoiceLab keeps English speech local.')
import feature_extractor.cnhubert
import sv
import AR.data.data_module
import AR.models.t2s_lightning_module
import module.commons
import module.data_utils
import module.losses
import module.mel_processing
import module.models
import process_ckpt
import s1_train
import TTS_infer_pack.TTS
assert 'gradio' not in sys.modules
print('A4_PROVIDER_IMPORTS=PASS')
'@
            & $python -c $probe
            if ($LASTEXITCODE -ne 0) { throw 'pinned GPT-SoVITS headless import probe failed' }
            & $python -m py_compile GPT_SoVITS\s1_train.py GPT_SoVITS\s2_train.py GPT_SoVITS\prepare_datasets\1-get-text.py GPT_SoVITS\prepare_datasets\2-get-hubert-wav32k.py GPT_SoVITS\prepare_datasets\2-get-sv.py GPT_SoVITS\prepare_datasets\3-get-semantic.py
            if ($LASTEXITCODE -ne 0) { throw 'pinned GPT-SoVITS trainer/preprocess syntax probe failed' }
          } finally {
            Pop-Location
          }
      - name: Reject unrelated provider surface
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '.venv\Scripts\python.exe'
          $freeze = & $python -m pip list --format freeze
          foreach ($name in @('gradio','funasr','modelscope','onnxruntime-gpu')) {
            if ($freeze -match "(?im)^$([regex]::Escape($name))==") { throw "unrelated provider dependency installed: $name" }
          }
          & $python -m py_compile voice_lab_build.py voice_lab_gpt_sovits.py voice_lab_upstream_stage.py
          if ($LASTEXITCODE -ne 0) { throw 'VoiceLab Python source syntax failed' }
          Write-Host 'A4_PROVIDER_SCOPE=PASS'
