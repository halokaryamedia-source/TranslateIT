name: TranslateIT RustApp Internal Validation

on:
  pull_request:
    branches:
      - Developing
  workflow_dispatch:

jobs:
  rustapp-internal-validation:
    name: Rust/Tauri internal validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EngineData/LauncherApp/RustApp/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate repository runtime boundaries
        run: |
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_app.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_runtime_boundaries.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_runtime_command_registration.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_validation_evidence_boundary.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_output_boundary.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_rust_model_boundary.py
          python DevelopingData/ToolKitData/Scripts/Execution/check_local_realtime_worker_stack.py

      - name: Install RustApp dependencies
        working-directory: EngineData/LauncherApp/RustApp
        run: npm install

      - name: TypeScript typecheck
        working-directory: EngineData/LauncherApp/RustApp
        run: npm run typecheck

      - name: Rust cargo check
        working-directory: EngineData/LauncherApp/RustApp
        run: npm run check:rust

      - name: Frontend build
        working-directory: EngineData/LauncherApp/RustApp
        run: npm run build:frontend

      - name: Tauri build contract check
        working-directory: EngineData/LauncherApp/RustApp
        run: npm run build

      - name: Write internal validation evidence
        if: always()
        run: |
          python DevelopingData/ToolKitData/Scripts/Execution/write_rustapp_validation_evidence.py true true true true true true

      - name: Upload internal validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustapp-internal-validation-evidence
          path: UserData/LogData/RustAppValidation/latest_validation_evidence.json
