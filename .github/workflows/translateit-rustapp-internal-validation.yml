name: TranslateIT RustApp Internal Validation

on:
  workflow_dispatch:

jobs:
  rustapp-internal-validation:
    name: Rust/Tauri internal validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EngineData/LauncherApp/RustApp/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run internal validation runner
        run: .\DevelopingData\ToolKitData\Scripts\Execution\run_rustapp_final_validation.ps1

      - name: Upload internal validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustapp-internal-validation-evidence
          path: UserData/LogData/RustAppValidation/latest_validation_evidence.json
          if-no-files-found: warn
