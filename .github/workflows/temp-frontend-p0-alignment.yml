name: Temporary Frontend P0 Alignment

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-frontend-p0-alignment.yml

permissions:
  contents: write

jobs:
  align-and-prove:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Apply bounded P0 alignment
        shell: pwsh
        run: |
          python .github/scripts/temp-frontend-p0-alignment.py
          git diff --check
      - name: Verify no backend source changed
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'EngineData/Frontend/RustApp/src/App.svelte',
            'EngineData/Frontend/RustApp/src/pages/FirstSetup.svelte',
            'EngineData/Frontend/RustApp/src/pages/Meeting.svelte'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected product-source change: $path" }
          }
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Frontend typecheck
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck
      - name: Frontend production build
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Commit P0 alignment
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/src/App.svelte EngineData/Frontend/RustApp/src/pages/FirstSetup.svelte EngineData/Frontend/RustApp/src/pages/Meeting.svelte
          git commit -m 'Align First Setup and Meeting My Voice UX'
          git push origin HEAD:New
