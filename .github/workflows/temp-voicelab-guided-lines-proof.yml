name: Temporary VoiceLab Guided Lines Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-voicelab-guided-lines-proof.yml

jobs:
  source-proof:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Validate guided script contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          path = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/voice_lab_recording.rs')
          text = path.read_text(encoding='utf-8')
          block = text.split('const GUIDED_LINES: &[(u32, &str)] = &[', 1)[1].split('];', 1)[0]
          entries = re.findall(r'^\s*\((\d+),\s*"(.*)"\),\s*$', block, re.MULTILINE)
          if len(entries) != 32:
              raise SystemExit(f'Expected exactly 32 guided lines, found {len(entries)}')
          ids = [int(line_id) for line_id, _ in entries]
          if ids != list(range(1, 33)):
              raise SystemExit(f'Guided line IDs must remain contiguous 1..32, found {ids}')
          texts = [value for _, value in entries]
          if len(set(texts)) != len(texts):
              raise SystemExit('Guided lines must have unique exact text')
          if any(len(value.split()) < 8 for value in texts):
              raise SystemExit('Guided script contains an unexpectedly short line')
          held_out = [
              'Please confirm the final schedule before we send the update to the client.',
              'The system should remain clear and natural during a longer technical discussion.',
              'I can review the latest results tomorrow morning and share my decision with the team.',
          ]
          if set(texts).intersection(held_out):
              raise SystemExit('Training guided lines must not reuse held-out evaluation text')
          print('[guided-lines] 32 unique contiguous training lines with no held-out text reuse -> PASS')
          '@ | python -
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Frontend typecheck
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck
      - name: Frontend production build
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Rust compile with warnings denied
        shell: pwsh
        run: |
          $env:RUSTFLAGS='-Dwarnings'
          cargo check --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Read-only closure guard
        run: git diff --exit-code
