name: TranslateIT V1 Advance Primary CI

on:
  push:
    branches: [V1-Advance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translateit-v1-advance-primary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-validation:
    name: Bootstrap Validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'DevelopingData/Documentation/Reports/Engineering/ACTIVE_DOCUMENTATION_INDEX.md',
            'DevelopingData/Documentation/Reports/Engineering/V1_ADVANCE_PRIMARY_SOURCE_BRANCH_POLICY.md',
            'DevelopingData/Documentation/Reports/Engineering/V1_ADVANCE_PRODUCT_REQUIREMENTS.md',
            'EngineData/Frontend/RustApp/package.json'
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing file: $file" }
          }
          Write-Host 'V1-Advance bootstrap validation passed.'

  policy-validator:
    name: Policy Validator
    runs-on: windows-latest
    timeout-minutes: 10
    needs: bootstrap-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V1-Advance policy validator
        run: node EngineData/Frontend/RustApp/scripts/validate_v1_advance_policy.mjs

  dependency-probe:
    name: Dependency Probe
    runs-on: windows-latest
    timeout-minutes: 15
    needs: policy-validator
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies only
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }
          if (!(Test-Path 'node_modules')) { throw 'node_modules was not created.' }
          Write-Host 'Dependency probe passed.'

  typescript-gate:
    name: TypeScript Gate
    runs-on: windows-latest
    timeout-minutes: 15
    needs: dependency-probe
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }
      - name: Run TypeScript typecheck
        run: npm run typecheck

  rust-manifest-preflight:
    name: Rust Manifest Preflight
    runs-on: windows-latest
    timeout-minutes: 10
    needs: typescript-gate
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Rust manifest preflight
        run: npm run check:rust

  frontend-build-preflight:
    name: Frontend Build Preflight
    runs-on: windows-latest
    timeout-minutes: 10
    needs: rust-manifest-preflight
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frontend build preflight
        run: npm run preflight:frontend-build

  frontend-build:
    name: Frontend Build Gate
    runs-on: windows-latest
    timeout-minutes: 15
    needs: frontend-build-preflight
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }
      - name: Run frontend build
        run: npm run build:frontend

  rust-toolchain-probe:
    name: Rust Toolchain Probe
    runs-on: windows-latest
    timeout-minutes: 10
    needs: frontend-build
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe Rust toolchain and manifest
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          if (!(Test-Path 'src-tauri/Cargo.toml')) { throw 'src-tauri/Cargo.toml is missing.' }
          Write-Host 'Rust toolchain probe passed.'

  rust-cargo-metadata:
    name: Rust Cargo Metadata Gate
    runs-on: windows-latest
    timeout-minutes: 10
    needs: rust-toolchain-probe
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Cargo metadata
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps
          Write-Host 'Rust Cargo metadata gate passed. Full cargo check remains deferred until Rust source compile errors are fixed with logs.'
