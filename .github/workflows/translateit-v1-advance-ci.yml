name: TranslateIT V1 Advance Primary CI

on:
  push:
    branches: [V1-Advance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translateit-v1-advance-primary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-validation:
    name: Bootstrap Validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'DevelopingData/Documentation/Reports/Engineering/ACTIVE_DOCUMENTATION_INDEX.md',
            'DevelopingData/Documentation/Reports/Engineering/V1_ADVANCE_PRIMARY_SOURCE_BRANCH_POLICY.md',
            'DevelopingData/Documentation/Reports/Engineering/V1_ADVANCE_PRODUCT_REQUIREMENTS.md',
            'EngineData/Frontend/RustApp/package.json'
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing file: $file" }
          }
          Write-Host 'V1-Advance bootstrap validation passed.'
