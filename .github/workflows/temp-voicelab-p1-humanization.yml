name: Temporary VoiceLab P1 Humanization

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-voicelab-p1-humanization.yml

permissions:
  contents: write

jobs:
  humanize-and-prove:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Apply bounded VoiceLab P1 humanization
        shell: pwsh
        run: |
          python .github/scripts/temp-voicelab-p1-humanization.py
          git diff --check
      - name: Verify bounded frontend ownership
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'EngineData/Frontend/RustApp/src/pages/VoiceLab.svelte',
            'EngineData/Frontend/RustApp/src/components/voice-lab/VoiceLabBuild.svelte'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected product-source change: $path" }
          }
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Frontend typecheck
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck
      - name: Frontend production build
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Commit VoiceLab P1 humanization
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/src/pages/VoiceLab.svelte EngineData/Frontend/RustApp/src/components/voice-lab/VoiceLabBuild.svelte
          git commit -m 'Humanize VoiceLab frontend hierarchy'
          git push origin HEAD:New
