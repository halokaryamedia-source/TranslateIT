name: Temporary Backend Wave A7 Lock and Asset Semantics Proof

# One-shot maintenance proof for canonical WorkerRuntime locking and release-vs-Meeting asset ownership.
on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-wave-a7.yml

permissions:
  contents: write

jobs:
  maintain-and-prove:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply bounded Wave A7 source correction
        shell: pwsh
        run: python .tmp/backend_wave_a7_patch.py source

      - name: Normalize temporary Rust test insertion newlines
        shell: pwsh
        run: |
          $targets = @(
            @{ Path = 'EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs'; Marker = '\n#[cfg(test)]\nmod a7_release_inventory_tests' },
            @{ Path = 'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs'; Marker = '\n#[cfg(test)]\nmod a7_meeting_readiness_tests' }
          )
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          foreach ($target in $targets) {
            $path = $target.Path
            $text = [System.IO.File]::ReadAllText((Resolve-Path $path))
            $index = $text.IndexOf($target.Marker)
            if ($index -lt 0) { throw "Temporary A7 test marker missing in $path" }
            $prefix = $text.Substring(0, $index)
            $suffix = $text.Substring($index).Replace('\n', "`n")
            [System.IO.File]::WriteAllText((Resolve-Path $path), $prefix + $suffix, $utf8)
          }

      - name: Install resolver for proof
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input uv
          uv --version

      - name: Generate and check canonical WorkerRuntime lock
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          uv lock
          uv lock --check

      - name: Verify lock and asset ownership semantics
        shell: pwsh
        run: python .tmp/backend_wave_a7_patch.py verify

      - name: Format bounded Rust modules
        shell: pwsh
        run: |
          rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs
          rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs

      - name: Validate PowerShell setup syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'EngineData/Backend/LocalWorker/WorkerRuntime/setup_realtime_worker.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'setup_realtime_worker.ps1 contains PowerShell parse errors.'
          }

      - name: Validate bounded changed scope
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $allowed = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/README.md',
            'EngineData/Backend/LocalWorker/WorkerRuntime/model_manifest.json',
            'EngineData/Backend/LocalWorker/WorkerRuntime/setup_realtime_worker.ps1',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'EngineData/Frontend/RustApp/src/app/bridge/runtimeProductFacade.ts',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs',
            'docs/knowledge/source-ownership.md'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected changed path missing: $path" }
          }
          git diff --stat

      - name: Install proof-only pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "pytest==8.4.2"

      - name: Python worker contract regression tests
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m pytest tests/test_worker_contract.py -q

      - name: Materialize canonical frontend dependencies
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Build frontend prerequisite for Tauri test context
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend

      - name: Targeted Rust A7 ownership tests
        shell: pwsh
        run: cargo test --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml a7_ -- --test-threads=1

      - name: Windows Rust compile baseline
        shell: pwsh
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Native Tauri release build baseline
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npx tauri build --no-bundle

      - name: Record Wave A7 closure state
        shell: pwsh
        run: |
          python .tmp/backend_wave_a7_patch.py closure
          git diff --check

      - name: Commit proven Wave A7 correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add EngineData/Backend/LocalWorker/WorkerRuntime/README.md
          git add EngineData/Backend/LocalWorker/WorkerRuntime/model_manifest.json
          git add EngineData/Backend/LocalWorker/WorkerRuntime/setup_realtime_worker.ps1
          git add EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock
          git add EngineData/Frontend/RustApp/src/app/bridge/runtimeProductFacade.ts
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs
          git add docs/knowledge/source-ownership.md
          git add docs/knowledge/next-action.md
          git commit -m "Lock WorkerRuntime and separate release asset readiness"
          git push origin HEAD:New
