name: Temporary P4 Canonical Owner Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-p4-canonical-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile P4 canonical owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          decision = Path('docs/knowledge/decision-log.md')
          body = decision.read_text(encoding='utf-8')
          if '## D-021 — Initial Meeting Audio Provider Uses Standard VB-CABLE' not in body:
              body += '''\n\n## D-021 — Initial Meeting Audio Provider Uses Standard VB-CABLE\n\n**Decision**  \nFor the initial controlled Windows release, the one bundled Meeting virtual-audio provider direction is the **standard VB-Audio VB-CABLE** package. This is a release/distribution dependency only; the existing Rust/CPAL matched-pair owner remains responsible for runtime detection, generation binding, and translated-audio delivery.\n\nDo not expand the initial provider surface to VB-CABLE A+B/C+D, Voicemeeter, another provider selector, or a custom TranslateIT driver. The provider keeps its VB-Audio identity and donationware notice; TranslateIT must not present the Windows driver as its own implementation.\n\nA concrete release may stage the official provider package only after the applicable redistribution/licensing conditions for that release are satisfied. Source files and source proof do not self-certify those rights. Professional/organizational distribution may require the appropriate vendor licensing rather than assuming end users can satisfy donationware terms individually.\n\nWindows driver elevation/security consent and restart behavior are legitimate installation boundaries. Do not add autoclick, unsigned-driver bypass, certificate workarounds, or another driver layer merely to hide those operating-system requirements. Actual installer invocation, rollback, restart recovery, endpoint appearance, matched-pair behavior, and meeting-application reception require installed/target-Windows evidence.\n\n**Reason**  \nThe standard VB-CABLE pair matches the product's existing one-pair Meeting route without adding a mixer, provider registry, or custom driver. Keeping provider distribution separate from runtime audio ownership preserves the current architecture while giving the one-installer release a bounded provider payload contract.\n\n**Proof status**  \nP4 source policy and packaging ownership are accepted from hosted Windows run `31780383064` at exact checkout SHA `b549ce109f3dc08ac0b8bbb7b5b99b52d64da804`: provider package/resource contract PASS, normal source validation PASS, frontend build PASS, `cargo check --locked` PASS, missing controlled provider payload correctly fail-closed, and read-only closure guard PASS. This does not prove redistribution rights for a concrete release, driver installation, restart handling, endpoint behavior, or physical Meeting audio delivery.\n'''
              decision.write_text(body, encoding='utf-8')

          ownership = Path('docs/knowledge/source-ownership.md')
          body = ownership.read_text(encoding='utf-8')
          replacements = {
              '| Continuation | `docs/knowledge/next-action.md` | P3 RUNTIME PACKAGING SOURCE CLOSED / AUDIO PROVIDER DELIVERY DECISION REQUIRED |': '| Continuation | `docs/knowledge/next-action.md` | P4 PROVIDER POLICY SOURCE-CLOSED / LOCAL VALIDATION USER-DEFERRED |',
              '| Durable decisions | `docs/knowledge/decision-log.md` | ACTIVE / D-020 VOICELAB |': '| Durable decisions | `docs/knowledge/decision-log.md` | ACTIVE / D-021 STANDARD VB-CABLE RELEASE PROVIDER |',
              '| Meeting Microphone route | `commands/virtual_mic_route.rs`, `engine/audio/meeting_output.rs` | ACTIVE / USES ALREADY-INSTALLED MATCHED VIRTUAL PAIR / PROVIDER DELIVERY UNRESOLVED |': '| Meeting Microphone route | `commands/virtual_mic_route.rs`, `engine/audio/meeting_output.rs` | ACTIVE / STANDARD VB-CABLE INITIAL RELEASE PROVIDER / RUST-CPAL RUNTIME OWNER |',
              '| Release resource map | `src-tauri/tauri.release.conf.json` | CLOSED P3 SOURCE-SIDE / DETERMINISTIC `EngineData/Backend` LAYOUT |': '| Release resource map | `src-tauri/tauri.release.conf.json` | CLOSED P4 SOURCE-SIDE / RUNTIME+MODEL+STANDARD VBCABLE PAYLOAD MAP |',
              '| Release payload gate | `scripts/validate_release_payload.mjs` | CLOSED P3 SOURCE-SIDE / FAIL-CLOSED BEFORE INSTALLER BUILD |': '| Release payload gate | `scripts/validate_release_payload.mjs` | CLOSED P4 SOURCE-SIDE / FAIL-CLOSED FOR RUNTIME+MODEL+STANDARD VBCABLE INPUTS |',
          }
          for old, new in replacements.items():
              if old not in body:
                  raise SystemExit(f'source-ownership marker missing: {old}')
              body = body.replace(old, new, 1)
          anchor = '| Release payload gate | `scripts/validate_release_payload.mjs` | CLOSED P4 SOURCE-SIDE / FAIL-CLOSED FOR RUNTIME+MODEL+STANDARD VBCABLE INPUTS |'
          provider_row = '\n| Meeting audio provider release payload | `RuntimeAssets/AudioProvider/VBCABLE`, `src-tauri/tauri.release.conf.json`, release payload validators | STANDARD VB-CABLE POLICY SOURCE-CLOSED / BYTES+LICENSE+INSTALL UNPROVEN |'
          if 'Meeting audio provider release payload' not in body:
              body = body.replace(anchor, anchor + provider_row, 1)
          ownership.write_text(body, encoding='utf-8')

          context = Path('CONTEXT.md')
          body = context.read_text(encoding='utf-8')
          old = '''`tauri.release.conf.json` maps only the production WorkerRuntime files, private `PythonRuntime`, required ASR/translation model roots, and GPT-SoVITS VoiceLab root into the same `EngineData/Backend` installed layout consumed by `ProjectPaths`. It does not bundle the whole repository or whole WorkerRuntime.\n\nThe private/model payload bytes are controlled release inputs and remain outside Git. Release payload validation fails closed when required Python/model/GPT-SoVITS/FFmpeg/NLTK inputs are missing, when the GPT-SoVITS revision marker does not match the approved pin, or when known unapproved GPT-SoVITS WebUI/server/UVR/ASR baggage is staged.'''
          new = '''`tauri.release.conf.json` maps only the production WorkerRuntime files, private `PythonRuntime`, required ASR/translation model roots, GPT-SoVITS VoiceLab root, and the controlled standard VB-Audio VB-CABLE provider payload into the same `EngineData/Backend` installed layout consumed by `ProjectPaths`. It does not bundle the whole repository or whole WorkerRuntime.\n\nThe private/model/provider payload bytes are controlled release inputs and remain outside Git. Release payload validation fails closed when required Python/model/GPT-SoVITS/FFmpeg/NLTK/standard-VB-CABLE inputs are missing, when the GPT-SoVITS revision marker does not match the approved pin, when known unapproved GPT-SoVITS WebUI/server/UVR/ASR baggage is staged, or when known alternate VB-CABLE/Voicemeeter provider payloads are introduced.'''
          if old not in body:
              raise SystemExit('CONTEXT P3 resource-map marker missing')
          body = body.replace(old, new, 1)
          old = 'P3 source proof establishes resource-map ownership and fail-closed release-input contracts only. Actual private Python/model bytes, successful NSIS generation, installed runtime execution, clean-machine behavior, and Meeting audio provider provisioning remain release/target proof or unresolved distribution policy.'
          new = 'P3/P4 source proof establishes resource-map ownership, the standard VB-CABLE initial provider policy, and fail-closed release-input contracts only. Actual private Python/model/provider bytes, applicable redistribution/licensing for a concrete release, successful NSIS generation, driver installation/restart behavior, installed runtime execution, endpoint behavior, and clean-machine operation remain release/target proof.'
          if old not in body:
              raise SystemExit('CONTEXT P3 proof-boundary marker missing')
          body = body.replace(old, new, 1)
          old = 'Hosted Windows proofs now also establish VoiceLab A4 build/evaluation source closure, A5 canonical-worker trained-actor inference, A6 generation-bound MyVoice Meeting integration, the final VoiceLab source closure, and P3 deterministic runtime/model/private-Python packaging source ownership. They still do **not** prove real target MyVoice quality, staged GPT-SoVITS/private-Python payload execution, CUDA/VRAM practicality, actual custom-TTS latency, physical microphone behavior, provider provisioning, Meeting virtual-audio delivery, real Meeting-app reception, sleep/wake behavior during a live custom-voice session, installed execution, or clean-machine behavior.'
          new = 'Hosted Windows proofs now also establish VoiceLab A4 build/evaluation source closure, A5 canonical-worker trained-actor inference, A6 generation-bound MyVoice Meeting integration, the final VoiceLab source closure, P3 deterministic runtime/model/private-Python packaging ownership, and P4 standard VB-CABLE provider staging policy. They still do **not** prove real target MyVoice quality, staged GPT-SoVITS/private-Python/provider payload execution, applicable provider licensing for a concrete release, CUDA/VRAM practicality, actual custom-TTS latency, physical microphone behavior, driver installation/restart, Meeting virtual-audio delivery, real Meeting-app reception, sleep/wake behavior during a live custom-voice session, installed execution, or clean-machine behavior.'
          if old not in body:
              raise SystemExit('CONTEXT hosted-proof marker missing')
          body = body.replace(old, new, 1)
          old = '''Before release, remaining proof/materialization or product decisions include:\n\n```text\nMeeting audio provider distribution/provisioning policy\nactual controlled PythonRuntime + ASR/translation/GPT-SoVITS payload staging\nsuccessful NSIS installer generation with those controlled inputs\nreal trained Voice Actor quality and rebuild acceptance on target Windows\ninstalled private PythonRuntime + model execution and GPU-capable CUDA proof\nWindows Meeting audio/device validation\nStart / Stop / Safe Close / power lifecycle runtime acceptance\ntrained Voice Actor latency / stability / long-session measurement\ninstaller / installed-runtime proof\nclean-machine proof\n```'''
          new = '''Before release, remaining proof/materialization includes:\n\n```text\napplicable standard VB-CABLE redistribution/licensing for the concrete release\nactual controlled PythonRuntime + ASR/translation/GPT-SoVITS + provider payload staging\nsuccessful NSIS installer generation with those controlled inputs\nVB-CABLE driver install / elevation / restart / endpoint validation\nreal trained Voice Actor quality and rebuild acceptance on target Windows\ninstalled private PythonRuntime + model execution and GPU-capable CUDA proof\nWindows Meeting audio/device + meeting-application reception\nStart / Stop / Safe Close / power lifecycle runtime acceptance\ntrained Voice Actor latency / stability / long-session measurement\ninstaller / installed-runtime proof\nclean-machine proof\n```'''
          if old not in body:
              raise SystemExit('CONTEXT remaining-proof marker missing')
          body = body.replace(old, new, 1)
          context.write_text(body, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/knowledge/decision-log.md docs/knowledge/source-ownership.md CONTEXT.md
      - name: Commit canonical sync
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/decision-log.md docs/knowledge/source-ownership.md CONTEXT.md
          git commit -m 'Record P4 audio provider policy'
          git push origin HEAD:New
