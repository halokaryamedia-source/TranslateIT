name: Temporary Windows Tauri Compile Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-windows-tauri-compile-proof.yml

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Materialize frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build:frontend

      - name: Rust manifest preflight
        run: npm run check:rust

      - name: Tauri Rust compile baseline
        run: npm run check:tauri-rust-local
