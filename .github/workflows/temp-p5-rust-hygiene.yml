name: Temporary P5 Rust Source Hygiene

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-p5-rust-hygiene.yml

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend for Tauri context
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Apply bounded warning cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          meeting = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs')
          text = meeting.read_text(encoding='utf-8')
          old = 'struct OutboundTimingContext {'
          if text.count(old) != 1:
              raise SystemExit('OutboundTimingContext marker count changed')
          text = text.replace(old, 'pub(crate) struct OutboundTimingContext {', 1)
          meeting.write_text(text, encoding='utf-8')

          guided = Path('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/guided_take.rs')
          text = guided.read_text(encoding='utf-8')
          old = 'pub const GUIDED_TAKE_BITS_PER_SAMPLE: u16 = 16;\n'
          if text.count(old) != 1:
              raise SystemExit('guided PCM16 dead constant marker count changed')
          text = text.replace(old, '', 1)
          guided.write_text(text, encoding='utf-8')

          output = Path('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs')
          text = output.read_text(encoding='utf-8')
          text = text.replace('    pub cancelled: bool,\n', '', 1)
          text = text.replace('    pub note: String,\n', '', 1)

          old_blocked = '''fn blocked(\n    blocker: &str,\n    note: &str,\n    execution_attempted: bool,\n    cancelled: bool,\n) -> MeetingOutputDeliveryReport {\n    MeetingOutputDeliveryReport {\n        ok: false,\n        execution_attempted,\n        cancelled,\n        first_playback_at: None,\n        first_playback_unix_ms: None,\n        blocker: blocker.to_string(),\n        note: note.to_string(),\n    }\n}\n'''
          new_blocked = '''fn blocked(blocker: &str, execution_attempted: bool) -> MeetingOutputDeliveryReport {\n    MeetingOutputDeliveryReport {\n        ok: false,\n        execution_attempted,\n        first_playback_at: None,\n        first_playback_unix_ms: None,\n        blocker: blocker.to_string(),\n    }\n}\n'''
          if text.count(old_blocked) != 1:
              raise SystemExit('blocked helper marker changed')
          text = text.replace(old_blocked, new_blocked, 1)

          def split_args(src):
              args, start, depth, quote, escape = [], 0, 0, None, False
              for i, ch in enumerate(src):
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('\"', "'"):
                      quote = ch
                  elif ch in '([{':
                      depth += 1
                  elif ch in ')]}':
                      depth -= 1
                  elif ch == ',' and depth == 0:
                      args.append(src[start:i].strip())
                      start = i + 1
              tail = src[start:].strip()
              if tail:
                  args.append(tail)
              return args

          pos = 0
          replacements = []
          while True:
              idx = text.find('blocked(', pos)
              if idx < 0:
                  break
              if idx >= 3 and text[idx-3:idx] == 'fn ':
                  pos = idx + 8
                  continue
              start = idx + len('blocked(')
              depth, quote, escape, end = 1, None, False, None
              i = start
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('\"', "'"):
                          quote = ch
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                  i += 1
              if end is None:
                  raise SystemExit('unterminated blocked call')
              args = split_args(text[start:end])
              if len(args) != 4:
                  raise SystemExit(f'unexpected blocked arg count: {len(args)}')
              replacements.append((idx, end + 1, f'blocked({args[0]}, {args[2]})'))
              pos = end + 1
          if len(replacements) < 8:
              raise SystemExit(f'expected multiple blocked calls, found {len(replacements)}')
          for a, b, repl in reversed(replacements):
              text = text[:a] + repl + text[b:]

          text = text.replace('        cancelled: false,\n', '', 1)
          note_marker = '''        note: "Translated WAV samples were submitted through the exact prepared Rust/CPAL Meeting output endpoint. Meeting-app reception remains target-Windows proof."\n            .to_string(),\n'''
          if text.count(note_marker) != 1:
              raise SystemExit('success report dead note marker changed')
          text = text.replace(note_marker, '', 1)
          old_callback = '    if let Some(error) = callback_error {'
          if text.count(old_callback) != 1:
              raise SystemExit('callback error branch marker changed')
          text = text.replace(old_callback, '    if callback_error.is_some() {', 1)
          output.write_text(text, encoding='utf-8')
          '@ | python -
          git diff --check
          git diff -- EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs EngineData/Frontend/RustApp/src-tauri/src/engine/audio/guided_take.rs EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs
      - name: Rust compile with warnings denied
        shell: pwsh
        run: |
          $env:RUSTFLAGS='-Dwarnings'
          cargo check --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Commit bounded cleanup
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs EngineData/Frontend/RustApp/src-tauri/src/engine/audio/guided_take.rs EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs
          git commit -m 'Remove stale Rust warning residue'
          git push origin HEAD:New
