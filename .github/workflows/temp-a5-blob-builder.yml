name: Temporary A5 Source Commit

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a5-blob-builder.yml

permissions:
  contents: write

jobs:
  commit-source:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/temp-a5-patch-runner.py
          if ($LASTEXITCODE -ne 0) { throw 'A5 exact patch failed' }
      - name: Commit only A5 product source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "TranslateIT Source Proof"
          git config user.email "actions@users.noreply.github.com"
          $paths = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/voice_lab_gpt_sovits.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_voice_actor_inference.py'
          )
          git add -- $paths
          if ($LASTEXITCODE -ne 0) { throw 'A5 source staging failed' }
          $staged = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_voice_actor_inference.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/voice_lab_gpt_sovits.py'
          ) | Sort-Object
          if (($staged -join "`n") -ne ($expected -join "`n")) { throw "Unexpected staged files: $($staged -join ', ')" }
          git commit -m "Implement VoiceLab A5 trained actor inference"
          if ($LASTEXITCODE -ne 0) { throw 'A5 source commit failed' }
          git push origin HEAD:New
          if ($LASTEXITCODE -ne 0) { throw 'A5 source push failed' }
