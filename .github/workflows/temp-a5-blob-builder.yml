name: Temporary A5 Blob Builder

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a5-blob-builder.yml

permissions:
  contents: write

jobs:
  build-blobs:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/temp-a5-patch.py
          if ($LASTEXITCODE -ne 0) { throw 'A5 exact patch failed' }
      - name: Materialize verified Git blobs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/voice_lab_gpt_sovits.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_voice_actor_inference.py'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          foreach ($path in $paths) {
            $localSha = (git hash-object $path).Trim()
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            $payload = @{
              content = [Convert]::ToBase64String($bytes)
              encoding = 'base64'
            } | ConvertTo-Json -Compress
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs"
            $response = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload
            if ($response.sha -ne $localSha) { throw "A5 blob mismatch for $path" }
            Write-Host "A5_BLOB $path $localSha"
          }
