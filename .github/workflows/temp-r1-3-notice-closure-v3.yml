name: Temporary R1.3 Third-Party Notice Closure V3

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-3-notice-closure-v3.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded R1.3 source patch
        shell: pwsh
        run: |
          python .github/scripts/temp-r1-3-notice-patch.py
          git add -N EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs
          git diff --check

      - name: Verify bounded ownership and syntax
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $allowed = @(
            '.gitignore',
            'EngineData/Backend/RuntimeAssets/README.md',
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs',
            'EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json'
          )
          foreach ($path in $changed) { if ($allowed -notcontains $path) { throw "Unexpected R1.3 product source change: $path" } }
          foreach ($path in $allowed) { if ($changed -notcontains $path) { throw "Expected R1.3 product source change is missing: $path" } }
          node --check EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs
          node --check EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs
          node --check EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json','utf8')); console.log('[r1.3] bounded ownership + source syntax -> PASS')"

      - name: Prove deterministic and fail-closed notice generation
        shell: pwsh
        run: |
          $env:HOST_PYTHON = (Get-Command python).Source
          node .github/scripts/temp-r1-3-notice-proof.mjs

      - name: Validate release source contracts
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: node scripts/validate_release_package_contract.mjs

      - name: Verify release generation order
        shell: pwsh
        run: |
          $text = Get-Content 'EngineData/Frontend/RustApp/scripts/build_release.ps1' -Raw
          $generate = $text.IndexOf('node scripts/generate_third_party_notices.mjs --write')
          $preflight = $text.IndexOf('npm run preflight:release-payload')
          $build = $text.IndexOf('npm exec -- tauri build --config src-tauri/tauri.release.conf.json')
          if ($generate -lt 0 -or $preflight -lt 0 -or $build -lt 0 -or -not ($generate -lt $preflight -and $preflight -lt $build)) { throw 'Release order must be notice generation -> payload preflight -> Tauri build.' }
          Write-Host '[r1.3] release generation order -> PASS'

      - name: Commit R1.3 notice closure
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add .gitignore EngineData/Backend/RuntimeAssets/README.md EngineData/Frontend/RustApp/scripts/build_release.ps1 EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json
          git commit -m 'Generate deterministic third-party release notices'
          git push origin HEAD:New
