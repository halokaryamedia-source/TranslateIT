name: Code Health

on:
  push:
    branches:
      - Local
      - main
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend source health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:command-parity
      - run: npm run validate:virtual-route

  python:
    name: Python source health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Resolve Ruff from uv.lock
        id: ruff
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))
          for package in lock.get('package', []):
              if package.get('name') == 'ruff':
                  print(package['version'])
                  break
          else:
              raise SystemExit('ruff is missing from canonical uv.lock')
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install "ruff==${{ steps.ruff.outputs.version }}"
      - run: python -m compileall -q .
      - run: ruff check . --select F401,F811,F841,F842

  rust:
    name: Rust source health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Install Linux Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libasound2-dev patchelf
      - name: Rust compiler/dead-code gate
        env:
          RUSTFLAGS: "-Ddead_code -Dunused_imports -Dunused_variables -Dunused_mut -Dunused_assignments"
        run: cargo check --locked
