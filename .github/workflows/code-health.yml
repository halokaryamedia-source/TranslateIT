name: Code Health

on:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"
  pull_request:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-unused:
    name: Frontend unused-source check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check TypeScript and Svelte unused source
        run: npm run typecheck
      - name: Validate frontend source contracts
        run: |
          npm run validate:command-parity
          npm run validate:virtual-route

  python-unused:
    name: Python unused-source check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Resolve Ruff version from canonical lock
        id: ruff-version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          for package in lock.get("package", []):
              if package.get("name") == "ruff":
                  print(package["version"])
                  break
          else:
              raise SystemExit("ruff is missing from canonical uv.lock")
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install locked Ruff
        run: python -m pip install "ruff==${{ steps.ruff-version.outputs.version }}"
      - name: Compile active Python source
        run: python -m compileall -q .
      - name: Check Python unused source
        run: ruff check . --select F401,F811,F841,F842

  rust-unused:
    name: Rust dead-code check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend for Tauri context
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libasound2-dev
          patchelf
      - name: Check Rust source for dead or unused code
        env:
          RUSTFLAGS: "-Ddead_code -Dunused_imports -Dunused_variables -Dunused_mut -Dunused_assignments"
        run: cargo check --locked
