name: Code Health

on:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"
  pull_request:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/src/**"
      - "EngineData/Frontend/RustApp/src-tauri/src/**"
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/package-lock.json"
      - "EngineData/Frontend/RustApp/tsconfig.json"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
      - "EngineData/Frontend/RustApp/src-tauri/Cargo.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/code-health.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend source health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:command-parity
      - run: npm run validate:virtual-route
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python source and unit health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Install lock-resolved test tools only
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/translateit-ci-dev-requirements.txt"
          import tomllib
          from pathlib import Path

          wanted = {"ruff", "pytest", "huggingface-hub", "ffmpeg-python", "numpy"}
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = {
              package.get("name"): package.get("version")
              for package in lock.get("package", [])
              if package.get("name") in wanted
          }
          missing = sorted(wanted - versions.keys())
          if missing:
              raise SystemExit(f"canonical uv.lock is missing CI test tools: {missing}")
          for name in sorted(wanted):
              print(f"{name}=={versions[name]}")
          PY
          python -m pip install -r "$RUNNER_TEMP/translateit-ci-dev-requirements.txt"
      - run: python -m compileall -q .
      - name: Python static correctness gate
        run: ruff check . --select E4,E7,E9,F
      - name: Run Python contract tests
        run: python -m pytest -q

  rust:
    name: Rust source and unit health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Install Linux Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libasound2-dev patchelf
      - name: Rust compiler/dead-code gate
        env:
          RUSTFLAGS: "-Ddead_code -Dunused_imports -Dunused_variables -Dunused_mut -Dunused_assignments"
        run: cargo check --locked
      - name: Rust Clippy correctness gate
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
      - name: Run Rust unit tests
        run: cargo test --locked
