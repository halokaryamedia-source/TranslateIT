name: TranslateIT V1 Advance Frontend Preflight

on:
  push:
    branches: [V1-Advance]
  pull_request:
    branches: [Developing, V1-Advance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build-preflight:
    name: Frontend Build Preflight
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }
      - name: Run frontend build preflight
        run: npm run preflight:frontend-build
