name: Temporary R1.3 Third-Party Notice Closure

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-3-notice-closure.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded R1.3 source patch
        shell: pwsh
        run: |
          python .github/scripts/temp-r1-3-notice-patch.py
          git diff --check

      - name: Verify bounded ownership
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $allowed = @(
            '.gitignore',
            'EngineData/Backend/RuntimeAssets/README.md',
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs',
            'EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected R1.3 product source change: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected R1.3 product source change is missing: $path" }
          }

      - name: Validate source syntax and release resource JSON
        shell: pwsh
        run: |
          node --check EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs
          node --check EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs
          node --check EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json','utf8')); console.log('[r1.3] release config JSON -> PASS')"

      - name: Prove deterministic notice generator with synthetic staged payload
        shell: pwsh
        run: |
          $env:FIXTURE_ROOT = Join-Path $env:RUNNER_TEMP 'translateit-r1-3-fixture'
          $env:HOST_PYTHON = (Get-Command python).Source
          @'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['FIXTURE_ROOT'])
          backend = root / 'EngineData' / 'Backend'
          py = backend / 'LocalWorker' / 'PythonRuntime'
          worker = backend / 'LocalWorker' / 'WorkerRuntime'
          voice = backend / 'RuntimeAssets' / 'Voice' / 'GPTSoVITS' / 'Source'
          provider = backend / 'RuntimeAssets' / 'AudioProvider' / 'VBCABLE'
          for path in (py, worker, voice, provider):
              path.mkdir(parents=True, exist_ok=True)

          shutil.copy2(Path(os.environ['HOST_PYTHON']), py / 'python.exe')
          (py / 'LICENSE.txt').write_text('Python Software Foundation License Version 2\nSynthetic fixture only.\n', encoding='utf-8')

          packages = [
              ('g2p-en', '2.1.0', 'Apache-2.0', 'Apache License\nVersion 2.0\nSynthetic Apache terms fixture.\n'),
              ('frozendict', '2.4.7', 'LGPL-3.0-or-later', 'GNU LESSER GENERAL PUBLIC LICENSE\nVersion 3, 29 June 2007\n'),
              ('soxr', '1.1.0', 'LGPL-2.1-or-later', 'GNU Lesser General Public License version 2.1 or later\n'),
              ('fsspec', '2026.7.0', 'BSD-3-Clause', 'BSD 3-Clause License\nCopyright synthetic fixture.\n'),
              ('fixture-mit', '1.0.0', 'MIT', 'Permission is hereby granted, free of charge, to any person obtaining a copy\n'),
              ('fixture-apache', '1.0.0', 'Apache-2.0', 'Apache License\nVersion 2.0\nSynthetic fixture.\n'),
          ]
          for name, version, license_expression, license_text in packages:
              dist = py / f'{name.replace("-", "_")}-{version}.dist-info'
              licenses = dist / 'licenses'
              licenses.mkdir(parents=True, exist_ok=True)
              metadata = (
                  'Metadata-Version: 2.4\n'
                  f'Name: {name}\n'
                  f'Version: {version}\n'
                  f'License-Expression: {license_expression}\n'
                  f'Project-URL: Source, https://example.invalid/{name}\n\n'
              )
              (dist / 'METADATA').write_text(metadata, encoding='utf-8')
              (licenses / 'LICENSE.txt').write_text(license_text, encoding='utf-8')

          manifest = {
              'schema': 'translateit.local_model_inventory.v2',
              'inventory_scope': 'full_product_release_assets',
              'models': [
                  {
                      'model_id': 'fixture-required-model',
                      'required': True,
                      'repo_id': 'example/fixture-model',
                      'expected_path': 'EngineData/Backend/RuntimeAssets/ASR/ModelData/fixture-required-model',
                      'revision': 'fixture-revision',
                      'license': 'mit',
                  }
              ],
          }
          (worker / 'model_manifest.json').write_text(json.dumps(manifest), encoding='utf-8')
          (voice / 'LICENSE').write_text('Permission is hereby granted, free of charge, synthetic GPT-SoVITS fixture.\n', encoding='utf-8')
          (voice / 'FFMPEG_LICENSE.txt').write_text('GNU LESSER GENERAL PUBLIC LICENSE\nVersion 3, 29 June 2007\n', encoding='utf-8')
          (voice / 'FFMPEG_SOURCE.txt').write_text('source_kind=ffmpeg\nlicense_profile=LGPL-3.0-or-later\n', encoding='utf-8')
          (provider / 'NOTICE.txt').write_text('VB-Audio VB-CABLE donationware synthetic fixture notice.\n', encoding='utf-8')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\make_fixture.py" -Encoding utf8
          python "$env:RUNNER_TEMP\make_fixture.py"

          $env:GENERATOR_URL = (Resolve-Path 'EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs').Path
          @'
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          import { readFileSync } from 'node:fs';

          const generator = await import(pathToFileURL(process.env.GENERATOR_URL).href);
          const backendRoot = join(process.env.FIXTURE_ROOT, 'EngineData', 'Backend');
          const first = generator.buildThirdPartyNoticeBundle({ backendRoot });
          const second = generator.buildThirdPartyNoticeBundle({ backendRoot });
          if (first.content !== second.content) throw new Error('notice generator is not deterministic');
          if (first.packageCount !== 6) throw new Error(`unexpected fixture package count: ${first.packageCount}`);
          for (const marker of [
            'fixture-required-model',
            'CMUDICT ATTRIBUTION',
            'FFMPEG LICENSE',
            'FFMPEG SOURCE / BUILD PROVENANCE',
            'VB-CABLE NOTICE',
            'frozendict==2.4.7',
            'soxr==1.1.0',
          ]) {
            if (!first.content.includes(marker)) throw new Error(`missing generated notice marker: ${marker}`);
          }
          const written = generator.writeThirdPartyNoticeBundle({ backendRoot });
          const actual = readFileSync(written.outputPath, 'utf8').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trimEnd() + '\n';
          if (actual !== first.content) throw new Error('written notice output differs from deterministic in-memory result');
          console.log(`[r1.3] deterministic synthetic bundle -> PASS; packages=${first.packageCount}; unique_materials=${first.uniquePythonMaterialCount}`);
          '@ | Set-Content -Path "$env:RUNNER_TEMP\prove_fixture.mjs" -Encoding utf8
          node "$env:RUNNER_TEMP\prove_fixture.mjs"

      - name: Prove fail-closed dependency/license boundaries
        shell: pwsh
        run: |
          $env:GENERATOR_URL = (Resolve-Path 'EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs').Path
          @'
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          import { rmSync, writeFileSync, mkdirSync } from 'node:fs';

          const generator = await import(pathToFileURL(process.env.GENERATOR_URL).href);
          const backendRoot = join(process.env.FIXTURE_ROOT, 'EngineData', 'Backend');
          const py = join(backendRoot, 'LocalWorker', 'PythonRuntime');

          const distance = join(py, 'distance-0.1.3.dist-info');
          mkdirSync(join(distance, 'licenses'), { recursive: true });
          writeFileSync(join(distance, 'METADATA'), 'Metadata-Version: 2.4\nName: distance\nVersion: 0.1.3\nLicense-Expression: GPL-2.0-or-later\n\n');
          writeFileSync(join(distance, 'licenses', 'LICENSE.txt'), 'GNU GENERAL PUBLIC LICENSE\n');
          let blockedDistance = false;
          try { generator.buildThirdPartyNoticeBundle({ backendRoot }); } catch (error) { blockedDistance = String(error).includes('excluded_distance_distribution_present'); }
          if (!blockedDistance) throw new Error('Distance reappearance was not blocked');
          rmSync(distance, { recursive: true, force: true });

          const missing = join(py, 'missing_notice-1.0.0.dist-info');
          mkdirSync(missing, { recursive: true });
          writeFileSync(join(missing, 'METADATA'), 'Metadata-Version: 2.4\nName: missing-notice\nVersion: 1.0.0\nLicense-Expression: MIT\n\n');
          let blockedMissing = false;
          try { generator.buildThirdPartyNoticeBundle({ backendRoot }); } catch (error) { blockedMissing = String(error).includes('python_distribution_missing_license_material'); }
          if (!blockedMissing) throw new Error('distribution without license material was not blocked');
          rmSync(missing, { recursive: true, force: true });
          console.log('[r1.3] fail-closed notice boundaries -> PASS');
          '@ | Set-Content -Path "$env:RUNNER_TEMP\prove_fail_closed.mjs" -Encoding utf8
          node "$env:RUNNER_TEMP\prove_fail_closed.mjs"

      - name: Validate release source contracts
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          node scripts/validate_release_package_contract.mjs

      - name: Verify release generation order
        shell: pwsh
        run: |
          $text = Get-Content 'EngineData/Frontend/RustApp/scripts/build_release.ps1' -Raw
          $generate = $text.IndexOf('node scripts/generate_third_party_notices.mjs --write')
          $preflight = $text.IndexOf('npm run preflight:release-payload')
          $build = $text.IndexOf('npm exec -- tauri build --config src-tauri/tauri.release.conf.json')
          if ($generate -lt 0 -or $preflight -lt 0 -or $build -lt 0 -or -not ($generate -lt $preflight -and $preflight -lt $build)) {
            throw 'Release order must be notice generation -> payload preflight -> Tauri build.'
          }
          Write-Host '[r1.3] release generation order -> PASS'

      - name: Commit R1.3 notice closure
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add .gitignore EngineData/Backend/RuntimeAssets/README.md EngineData/Frontend/RustApp/scripts/build_release.ps1 EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json
          git commit -m 'Generate deterministic third-party release notices'
          git push origin HEAD:New
