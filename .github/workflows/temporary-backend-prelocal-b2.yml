name: Temporary Backend Pre-Local B2 Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-prelocal-b2.yml

permissions:
  contents: write

jobs:
  prove-b2:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Set up pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install canonical Python resolver
        shell: pwsh
        run: |
          python --version
          python -m pip install --disable-pip-version-check --no-input "uv==0.12.3"
          uv --version

      - name: Apply bounded B2 correction
        shell: pwsh
        run: |
          python .tmp/backend_prelocal_b2_runner.py
          if ($LASTEXITCODE -ne 0) { throw "B2 patch helper failed." }

      - name: Resolve and prove locked Windows CUDA matrix
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          uv lock
          if ($LASTEXITCODE -ne 0) { throw "uv lock failed." }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv lock --check failed." }
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed." }

          uv run --frozen python -c "import platform; assert platform.python_version() == '3.12.10', platform.python_version(); print('PYTHON_BASELINE=' + platform.python_version())"
          if ($LASTEXITCODE -ne 0) { throw "Python baseline proof failed." }

          uv run --frozen python -c "import torch, ctranslate2; assert torch.__version__ == '2.13.0+cu126', torch.__version__; assert torch.version.cuda == '12.6', torch.version.cuda; assert ctranslate2.__version__ == '4.8.1', ctranslate2.__version__; assert float(torch.tensor([1.0], device='cpu').sum().item()) == 1.0; print('TORCH=' + torch.__version__ + ';TORCH_CUDA=' + str(torch.version.cuda) + ';CTRANSLATE2=' + ctranslate2.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Windows CUDA matrix identity proof failed." }

          $probeJson = uv run --frozen python -c "import json, realtime_local_worker as w; print(json.dumps(w.probe_gpu_runtime({})))"
          if ($LASTEXITCODE -ne 0) { throw "Worker GPU probe failed." }
          $probe = $probeJson | ConvertFrom-Json
          if (-not $probe.cuda_capability_known) { throw "Hosted no-GPU capability must be known, not probe-failed." }
          if (-not $probe.cpu_fallback_active) { throw "Hosted no-GPU runner must select explicit CPU degraded operation." }
          if ($probe.selected_device -ne 'cpu' -or $probe.selected_translation_device -ne 'cpu') { throw "Hosted no-GPU worker did not select CPU for both AI lanes." }
          if ($probe.fallback_reason -ne 'cuda_unavailable') { throw "Unexpected CPU fallback reason: $($probe.fallback_reason)" }
          if ($probe.cuda_probe_blocker) { throw "Known no-GPU fallback must not carry a CUDA probe blocker: $($probe.cuda_probe_blocker)" }
          Write-Host "GPU_PROBE=$probeJson"

      - name: Format and test WorkerRuntime
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          uv run --frozen ruff format realtime_local_worker.py tests/test_worker_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Ruff format failed." }
          uv run --frozen ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff check failed." }
          uv run --frozen ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff format check failed." }
          uv run --frozen pytest
          if ($LASTEXITCODE -ne 0) { throw "WorkerRuntime tests failed." }
          uv run --frozen python -m compileall -q realtime_local_worker.py tests
          if ($LASTEXITCODE -ne 0) { throw "WorkerRuntime compileall failed." }

      - name: Prove pinned developer setup helper
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          & .\setup_realtime_worker.ps1
          if ($LASTEXITCODE -ne 0) { throw "Pinned WorkerRuntime developer setup failed." }

      - name: Verify B2 change scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed." }
          $expected = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/.python-version',
            'EngineData/Backend/LocalWorker/WorkerRuntime/README.md',
            'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml',
            'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/setup_realtime_worker.ps1',
            'EngineData/Backend/LocalWorker/WorkerRuntime/tests/test_worker_contract.py',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'docs/knowledge/decision-log.md',
            'docs/knowledge/next-action.md'
          )
          $changed = @(git status --porcelain --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "Unexpected: $_" }
            throw "Unexpected B2 changed path."
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing: $_" }
            throw "Expected B2 changed path missing."
          }
          git diff --stat

      - name: Commit proven B2 correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add -A
          git commit -m "Lock Windows CUDA matrix and truthful CPU fallback"
          git push origin HEAD:New
