name: R3 Release Contract

on:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json"
      - "EngineData/Frontend/RustApp/src-tauri/windows/**"
      - "EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/**"
      - "EngineData/Backend/RuntimeAssets/README.md"
      - "EngineData/Backend/LocalWorker/README.md"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - ".github/workflows/release-payload-verify.yml"
  pull_request:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/scripts/**"
      - "EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json"
      - "EngineData/Frontend/RustApp/src-tauri/windows/**"
      - "EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/**"
      - "EngineData/Backend/RuntimeAssets/README.md"
      - "EngineData/Backend/LocalWorker/README.md"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - ".github/workflows/release-payload-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contract:
    name: R3 source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile payload builder
        run: python -m py_compile EngineData/Frontend/RustApp/scripts/build_r3_external_payload.py
      - name: Parse Windows release PowerShell
        shell: pwsh
        run: |
          foreach ($path in @(
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/run_target_pc_acceptance.ps1',
            'EngineData/Frontend/RustApp/scripts/run_local_test.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parse errors found in $path."
            }
          }
      - name: Check release validators
        working-directory: EngineData/Frontend/RustApp
        run: |
          node --check scripts/validate_tauri_package_preflight.mjs
          node --check scripts/validate_release_package_contract.mjs
          node scripts/validate_tauri_package_preflight.mjs
          node scripts/validate_release_package_contract.mjs
      - name: Validate canonical MiLMMT boundary
        run: python tools/translation_quality/validate_canonical_milmmt_repo.py

  controlled-payload:
    name: Controlled Windows payload proof
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stage controlled release inputs
        shell: pwsh
        run: |
          & 'EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Controlled release input staging failed.' }
          python 'EngineData/Frontend/RustApp/scripts/stage_release_license_material.py'
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Python license staging failed.' }
      - name: Validate and optimize controlled payload
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node scripts/generate_third_party_notices.mjs --write
          npm run preflight:release-payload
          $backend = (Resolve-Path '../../Backend').Path
          $privatePython = Join-Path $backend 'LocalWorker/PythonRuntime/python.exe'
          & $privatePython scripts/optimize_release_payload.py --backend-root $backend
          if ($LASTEXITCODE -ne 0) { throw 'Release payload optimizer failed.' }
          node scripts/generate_third_party_notices.mjs --write
          npm run preflight:release-payload
          npm run preflight:tauri-package
      - name: Build bounded R3 payload evidence
        shell: pwsh
        run: |
          $app = (Resolve-Path 'EngineData/Frontend/RustApp').Path
          $repo = (Resolve-Path '.').Path
          $python = Join-Path $repo 'EngineData/Backend/LocalWorker/PythonRuntime/python.exe'
          $payload = Join-Path $env:RUNNER_TEMP 'TranslateIT-Payload.7z'
          $hook = Join-Path $env:RUNNER_TEMP 'translateit-r3-payload-hooks.generated.nsh'
          $evidence = Join-Path $env:RUNNER_TEMP 'translateit-r3-payload-build.json'
          & $python -s (Join-Path $app 'scripts/build_r3_external_payload.py') `
            --repo-root $repo `
            --output $payload `
            --hook-template (Join-Path $app 'src-tauri/windows/r3_payload_hooks.template.nsh') `
            --installer-helper (Join-Path $app 'src-tauri/windows/r3_payload_installer.ps1') `
            --generated-hook $hook `
            --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'R3 external payload build failed.' }
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'R3 payload evidence missing.' }
          Remove-Item -LiteralPath $payload,$hook -Force -ErrorAction SilentlyContinue
      - name: Upload bounded release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-controlled-payload-proof
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/translateit-r3-payload-build.json
