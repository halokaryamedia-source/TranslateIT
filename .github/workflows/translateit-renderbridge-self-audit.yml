name: TranslateIT RenderBridge Self Audit

on:
  workflow_dispatch:

jobs:
  renderbridge-self-audit:
    name: RenderBridge self audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: DevelopingData/FigmaDesignExport/TranslateIT/RenderBridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start RenderBridge
        run: |
          mkdir -p reports-ci-bundle
          node server.mjs > reports-ci-server.log 2>&1 &
          echo $! > reports-ci-server.pid
          for i in {1..35}; do
            if curl -fsS http://127.0.0.1:8844/health > reports-ci-health.json; then
              cat reports-ci-health.json
              exit 0
            fi
            sleep 1
          done
          cat reports-ci-server.log || true
          exit 1

      - name: Run self-audit without early stop
        run: |
          set +e
          echo '{"gate":"translateit-ci-self-audit","steps":[]}' > reports-ci-results.json

          run_step () {
            local name="$1"
            shift
            echo "::group::$name"
            "$@"
            local code=$?
            echo "::endgroup::"
            echo "$name=$code" >> reports-ci-exit-codes.txt
            return 0
          }

          run_step "imports" npm run test:imports
          run_step "contract" npm run test:contract
          run_step "v2" npm run test:v2
          run_step "mivubi-sample" node ./tests/test-sample-sites.mjs https://www.mivubi.com/
          run_step "figma-dry-run" node ./tests/test-figma-renderer-dry-run.mjs https://www.mivubi.com/
          run_step "regression" npm run test:regression

          cat reports-ci-exit-codes.txt

      - name: Stop RenderBridge
        if: always()
        run: |
          if [ -f reports-ci-server.pid ]; then
            kill $(cat reports-ci-server.pid) || true
          fi

      - name: Collect CI report bundle
        if: always()
        run: |
          mkdir -p reports-ci-bundle
          cp -r reports reports-ci-bundle/reports 2>/dev/null || true
          cp reports-ci-server.log reports-ci-bundle/ 2>/dev/null || true
          cp reports-ci-health.json reports-ci-bundle/ 2>/dev/null || true
          cp reports-ci-exit-codes.txt reports-ci-bundle/ 2>/dev/null || true
          find reports-ci-bundle -maxdepth 3 -type f | sort

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translateit-renderbridge-self-audit
          path: DevelopingData/FigmaDesignExport/TranslateIT/RenderBridge/reports-ci-bundle
          if-no-files-found: warn

      - name: Fail if required self-audit failed
        run: |
          if [ ! -f reports-ci-exit-codes.txt ]; then
            echo "Missing reports-ci-exit-codes.txt"
            exit 1
          fi
          cat reports-ci-exit-codes.txt
          failed=0
          while IFS='=' read -r name code; do
            if [ "$code" != "0" ]; then
              echo "Step failed: $name=$code"
              failed=1
            fi
          done < reports-ci-exit-codes.txt
          exit $failed
