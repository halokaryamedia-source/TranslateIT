name: Temporary Pre-Local Final Source Closure Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-prelocal-final-source-closure.yml

permissions:
  contents: write

jobs:
  prove-closure:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Prove canonical source and frontend contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run validate:source-contracts
          if ($LASTEXITCODE -ne 0) { throw 'source validators failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'svelte-check failed.' }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed.' }

      - name: Prove full Rust compile surface
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Rust full test target failed to compile.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed.' }

      - name: Prove final source closure ownership
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('.')
          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          meeting = read('EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs')
          output = read('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs')
          runtime_state = read('EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs')
          helper = read('EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge.rs')
          helper_runtime = read('EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs')
          worker = read('EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py')
          finalized = read('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/finalized_utterance.rs')
          text_command = read('EngineData/Frontend/RustApp/src-tauri/src/commands/text_translate.rs')
          text_ui = read('EngineData/Frontend/RustApp/src/pages/Text.svelte')
          facade = read('EngineData/Frontend/RustApp/src/app/bridge/runtimeProductFacade.ts')
          setup = read('EngineData/Frontend/RustApp/src/pages/FirstSetup.svelte')
          app = read('EngineData/Frontend/RustApp/src/App.svelte')
          bootstrap = read('EngineData/Frontend/RustApp/src-tauri/src/app_bootstrap.rs')
          registry = read('EngineData/Frontend/RustApp/src-tauri/src/commands/registry.rs')
          sidebar = read('EngineData/Frontend/RustApp/src/components/layout/Sidebar.svelte')

          start_begin = meeting.index('pub fn start_meeting_translation()')
          stop_begin = meeting.index('pub fn stop_meeting_translation()', start_begin)
          start = meeting[start_begin:stop_begin]
          ordered = [
              'begin_application_meeting_session()',
              'start_live_capture_runtime(starting.clone())',
              'probe_prepared_meeting_output_device_functionally(output_device, generation)',
              'start_meeting_outbound_consumer(generation, &session_id)',
              'commit_application_meeting_session_live(',
          ]
          positions = [start.index(marker) for marker in ordered]
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit('Required Start transaction is not authority -> mic -> output probe -> consumer -> Live.')

          stop = meeting[stop_begin:]
          revoke = stop.index('revoke_runtime_session_authority(')
          cleanup_markers = [
              'cancel_active_meeting_output',
              'stop_live_capture_runtime',
              'stop_meeting_sound_capture_runtime',
              'cancel_meeting_helper_work',
              'stop_meeting_outbound_consumer',
          ]
          if any(revoke > stop.index(marker) for marker in cleanup_markers):
              raise SystemExit('Meeting Stop no longer revokes output authority before resource cleanup.')
          if 'cleanup_incomplete' not in stop:
              raise SystemExit('Meeting Stop lost truthful cleanup-incomplete ownership.')

          probe_start = output.index('pub fn probe_prepared_meeting_output_device_functionally(')
          probe_end = output.index('fn install_cancel_control(', probe_start)
          probe = output[probe_start:probe_end]
          for marker in ['vec![0.0_f32; sample_count]', 'build_output_stream(', '.play()', 'recv_timeout', 'FUNCTIONAL_OUTPUT_PROBE_TIMEOUT_MS']:
              if marker not in probe:
                  raise SystemExit('Functional Meeting output probe marker missing: ' + marker)
          if 'thread::sleep' in probe:
              raise SystemExit('Functional Meeting output probe contains an arbitrary sleep.')

          for marker in [
              'runtime_generation_is_authoritative',
              'commit_application_meeting_session_live',
              'revoke_runtime_session_authority',
              'cleanup_incomplete',
          ]:
              if marker not in runtime_state:
                  raise SystemExit('Canonical runtime authority marker missing: ' + marker)

          for marker in [
              'functional_outbound_ready',
              'prepare_required_outbound_ai_runtime',
              'required_outbound_functional_readiness_cached',
              'send_worker_task("asr_preload"',
              'let asr_inference = send_worker_task(',
              'remember_required_outbound_functional_readiness',
          ]:
              if marker not in helper:
                  raise SystemExit('Generation-bound functional readiness marker missing: ' + marker)

          for marker in [
              'HELPER_SCHEDULER_TOTAL_ADMISSION_CAP',
              'HELPER_SCHEDULER_MEETING_OUTBOUND_WAIT_MS',
              'HelperTaskPriority::MeetingOutbound',
              'wait_timeout',
          ]:
              if marker not in helper_runtime:
                  raise SystemExit('Bounded helper scheduler marker missing: ' + marker)

          for marker in [
              'local_files_only=True',
              'truncation=False',
              'condition_on_previous_text=False',
              'translation:input_too_long_for_model',
              'translation:output_hit_token_ceiling_without_eos',
              'finished_with_eos',
              '"id->en"',
              '"en->id"',
          ]:
              if marker not in worker:
                  raise SystemExit('Canonical local translation contract marker missing: ' + marker)

          for marker in [
              'MAX_IN_PROGRESS_UTTERANCE_MS',
              'MAX_PENDING_FINALIZED_UTTERANCES: usize = 2',
              'state.pending.pop_front()',
              'runtime_generation_is_authoritative',
              'finalized_at = Instant::now()',
          ]:
              if marker not in finalized:
                  raise SystemExit('Finalized-utterance freshness/bounds marker missing: ' + marker)

          for marker in ['MAX_TEXT_TRANSLATION_CHARS: usize = 2_000', 'send_helper_worker_task("translate"', 'canonical_bidirectional_id_en']:
              if marker not in text_command:
                  raise SystemExit('Standalone Text contract marker missing: ' + marker)
          for marker in ['MAX_MANUAL_TRANSLATION_CHARS = 2000', 'requestTargetRevision', 'targetRevision !== requestTargetRevision', 'Translate again to refresh the result']:
              if marker not in text_ui:
                  raise SystemExit('Text edit/stale-result guard marker missing: ' + marker)

          for marker in [
              'const meetingReady = meeting.readyForStart || productMeeting.live;',
              'settings.meeting_setup_state === "new"',
              'Start Translation will run a quick final translation check before going live.',
          ]:
              if marker not in facade:
                  raise SystemExit('Product readiness projection marker missing: ' + marker)
          if 'if (busy || !snapshot?.readiness.meetingReady) return;' not in setup:
              raise SystemExit('First Setup completion is no longer gated by functional Meeting readiness.')

          for marker in ['event.preventDefault();', 'runProductMeetingAction("stop")', 'await destroyNativeWindow()']:
              if marker not in app:
                  raise SystemExit('Safe-close frontend marker missing: ' + marker)
          power_start = bootstrap.index('mod windows_power_lifecycle')
          power_end = bootstrap.index('fn configure_runtime_paths', power_start)
          power = bootstrap[power_start:power_end]
          for marker in ['request_meeting_cleanup', 'stop_meeting_translation()', 'sync_channel::<()>(1)']:
              if marker not in power:
                  raise SystemExit('Windows power convergence marker missing: ' + marker)
          if 'start_meeting_translation' in power:
              raise SystemExit('Windows power lifecycle must not auto-resume Meeting translation.')

          registered = [
              'start_meeting_translation', 'stop_meeting_translation', 'translate_text',
              'load_runtime_settings', 'save_runtime_settings', 'select_audio_device',
          ]
          for marker in registered:
              if marker not in registry:
                  raise SystemExit('Initial-core command registry marker missing: ' + marker)
          for marker in ['route: "meeting"', 'route: "text"', 'route: "settings"']:
              if marker not in sidebar:
                  raise SystemExit('Initial-core navigation marker missing: ' + marker)

          print('FINAL_SOURCE_CLOSURE_GUARD=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Final source closure guard failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Prove Tauri release link
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri release build failed.' }

      - name: Record final source closure boundary
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('docs/knowledge/next-action.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Current Mode\n'
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit('Canonical Current Mode marker was not found.')

          closure = r'''

## Pre-Local Final Source Closure Audit — CLOSED / SOURCE BOUNDARY REACHED

The final bounded source-only audit rechecked the initial-core requirements against the current A/B/C owners after C5. No remaining non-hardware implementation blocker was found. Required outbound authority, physical-microphone capture, generation-bound functional AI readiness, exact prepared virtual-output callback probing, serialized outbound consumption, canonical bidirectional Text translation, bounded speech/freshness behavior, optional incoming isolation, safe Stop/power convergence, and frontend readiness truth remain aligned with the canonical requirements.

The audit does not reinterpret source or hosted evidence as target-runtime proof. Remaining uncertainty belongs to target/release evidence: actual physical-microphone behavior; VB-Cable/meeting-app reception; optional Meeting Sound loopback and self-output suppression; real NVIDIA CUDA execution and performance; ASR/translation quality; CPU practicality; end-to-end latency distribution; long-session stability; sleep/wake hardware behavior; packaged private PythonRuntime/installer staging; clean-machine acceptance; and endpoint-name collision only if target hardware exposes it. No local-PC test, VAD/model tuning, endpoint-GUID migration, installer work, or speculative backend change was performed.

Hosted final source-closure proof:

```text
canonical source validators                  -> PASS
svelte-check + frontend build                -> PASS
Rust full test-target compile (`--no-run`)    -> PASS
cargo check                                  -> PASS
final source closure ownership guard         -> PASS
Tauri release build --no-bundle              -> PASS
```

## Current Mode

**Maintenance / Pre-Local Source Closed — WAITING FOR TARGET-WINDOWS AUTHORIZATION.** Initial-core source ownership A1-A7, B1-B6, C1-C5, and the final source-closure audit are complete at the source/hosted proof boundary. Do not add further backend hardening without a newly evidenced source-level gap or target-runtime evidence.

## Next Step — Target Windows Validation (Requires Explicit Authorization)

Stop source development and wait for explicit user authorization before performing target-Windows/local-PC validation of the physical microphone, virtual cable/meeting-app reception, optional incoming loopback, CUDA/model performance, latency, long-session/sleep-wake behavior, and release-packaging evidence. Until authorization is given, do not run local tests, tune VAD/models, migrate endpoint identity, stage the installer, or add speculative backend work.
'''
          path.write_text(text[:index] + closure, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source-closure state update failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Canonical state patch has whitespace errors.' }
          $changed = @(git diff --name-only | ForEach-Object { $_.Replace('\','/') })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'docs/knowledge/next-action.md') {
            $changed | ForEach-Object { Write-Host "Changed: $_" }
            throw 'Final closure state update touched an unexpected path.'
          }
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -m 'Record final source closure boundary'
          if ($LASTEXITCODE -ne 0) { throw 'Final source closure commit failed.' }
          git push origin HEAD:New
          if ($LASTEXITCODE -ne 0) { throw 'Final source closure push failed.' }
