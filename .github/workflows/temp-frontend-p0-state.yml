name: Temporary Frontend P0 State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-frontend-p0-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - name: Update canonical mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/knowledge/next-action.md')
          text = path.read_text(encoding='utf-8')
          old = '**Maintenance / VoiceLab Guided Recording UX CLOSED — RELEASE/LOCAL EVIDENCE DEFERRED**'
          new = '**Developing / Frontend P0 Alignment CLOSED — P1 VOICELAB HUMANIZATION NEXT**'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('current-mode marker missing')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit canonical mode
        shell: bash
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git diff --cached --quiet || git commit -m 'Set frontend P1 as next active mode'
          git push origin HEAD:New
