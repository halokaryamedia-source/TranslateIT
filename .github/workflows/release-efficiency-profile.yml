name: Release Efficiency Profile

on:
  workflow_dispatch:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/model_manifest.json"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/milmmt_translation_provider.py"
      - "EngineData/Frontend/RustApp/scripts/audit_release_python_runtime.py"
      - "EngineData/Frontend/RustApp/scripts/optimize_release_payload.py"
      - ".github/workflows/release-efficiency-profile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Windows capability-preserving efficiency audit
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install pinned audit tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.12.0

      - name: Resolve frozen WorkerRuntime closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = (Resolve-Path 'EngineData/Backend/LocalWorker/WorkerRuntime').Path
          $python = (Get-Command python).Source
          Push-Location $worker
          try {
            uv sync --frozen --no-dev --python $python
            if ($LASTEXITCODE -ne 0) { throw 'Frozen WorkerRuntime sync failed.' }
          } finally { Pop-Location }

      - name: Profile production optimizer against frozen closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = (Resolve-Path 'EngineData/Backend/LocalWorker/WorkerRuntime').Path
          $backend = (Resolve-Path 'EngineData/Backend').Path
          $python = (Get-Command python).Source
          $site = Join-Path $worker '.venv/Lib/site-packages'

          python EngineData/Frontend/RustApp/scripts/audit_release_python_runtime.py --site-packages $site --label baseline --json-out (Join-Path $env:RUNNER_TEMP 'baseline-python.json')
          if ($LASTEXITCODE -ne 0) { throw 'Baseline Python profile failed.' }

          $runtimeRoot = Join-Path $backend 'LocalWorker/PythonRuntime'
          if (Test-Path -LiteralPath $runtimeRoot) { Remove-Item -LiteralPath $runtimeRoot -Recurse -Force }
          New-Item -ItemType Junction -Path $runtimeRoot -Target $site | Out-Null
          Copy-Item -LiteralPath $python -Destination (Join-Path $site 'python.exe')

          $bertRoot = Join-Path $backend 'RuntimeAssets/Voice/GPTSoVITS/Source/GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large'
          New-Item -ItemType Directory -Force -Path $bertRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $bertRoot 'profile-model.bin') -Value ('x' * 4096) -Encoding ascii

          try {
            & $python EngineData/Frontend/RustApp/scripts/optimize_release_payload.py --backend-root $backend
            if ($LASTEXITCODE -ne 0) { throw 'Release payload optimizer failed.' }
            Remove-Item -LiteralPath (Join-Path $site 'python.exe') -Force
            python EngineData/Frontend/RustApp/scripts/audit_release_python_runtime.py --site-packages $site --label optimized --json-out (Join-Path $env:RUNNER_TEMP 'optimized-python.json')
            if ($LASTEXITCODE -ne 0) { throw 'Optimized Python profile failed.' }
          } finally {
            if (Test-Path -LiteralPath $runtimeRoot) { Remove-Item -LiteralPath $runtimeRoot -Force }
          }

      - name: Validate optimized dependency closure
        shell: pwsh
        run: |
          $env:BASELINE = Join-Path $env:RUNNER_TEMP 'baseline-python.json'
          $env:OPTIMIZED = Join-Path $env:RUNNER_TEMP 'optimized-python.json'
          $env:SUMMARY_JSON = Join-Path $env:RUNNER_TEMP 'optimization-summary.json'
          @'
          import json
          import os
          from pathlib import Path

          baseline = json.loads(Path(os.environ["BASELINE"]).read_text(encoding="utf-8"))
          optimized = json.loads(Path(os.environ["OPTIMIZED"]).read_text(encoding="utf-8"))
          present = {item["normalized_name"] for item in optimized["distributions"]}
          forbidden = {
              "accelerate", "annotated-types", "budoux", "cn2an", "colorlog",
              "fast-langdetect", "fasttext-predict", "jieba", "jieba-fast", "pandas",
              "peft", "proces", "pydantic", "pydantic-core", "pypinyin",
              "robust-downloader", "split-lang", "typing-inspection", "tzdata",
          }
          remaining = sorted(forbidden & present)
          if remaining:
              raise SystemExit(f"optimized closure still contains excluded distributions: {remaining}")
          if optimized["distribution_count"] != 97:
              raise SystemExit(
                  f"optimized closure must contain 97 distributions, got {optimized['distribution_count']}"
              )
          required = {
              "torch", "torchaudio", "faster-whisper", "ctranslate2", "onnxruntime",
              "pytorch-lightning", "transformers", "matplotlib", "sentencepiece",
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"optimized closure lost required distributions: {missing}")

          saving = int(baseline["total_bytes"]) - int(optimized["total_bytes"])
          if saving <= 0:
              raise SystemExit(f"optimizer produced no Python closure saving: {saving}")
          result = {
              "baseline_site_packages_bytes": baseline["total_bytes"],
              "optimized_site_packages_bytes": optimized["total_bytes"],
              "python_closure_saving_bytes": saving,
          }
          Path(os.environ["SUMMARY_JSON"]).write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Optimized distribution contract failed.' }

      - name: Validate canonical MiLMMT repository boundary
        shell: pwsh
        run: |
          python tools/translation_quality/validate_canonical_milmmt_repo.py
          if ($LASTEXITCODE -ne 0) { throw 'MiLMMT repository boundary validation failed.' }

      - name: Upload optimization proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-python-optimization-profile
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/baseline-python.json
            ${{ runner.temp }}/optimized-python.json
            ${{ runner.temp }}/optimization-summary.json
