name: Temporary P2.3 GPU Executor Blocker State

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-p23-gpu-blocker-state.yml

permissions:
  contents: write

jobs:
  record-state:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Record P2.3 GPU executor blocker
        shell: pwsh
        run: python .tmp/p23_gpu_blocker_finalize.py

      - name: Validate canonical-state-only change
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'docs/knowledge/next-action.md') {
            $changed | ForEach-Object { Write-Host $_ }
            throw 'Unexpected P2.3 blocker-state change scope.'
          }

      - name: Commit canonical blocker state
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add docs/knowledge/next-action.md
          git commit -m "Record P2.3 GPU executor blocker"
          git push origin HEAD:New
