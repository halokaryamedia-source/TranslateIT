name: Temporary Backend Pre-Local B6 Proof

on:
  push:
    branches:
      - New

permissions:
  contents: write

jobs:
  prove-b6:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply bounded B6 cleanup
        shell: pwsh
        run: |
          python .tmp/backend_prelocal_b6_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'B6 patch helper failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'B6 patch has whitespace errors.' }

      - name: Prove canonical frontend and source contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run validate:source-contracts
          if ($LASTEXITCODE -ne 0) { throw 'source validators failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'svelte-check failed.' }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed.' }

      - name: Prove Rust tests and compile warning bound
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }

          $log = Join-Path $env:RUNNER_TEMP 'b6-cargo-check.log'
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed.' }

          $env:B6_CARGO_LOG = $log
          @'
          from pathlib import Path
          import os
          import re

          text = Path(os.environ['B6_CARGO_LOG']).read_text(encoding='utf-8', errors='replace')
          warnings = [line.strip() for line in text.splitlines() if re.match(r'^warning:', line.strip())]
          print(f'B6_WARNING_COUNT={len(warnings)}')
          for warning in warnings:
              print(warning)
          if len(warnings) > 6:
              raise SystemExit(f'B6 warning set is still too broad: {len(warnings)}')
          retired = [
              'stop_helper_bridge', 'cancel_helper_bridge_meeting_generation',
              'cancel_helper_bridge_task', 'send_helper_bridge_request',
              'helper_bridge_preload_asr', 'helper_bridge_preload_translation',
              'helper_bridge_tts_preflight', 'helper_bridge_pipeline_contract_smoke',
              'helper_bridge_synthesize_text', 'HelperBridgeRequest',
              'write_worker_request', 'read_worker_response_with_deadline',
              'get_model_inventory', 'is_target_format', 'inspect_default_input',
              'LiveTargetSegmentReport', 'live_target_segment_snapshot',
              'write_latest_live_target_segment_wav', 'remove_finalized_outbound_utterance_wav',
              'live_capture_status', 'VadPresetConfig', 'VadSegmentDecisionRequest',
              'VadDecisionReport', 'evaluate_segment_decision', 'RuntimeStage', 'EngineStatus',
          ]
          leaked = [name for name in retired if any(name in warning for warning in warnings)]
          if leaked:
              raise SystemExit('Retired B6 symbols still emit warnings: ' + ', '.join(leaked))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'B6 warning validation failed.' }

      - name: Prove Tauri release link
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri release build failed.' }

      - name: Prove retired surfaces are absent and active owners remain
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('EngineData/Frontend/RustApp/src-tauri/src')
          rust = '\n'.join(path.read_text(encoding='utf-8') for path in sorted(root.rglob('*.rs')))
          retired = [
              'pub fn stop_helper_bridge()',
              'pub fn cancel_helper_bridge_meeting_generation(',
              'pub fn cancel_helper_bridge_task()',
              'pub fn send_helper_bridge_request(',
              'pub fn helper_bridge_preload_asr()',
              'pub fn helper_bridge_preload_translation(',
              'pub fn helper_bridge_tts_preflight()',
              'pub fn helper_bridge_pipeline_contract_smoke()',
              'pub fn helper_bridge_synthesize_text(',
              'pub struct HelperBridgeRequest',
              'pub fn write_worker_request(stdin:',
              'pub fn read_worker_response_with_deadline(',
              'pub fn get_model_inventory()',
              'pub fn is_target_format(',
              'pub fn inspect_default_input()',
              'pub struct LiveTargetSegmentReport',
              'pub fn live_target_segment_snapshot()',
              'pub fn write_latest_live_target_segment_wav()',
              'pub fn remove_finalized_outbound_utterance_wav(',
              'pub fn live_capture_status()',
              'pub struct VadPresetConfig',
              'pub struct VadSegmentDecisionRequest',
              'pub struct VadDecisionReport',
              'pub fn evaluate_segment_decision(',
              'pub fn resolve_runtime_vad_profile(',
              'pub enum RuntimeStage',
              'pub struct EngineStatus',
              '"Realtime"',
              '"Quality"',
          ]
          present = [marker for marker in retired if marker in rust]
          if present:
              raise SystemExit('Retired B6 surface remains: ' + ', '.join(present))

          helper = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge.rs').read_text(encoding='utf-8')
          for marker in ['pub fn cancel_helper_bridge_meeting_session(', 'pub fn helper_bridge_worker_status()', 'pub fn start_helper_bridge()']:
              if marker not in helper:
                  raise SystemExit('Active helper owner missing: ' + marker)

          vad = Path('EngineData/Frontend/RustApp/src-tauri/src/engine/audio/vad.rs').read_text(encoding='utf-8')
          required_vad = [
              'pub fn runtime_vad_profile()',
              'pre_roll_audio_ms: 140',
              'minimum_speech_duration_ms: 140',
              'minimum_silence_duration_ms: 100',
              'target_chunk_min_ms: 320',
              'target_chunk_max_ms: 700',
              'maximum_segment_duration_ms: 1_500',
              'min_rms: 0.006',
              'min_peak: 0.021',
              'min_active_frame_ratio: 0.050',
              'max_clipping_ratio: 0.025',
              'min_speech_ms: 120',
          ]
          for marker in required_vad:
              if marker not in vad:
                  raise SystemExit('B6 changed current VAD contract: ' + marker)

          registry = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/registry.rs').read_text(encoding='utf-8')
          for marker in ['runtime::start_helper_bridge', 'helper_bridge::helper_bridge_worker_status', 'runtime::verify_models']:
              if marker not in registry:
                  raise SystemExit('Active registry command missing: ' + marker)
          print('B6 retired-symbol and active-owner guards passed.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'B6 source ownership guard failed.' }

      - name: Verify B6 scope and canonical state
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $expected = @(
            'EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/finalized_utterance.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/input.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_audio_buffer.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_capture.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_segment_writer.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/mod.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/vad.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/settings.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/state.rs',
            'docs/knowledge/next-action.md',
            'docs/knowledge/source-ownership.md'
          )
          $changed = @(git status --porcelain --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "Unexpected: $_" }
            throw 'Unexpected B6 changed path.'
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing: $_" }
            throw 'Expected B6 changed path missing.'
          }
          $next = Get-Content docs/knowledge/next-action.md -Raw
          if (-not $next.Contains('## Backend Pre-Local B6 — CLOSED')) { throw 'B6 closure missing.' }
          if (-not $next.Contains('## Next Step — Target-Windows Acceptance Authorization')) { throw 'post-B6 target boundary missing.' }
          git diff --stat

      - name: Commit proven B6 cleanup
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add `
            EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs `
            EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge.rs `
            EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs `
            EngineData/Frontend/RustApp/src-tauri/src/commands/runtime_inventory.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/finalized_utterance.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/input.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_audio_buffer.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_capture.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/live_segment_writer.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/mod.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/audio/vad.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/settings.rs `
            EngineData/Frontend/RustApp/src-tauri/src/engine/state.rs `
            docs/knowledge/next-action.md `
            docs/knowledge/source-ownership.md
          git commit -m 'Remove proven dead backend scaffolding'
          git push origin HEAD:New
