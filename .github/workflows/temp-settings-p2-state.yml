name: Temporary Settings P2 State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-settings-p2-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - name: Update canonical next action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/knowledge/next-action.md')
          text = path.read_text(encoding='utf-8')

          old_mode = '**Developing / Frontend P1 VoiceLab Humanization CLOSED — P2 SETTINGS CLEANUP NEXT**'
          new_mode = '**Developing / Frontend P2 Settings Cleanup CLOSED — P3 SHELL STATUS CLEANUP NEXT**'
          if old_mode not in text:
              raise SystemExit('current mode anchor not found')
          text = text.replace(old_mode, new_mode, 1)

          marker = '## Existing Source-Closed Boundaries\n'
          section_lines = [
              '## Frontend P2 Settings Cleanup Closure',
              '',
              'The bounded Settings cleanup wave is source-closed at the existing `Settings.svelte` owner. Normal `Settings -> Meeting` keeps the same device selection, Mic Test, setup repair, route status, and Advanced/Diagnostics behavior while removing redundant and overly technical normal-user presentation.',
              '',
              'The redundant `Check Microphone` action was removed because microphone selection already performs the functional candidate check before saving. `Mic Test` and `Check Setup` remain as distinct actions. Meeting-microphone recovery copy no longer requires the user to understand a matched virtual-audio cable pair; it now directs the user to `Check Setup` in ordinary product language.',
              '',
              'Technical troubleshooting detail remains intentionally contained in `Advanced -> Diagnostics`: Worker state, outbound provider status, CUDA/CPU execution information, `Verify Models`, and recent frontend/Tauri command errors were preserved. No device transaction, audio route, setup-repair behavior, backend readiness rule, persisted schema, or new frontend state owner was changed.',
              '',
              'Accepted hosted source proof:',
              '',
              '```text',
              'run 31797784828',
              'Settings P2 normal-UI contract -> PASS',
              'bounded single-owner frontend change -> PASS',
              'frontend typecheck -> PASS',
              'frontend production build -> PASS',
              'source commit -> fa5162c2a2aa02f912d1f2ae6219041d989be296',
              '```',
              '',
              'The temporary P2 patch/proof files were removed after the successful proof.',
              '',
          ]
          section = '\n'.join(section_lines) + '\n'
          if '## Frontend P2 Settings Cleanup Closure' not in text:
              if marker not in text:
                  raise SystemExit('source-closed marker not found')
              text = text.replace(marker, section + marker, 1)

          old_list = 'Frontend P1 VoiceLab humanization and hierarchy alignment\nP3 private Python/runtime/model packaging contract'
          new_list = 'Frontend P1 VoiceLab humanization and hierarchy alignment\nFrontend P2 Settings normal-UI cleanup and Diagnostics containment\nP3 private Python/runtime/model packaging contract'
          if old_list in text:
              text = text.replace(old_list, new_list, 1)

          old_next = '**P2 — Settings cleanup and normal-user technical-leakage containment. Keep the existing `Meeting / Advanced` settings structure and all runtime behavior, but remove the redundant normal `Check Microphone` action because microphone selection already performs the functional check, simplify normal Meeting settings copy so users do not need to understand matched virtual-audio cable/provider internals, and keep Worker/CUDA/provider/command-error detail inside `Advanced -> Diagnostics`. Do not change device-selection transactions, Mic Test behavior, setup repair, audio routing, backend readiness, or add new settings/state/component systems.**'
          new_next = '**P3 — Shell/status redundancy cleanup. Keep the existing sidebar, routes, product-state mapping, Meeting polling, and page-level direction UI, but remove the global direction pill from the app header because it duplicates Meeting/Text direction and is irrelevant in Settings, preserve the transient notice plus the active-Meeting return control, and suppress the redundant Meeting page-header `Live` badge when the live activity surface already communicates `Listening / Translating / Speaking`. Keep setup/unavailable/starting/stopping attention states visible. Do not change runtime state semantics, navigation behavior, Meeting lifecycle, or add new shell/state/component systems.**'
          if old_next not in text:
              raise SystemExit('current Next Step anchor not found')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical state
        shell: bash
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -m 'Close Settings P2 frontend cleanup'
          git push origin HEAD:New
