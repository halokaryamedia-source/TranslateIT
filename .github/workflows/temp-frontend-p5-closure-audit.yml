name: Temporary Frontend P5 Closure Audit

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-frontend-p5-closure-audit.yml

permissions:
  contents: write

jobs:
  audit-and-prove:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Apply bounded frontend P5 closure fixes
        shell: pwsh
        run: |
          python .github/scripts/temp-frontend-p5-closure-audit.py
          git diff --check
      - name: Verify bounded frontend ownership
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'EngineData/Frontend/RustApp/src/pages/Meeting.svelte',
            'EngineData/Frontend/RustApp/src/pages/Text.svelte',
            'EngineData/Frontend/RustApp/src/pages/VoiceLab.svelte'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected product-source change: $path" }
          }
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Frontend typecheck
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck
      - name: Frontend production build
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Commit frontend P5 closure fixes
        shell: pwsh
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/src/pages/Meeting.svelte EngineData/Frontend/RustApp/src/pages/Text.svelte EngineData/Frontend/RustApp/src/pages/VoiceLab.svelte
          git commit -m 'Close remaining frontend source residues'
          git push origin HEAD:New
