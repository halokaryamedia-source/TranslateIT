name: Temporary Record Visual Baseline

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-record-visual-baseline.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Append durable visual decision
        shell: bash
        env:
          VISUAL_DECISION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("docs/knowledge/decision-log.md")
          text = path.read_text(encoding="utf-8")
          heading = "## D-018 — Clean Desktop Utility Is The Approved Visual Baseline"
          if heading in text:
              raise SystemExit("D-018 already exists; refusing duplicate decision entry")
          entry = base64.b64decode(os.environ["VISUAL_DECISION_B64"]).decode("utf-8")
          path.write_text(text.rstrip() + "\n\n" + entry, encoding="utf-8", newline="\n")
          PY

      - name: Commit decision
        shell: bash
        run: |
          git diff --check
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add docs/knowledge/decision-log.md
          git commit -m "Record approved frontend visual baseline"
          git push origin HEAD:New
