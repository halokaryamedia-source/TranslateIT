name: Temporary R2 Supply-Chain Audit

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r2-supply-chain-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: npm advisory audit
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm --version
          npm audit --package-lock-only --json | Set-Content -Path "$env:RUNNER_TEMP\npm-full.json" -Encoding utf8
          $fullExit = $LASTEXITCODE
          npm audit --package-lock-only --omit=dev --json | Set-Content -Path "$env:RUNNER_TEMP\npm-prod.json" -Encoding utf8
          $prodExit = $LASTEXITCODE
          $env:NPM_FULL_EXIT = "$fullExit"
          $env:NPM_PROD_EXIT = "$prodExit"
          @'
          import json, os
          from pathlib import Path
          for label in ('full','prod'):
              path = Path(os.environ['RUNNER_TEMP']) / f'npm-{label}.json'
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              print(f"[r2][npm][{label}] vulnerabilities={meta}")
              vulns = data.get('vulnerabilities', {})
              for name in sorted(vulns):
                  row = vulns[name]
                  via = row.get('via', [])
                  ids=[]
                  for item in via:
                      if isinstance(item, dict):
                          ids.append(str(item.get('url') or item.get('source') or item.get('title') or 'advisory'))
                  print(f"[r2][npm][{label}] {name} severity={row.get('severity')} direct={row.get('isDirect')} range={row.get('range')} fix={row.get('fixAvailable')} via={' | '.join(ids[:5])}")
          print(f"[r2][npm] full_exit={os.environ.get('NPM_FULL_EXIT')} prod_exit={os.environ.get('NPM_PROD_EXIT')}")
          '@ | Set-Content -Path "$env:RUNNER_TEMP\summarize_npm.py" -Encoding utf8
          python "$env:RUNNER_TEMP\summarize_npm.py"
          exit 0

      - name: Install current RustSec cargo-audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --version

      - name: RustSec Cargo.lock audit
        working-directory: EngineData/Frontend/RustApp/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo audit --file Cargo.lock --json | Set-Content -Path "$env:RUNNER_TEMP\cargo-audit.json" -Encoding utf8
          $auditExit = $LASTEXITCODE
          $env:CARGO_AUDIT_EXIT = "$auditExit"
          @'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP'])/'cargo-audit.json').read_text(encoding='utf-8-sig'))
          vulns = data.get('vulnerabilities', {})
          print(f"[r2][rust] found={vulns.get('found')} count={vulns.get('count')} exit={os.environ.get('CARGO_AUDIT_EXIT')}")
          for row in vulns.get('list', []):
              adv=row.get('advisory',{})
              pkg=row.get('package',{})
              print(f"[r2][rust][vuln] {adv.get('id')} package={pkg.get('name')}@{pkg.get('version')} title={adv.get('title')} patched={adv.get('patched_versions')}")
          warnings=data.get('warnings',{})
          for kind, rows in sorted(warnings.items()):
              for row in rows:
                  adv=row.get('advisory',{})
                  pkg=row.get('package',{})
                  print(f"[r2][rust][warning:{kind}] {adv.get('id')} package={pkg.get('name')}@{pkg.get('version')} title={adv.get('title')}")
          '@ | Set-Content -Path "$env:RUNNER_TEMP\summarize_cargo.py" -Encoding utf8
          python "$env:RUNNER_TEMP\summarize_cargo.py"
          exit 0

      - name: Install pinned Python audit tooling
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0 pip-audit==2.10.1 packaging
          pip-audit --version

      - name: Export active Windows production Python closure
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        shell: pwsh
        run: |
          uv export --frozen --no-dev --format requirements.txt --no-hashes --no-emit-project --output-file "$env:RUNNER_TEMP\python-export.txt"
          $env:REQ_IN = "$env:RUNNER_TEMP\python-export.txt"
          $env:REQ_OUT = "$env:RUNNER_TEMP\python-windows-active.txt"
          @'
          import os
          from pathlib import Path
          from packaging.requirements import Requirement
          source=Path(os.environ['REQ_IN']).read_text(encoding='utf-8')
          rows=[]
          for raw in source.splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or line.startswith('-'):
                  continue
              try:
                  req=Requirement(line)
              except Exception:
                  continue
              if req.marker is not None and not req.marker.evaluate():
                  continue
              exact=[s.version for s in req.specifier if s.operator=='==']
              if len(exact)!=1:
                  raise SystemExit(f'non-exact active requirement: {line}')
              rows.append(f'{req.name}=={exact[0]}')
          rows=sorted(set(rows), key=str.lower)
          Path(os.environ['REQ_OUT']).write_text('\n'.join(rows)+'\n', encoding='utf-8')
          print(f'[r2][python] active_windows_no_dev={len(rows)}')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\active_python.py" -Encoding utf8
          python "$env:RUNNER_TEMP\active_python.py"

      - name: PyPA and OSV Python audits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pip-audit --no-deps --disable-pip -r "$env:RUNNER_TEMP\python-windows-active.txt" -f json -s pypi -o "$env:RUNNER_TEMP\pip-audit-pypi.json"
          $pypiExit=$LASTEXITCODE
          pip-audit --no-deps --disable-pip -r "$env:RUNNER_TEMP\python-windows-active.txt" -f json -s osv -o "$env:RUNNER_TEMP\pip-audit-osv.json"
          $osvExit=$LASTEXITCODE
          $env:PIP_PYPI_EXIT="$pypiExit"
          $env:PIP_OSV_EXIT="$osvExit"
          @'
          import json, os
          from pathlib import Path
          for service in ('pypi','osv'):
              path=Path(os.environ['RUNNER_TEMP'])/f'pip-audit-{service}.json'
              data=json.loads(path.read_text(encoding='utf-8-sig'))
              deps=data.get('dependencies', data if isinstance(data,list) else [])
              vulns=[]; skipped=[]
              for dep in deps:
                  name=dep.get('name'); version=dep.get('version')
                  if dep.get('skip_reason'):
                      skipped.append((name,version,dep.get('skip_reason')))
                  for vuln in dep.get('vulns',[]):
                      vulns.append((name,version,vuln.get('id'),vuln.get('fix_versions',[]),vuln.get('aliases',[])))
              print(f'[r2][python][{service}] vulnerabilities={len(vulns)} skipped={len(skipped)}')
              for row in vulns:
                  print(f'[r2][python][{service}][vuln] {row[0]}@{row[1]} id={row[2]} fixes={row[3]} aliases={row[4]}')
              for row in skipped:
                  print(f'[r2][python][{service}][skip] {row[0]}@{row[1]} reason={row[2]}')
          print(f"[r2][python] pypi_exit={os.environ.get('PIP_PYPI_EXIT')} osv_exit={os.environ.get('PIP_OSV_EXIT')}")
          '@ | Set-Content -Path "$env:RUNNER_TEMP\summarize_pip_audit.py" -Encoding utf8
          python "$env:RUNNER_TEMP\summarize_pip_audit.py"
          exit 0

      - name: Bounded tracked-source secret and developer-path scan
        shell: pwsh
        run: |
          @'
          import re, subprocess
          from pathlib import Path

          tracked=subprocess.check_output(['git','ls-files','-z']).decode('utf-8',errors='replace').split('\0')
          roots=('EngineData/','.github/','AGENTS.md','CONTEXT.md')
          excluded_prefixes=('DevelopingData/','EngineData/Backend/RuntimeAssets/ASR/ModelData/','EngineData/Backend/RuntimeAssets/Translation/ModelData/')
          secret_patterns={
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(r'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{40,}\b'),
              'aws-access-key': re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              'openai-key': re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'),
              'google-api-key': re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b'),
              'slack-token': re.compile(r'\bxox[baprs]-[0-9A-Za-z-]{20,}\b'),
          }
          path_patterns={
              'windows-user-path': re.compile(r'(?i)\b[A-Z]:\\(?:Users|Workspaces|Downloads|Documents|Desktop)\\'),
              'unix-user-path': re.compile(r'/(?:home|Users)/[^/\s]+/'),
          }
          secret_hits=[]; path_hits=[]
          for name in tracked:
              if not name or not (name.startswith(roots[0]) or name.startswith(roots[1]) or name in roots[2:]):
                  continue
              if name.startswith(excluded_prefixes):
                  continue
              p=Path(name)
              try:
                  if p.stat().st_size > 2_000_000: continue
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for number,line in enumerate(text.splitlines(),1):
                  for label,rx in secret_patterns.items():
                      if rx.search(line): secret_hits.append((label,name,number))
                  for label,rx in path_patterns.items():
                      if rx.search(line): path_hits.append((label,name,number))
          print(f'[r2][tracked-source] high_confidence_secret_hits={len(secret_hits)} developer_path_hits={len(path_hits)}')
          for label,name,line in secret_hits:
              print(f'[r2][secret] {label} {name}:{line}')
          for label,name,line in path_hits:
              print(f'[r2][path] {label} {name}:{line}')
          if secret_hits:
              raise SystemExit('high-confidence tracked-source secret pattern detected')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\tracked_scan.py" -Encoding utf8
          python "$env:RUNNER_TEMP\tracked_scan.py"

      - name: Release-script dynamic fetch/install surface scan
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path
          root=Path('EngineData/Frontend/RustApp/scripts')
          files=[root/'build_release.ps1', root/'generate_third_party_notices.mjs', root/'validate_release_payload.mjs', root/'validate_release_package_contract.mjs']
          patterns={
              'powershell-download': re.compile(r'(?i)Invoke-WebRequest|Invoke-RestMethod|Start-BitsTransfer'),
              'cli-download': re.compile(r'(?i)(?:^|\s)(?:curl|wget)(?:\.exe)?(?:\s|$)'),
              'package-install': re.compile(r'(?i)(?:pip|uv\s+pip|npm)\s+(?:install|ci)\b|cargo\s+install\b'),
              'git-clone': re.compile(r'(?i)git\s+clone\b'),
              'npm-exec': re.compile(r'(?i)npm\s+exec\b'),
          }
          hits=[]
          for path in files:
              text=path.read_text(encoding='utf-8')
              for number,line in enumerate(text.splitlines(),1):
                  for label,rx in patterns.items():
                      if rx.search(line): hits.append((label,str(path).replace('\\','/'),number,line.strip()))
          print(f'[r2][release-scripts] dynamic_tooling_hits={len(hits)}')
          for label,path,line,text in hits:
              print(f'[r2][release-scripts] {label} {path}:{line} :: {text}')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\release_surface.py" -Encoding utf8
          python "$env:RUNNER_TEMP\release_surface.py"
