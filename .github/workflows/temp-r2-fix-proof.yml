name: Temporary R2 Bounded Fix Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r2-fix-proof.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded source fix
        shell: pwsh
        run: |
          python .github/scripts/temp-r2-fix.py
          Push-Location EngineData/Frontend/RustApp/src-tauri
          cargo update -p crossbeam-epoch --precise 0.9.20
          cargo update -p anyhow --precise 1.0.103
          Pop-Location
          git diff --check

      - name: Verify exact bounded product diff
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $allowed = @(
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs',
            'EngineData/Frontend/RustApp/src-tauri/Cargo.lock'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected R2 product change: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected R2 product change missing: $path" }
          }
          $lockDiff = git diff -- EngineData/Frontend/RustApp/src-tauri/Cargo.lock
          if ($lockDiff -notmatch 'crossbeam-epoch' -or $lockDiff -notmatch '0\.9\.20' -or $lockDiff -notmatch 'anyhow' -or $lockDiff -notmatch '1\.0\.103') {
            throw 'Cargo.lock does not contain both intended security patch updates.'
          }
          Write-Host '[r2] exact three-owner product diff -> PASS'

      - name: Install frozen frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: npm ci

      - name: Verify release uses only local Tauri CLI
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          $cli = Join-Path (Get-Location) 'node_modules\.bin\tauri.cmd'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw 'Local Tauri CLI from npm ci is missing.' }
          & $cli --version
          $release = Get-Content scripts/build_release.ps1 -Raw
          if ($release -match 'npm exec|\bnpx\s') { throw 'Dynamic npm execution remains in release build.' }
          node scripts/validate_release_package_contract.mjs

      - name: npm audit remains clean
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          npm audit --package-lock-only --omit=dev
          if ($LASTEXITCODE -ne 0) { throw 'Production npm audit is not clean.' }

      - name: Frontend production context
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          npm run typecheck
          npm run build:frontend

      - name: Rust compile and tests with patched lock
        working-directory: EngineData/Frontend/RustApp/src-tauri
        shell: pwsh
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo check --locked
          cargo test --locked

      - name: Install and rerun RustSec audit
        shell: pwsh
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Assert patched Rust advisories are gone and residual quick-xml is classified
        working-directory: EngineData/Frontend/RustApp/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo audit --file Cargo.lock --json | Set-Content "$env:RUNNER_TEMP\cargo-audit-after.json" -Encoding utf8
          $env:AUDIT_JSON = "$env:RUNNER_TEMP\cargo-audit-after.json"
          @'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['AUDIT_JSON']).read_text(encoding='utf-8-sig'))
          rows=data.get('vulnerabilities',{}).get('list',[])
          ids={row.get('advisory',{}).get('id') for row in rows}
          forbidden={'RUSTSEC-2026-0204','RUSTSEC-2026-0190'}
          if ids & forbidden:
              raise SystemExit(f'patched advisory remains: {sorted(ids & forbidden)}')
          required={'RUSTSEC-2026-0194','RUSTSEC-2026-0195'}
          if not required.issubset(ids):
              raise SystemExit(f'expected residual quick-xml advisories missing from audit evidence: {sorted(required-ids)}')
          unexpected=ids-required
          if unexpected:
              raise SystemExit(f'unexpected residual Rust vulnerability: {sorted(unexpected)}')
          print(f'[r2] RustSec patched advisories removed; residual={sorted(ids)} -> PASS')
          '@ | Set-Content "$env:RUNNER_TEMP\classify_rust.py" -Encoding utf8
          python "$env:RUNNER_TEMP\classify_rust.py"
          exit 0

      - name: Prove quick-xml residual has no TranslateIT XML/plist input owner
        shell: pwsh
        run: |
          $hits = git grep -n -E 'quick[_-]xml|quick_xml|plist::|from_file|from_reader_xml|NsReader' -- 'EngineData/Frontend/RustApp/src-tauri/src/**' 2>$null
          if ($LASTEXITCODE -eq 0 -and $hits) { throw "Unexpected direct XML/plist parser path in TranslateIT source:`n$hits" }
          Write-Host '[r2] no direct TranslateIT XML/plist parser path -> PASS'

      - name: Prove Python advisory containment decisions from current source contract
        shell: pwsh
        run: |
          $worker = Get-Content 'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py' -Raw
          $pyproject = Get-Content 'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml' -Raw
          if ($worker -notmatch 'MAX_TRANSLATION_TEXT_CHARS\s*=\s*2_000') { throw 'Translation input bound drifted.' }
          $bound = $worker.IndexOf('runtime_text_too_large(payload.get("text", ""), MAX_TRANSLATION_TEXT_CHARS)')
          $runtime = $worker.IndexOf('runtime = get_translation_runtime(source_language, target_language)')
          if ($bound -lt 0 -or $runtime -lt 0 -or $bound -ge $runtime) { throw 'Translation size gate is not before tokenizer/model runtime.' }
          if ($pyproject -notmatch 'transformers>=4\.44\.0,<=4\.50\.0') { throw 'Reviewed GPT-SoVITS Transformers compatibility boundary drifted.' }
          $tracked = git grep -n -F 'torch.jit.script' -- 'EngineData/**' 2>$null
          if ($LASTEXITCODE -eq 0 -and $tracked) { throw "torch.jit.script is reachable in tracked TranslateIT source:`n$tracked" }
          Write-Host '[r2] bounded Marian exposure + no tracked torch.jit.script + preserved upstream compatibility cap -> PASS'

      - name: Commit R2 bounded fixes
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/scripts/build_release.ps1 EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs EngineData/Frontend/RustApp/src-tauri/Cargo.lock
          git commit -m 'Contain actionable supply-chain findings'
          git push origin HEAD:New
