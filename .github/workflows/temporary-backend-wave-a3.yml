name: Temporary Backend Wave A3 Deadline Authority Proof

# Final A3 rerun verifies that caller payload cannot override the Rust host deadline.
on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-wave-a3.yml

permissions:
  contents: write

jobs:
  maintain-and-prove:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply final bounded Wave A3 deadline-authority correction
        shell: pwsh
        run: python .tmp/backend_wave_a3_followup.py source

      - name: Format bounded Rust module
        shell: pwsh
        run: rustfmt --edition 2021 EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs

      - name: Validate bounded changed scope
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $allowed = @('EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs')
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected changed path missing: $path" }
          }
          git diff --stat

      - name: Install proof-only pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "pytest==8.4.2"

      - name: Re-run Python worker contract and deadline tests
        shell: pwsh
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m pytest tests/test_worker_contract.py -q

      - name: Materialize canonical frontend dependencies
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Build frontend prerequisite for Tauri context
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend

      - name: Targeted Rust helper deadline authority tests
        shell: pwsh
        run: cargo test --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml deadline_policy_tests -- --test-threads=1

      - name: Windows Rust compile baseline
        shell: pwsh
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Native Tauri release build baseline
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npx tauri build --no-bundle

      - name: Reconcile final Wave A3 closure state
        shell: pwsh
        run: |
          python .tmp/backend_wave_a3_followup.py closure
          git diff --check

      - name: Commit proven Wave A3 deadline authority correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/helper_bridge_runtime.rs
          git add docs/knowledge/next-action.md
          git commit -m "Make helper deadline metadata host authoritative"
          git push origin HEAD:New
