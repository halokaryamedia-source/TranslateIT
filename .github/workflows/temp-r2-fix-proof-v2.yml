name: Temporary R2 Bounded Fix Proof V2

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r2-fix-proof-v2.yml

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply bounded source and lock fixes
        shell: pwsh
        run: |
          python .github/scripts/temp-r2-fix.py
          Copy-Item EngineData/Frontend/RustApp/src-tauri/Cargo.lock "$env:RUNNER_TEMP\Cargo.lock.before"
          Push-Location EngineData/Frontend/RustApp/src-tauri
          cargo update -p crossbeam-epoch --precise 0.9.20
          cargo update -p anyhow --precise 1.0.103
          Pop-Location
          git diff --check
          $env:BEFORE_LOCK = "$env:RUNNER_TEMP\Cargo.lock.before"
          $env:AFTER_LOCK = (Resolve-Path 'EngineData/Frontend/RustApp/src-tauri/Cargo.lock').Path
          @'
          import os, tomllib
          from collections import Counter
          from pathlib import Path
          def packages(path):
              data=tomllib.loads(Path(path).read_text(encoding='utf-8'))
              return Counter((str(p.get('name')),str(p.get('version')),str(p.get('source','')),str(p.get('checksum',''))) for p in data.get('package',[]))
          before=packages(os.environ['BEFORE_LOCK']); after=packages(os.environ['AFTER_LOCK'])
          removed=list((before-after).elements()); added=list((after-before).elements())
          print('[r2] lock removed=', removed)
          print('[r2] lock added=', added)
          if {x[:2] for x in removed}!={('crossbeam-epoch','0.9.18'),('anyhow','1.0.102')}:
              raise SystemExit('unexpected removed Cargo.lock package identity')
          if {x[:2] for x in added}!={('crossbeam-epoch','0.9.20'),('anyhow','1.0.103')}:
              raise SystemExit('unexpected added Cargo.lock package identity')
          if len(removed)!=2 or len(added)!=2:
              raise SystemExit('Cargo.lock delta contains more than two package entries')
          print('[r2] exact two-package Cargo.lock delta -> PASS')
          '@ | Set-Content "$env:RUNNER_TEMP\compare_lock.py" -Encoding utf8
          python "$env:RUNNER_TEMP\compare_lock.py"

      - name: Verify exact three-owner product diff
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $allowed = @(
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs',
            'EngineData/Frontend/RustApp/src-tauri/Cargo.lock'
          )
          foreach ($path in $changed) { if ($allowed -notcontains $path) { throw "Unexpected R2 product change: $path" } }
          foreach ($path in $allowed) { if ($changed -notcontains $path) { throw "Expected R2 product change missing: $path" } }
          Write-Host '[r2] exact three-owner product diff -> PASS'

      - name: Install frozen frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: npm ci

      - name: Verify local-only release CLI and release contract
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          $cli = Join-Path (Get-Location) 'node_modules\.bin\tauri.cmd'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw 'Local Tauri CLI from npm ci is missing.' }
          & $cli --version
          $release = Get-Content scripts/build_release.ps1 -Raw
          if ($release -match 'npm exec|\bnpx\s') { throw 'Dynamic npm execution remains in release build.' }
          node scripts/validate_release_package_contract.mjs
          npm audit --package-lock-only --omit=dev

      - name: Frontend production context
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: |
          npm run typecheck
          npm run build:frontend

      - name: Rust compile and tests
        working-directory: EngineData/Frontend/RustApp/src-tauri
        shell: pwsh
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo check --locked
          cargo test --locked

      - name: Install RustSec audit tool
        shell: pwsh
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Assert only classified quick-xml vulnerabilities remain
        working-directory: EngineData/Frontend/RustApp/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          cargo audit --file Cargo.lock --json | Set-Content "$env:RUNNER_TEMP\cargo-audit-after.json" -Encoding utf8
          $env:AUDIT_JSON="$env:RUNNER_TEMP\cargo-audit-after.json"
          @'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['AUDIT_JSON']).read_text(encoding='utf-8-sig'))
          ids={row.get('advisory',{}).get('id') for row in data.get('vulnerabilities',{}).get('list',[])}
          expected={'RUSTSEC-2026-0194','RUSTSEC-2026-0195'}
          if ids != expected:
              raise SystemExit(f'unexpected RustSec vulnerability set after patch: {sorted(ids)}')
          print(f'[r2] residual RustSec vulnerability set={sorted(ids)} -> PASS')
          '@ | Set-Content "$env:RUNNER_TEMP\classify_rust.py" -Encoding utf8
          python "$env:RUNNER_TEMP\classify_rust.py"
          exit 0

      - name: Prove residual advisory boundaries
        shell: pwsh
        run: |
          $xmlHits = git grep -n -E 'quick[_-]xml|quick_xml|plist::|NsReader' -- 'EngineData/Frontend/RustApp/src-tauri/src/**' 2>$null
          if ($LASTEXITCODE -eq 0 -and $xmlHits) { throw "Unexpected direct XML/plist parser path:`n$xmlHits" }
          $worker = Get-Content 'EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py' -Raw
          $pyproject = Get-Content 'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml' -Raw
          if ($worker -notmatch 'MAX_TRANSLATION_TEXT_CHARS\s*=\s*2_000') { throw 'Translation input bound drifted.' }
          $bound=$worker.IndexOf('runtime_text_too_large(payload.get("text", ""), MAX_TRANSLATION_TEXT_CHARS)')
          $runtime=$worker.IndexOf('runtime = get_translation_runtime(source_language, target_language)')
          if ($bound -lt 0 -or $runtime -lt 0 -or $bound -ge $runtime) { throw 'Translation size gate is not before tokenizer/model runtime.' }
          if ($pyproject -notmatch 'transformers>=4\.44\.0,<=4\.50\.0') { throw 'GPT-SoVITS compatibility boundary drifted.' }
          $jitHits = git grep -n -F 'torch.jit.script' -- 'EngineData/**' 2>$null
          if ($LASTEXITCODE -eq 0 -and $jitHits) { throw "torch.jit.script is reachable in tracked TranslateIT source:`n$jitHits" }
          Write-Host '[r2] residual quick-xml/Transformers/Torch advisory boundaries -> PASS'

      - name: Commit R2 bounded fixes
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Frontend/RustApp/scripts/build_release.ps1 EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs EngineData/Frontend/RustApp/src-tauri/Cargo.lock
          git commit -m 'Contain actionable supply-chain findings'
          git push origin HEAD:New
