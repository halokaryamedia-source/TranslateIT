name: MiLMMT Repository Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**"
      - "EngineData/Backend/RuntimeAssets/Translation/**"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - "CONTEXT.md"
      - "docs/knowledge/next-action.md"
      - ".github/workflows/milmmt-repo-contract.yml"
  pull_request:
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**"
      - "EngineData/Backend/RuntimeAssets/Translation/**"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - "CONTEXT.md"
      - "docs/knowledge/next-action.md"
      - ".github/workflows/milmmt-repo-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Validate canonical MiLMMT repository contract
        run: python tools/translation_quality/validate_canonical_milmmt_repo.py
      - name: Compile canonical Python owners
        run: >-
          python -m py_compile
          EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py
          EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker_base.py
          EngineData/Backend/LocalWorker/WorkerRuntime/milmmt_translation_provider.py
          EngineData/Backend/LocalWorker/WorkerRuntime/worker_runtime_common.py
          EngineData/Backend/LocalWorker/WorkerRuntime/worker_io_runtime.py
          EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets.py
          EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets_core.py
