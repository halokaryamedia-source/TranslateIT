name: Temporary Backend Pre-Local B1 Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-prelocal-b1.yml

permissions:
  contents: write

jobs:
  prove-b1:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Install canonical Python resolver
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "uv==0.12.3"
          uv --version

      - name: Apply bounded B1 correction
        shell: pwsh
        run: |
          python .tmp/backend_prelocal_b1_patch.py
          if ($LASTEXITCODE -ne 0) { throw "B1 patch helper failed." }

      - name: Reconcile frozen WorkerRuntime lock and tests
        shell: pwsh
        run: |
          Push-Location "EngineData/Backend/LocalWorker/WorkerRuntime"
          try {
            uv lock
            if ($LASTEXITCODE -ne 0) { throw "uv lock failed." }
            uv lock --check
            if ($LASTEXITCODE -ne 0) { throw "uv lock --check failed." }
            uv sync --frozen
            if ($LASTEXITCODE -ne 0) { throw "uv sync failed." }
            uv run --frozen pytest
            if ($LASTEXITCODE -ne 0) { throw "WorkerRuntime tests failed." }
          }
          finally { Pop-Location }

      - name: Format Rust source
        shell: pwsh
        run: |
          cargo fmt --manifest-path "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed." }

      - name: Verify B1 change scope
        shell: pwsh
        run: |
          git diff --check
          $expected = @(
            'EngineData/Backend/LocalWorker/WorkerRuntime/README.md',
            'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'EngineData/Backend/LocalWorker/WorkerRuntime/virtual_audio_route_provider.py',
            'EngineData/Frontend/RustApp/scripts/validate_startup_runtime_readiness.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_tauri_package_preflight.mjs',
            'EngineData/Frontend/RustApp/scripts/validate_virtual_route_contract.mjs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/mod.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/virtual_audio_route_runtime.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/virtual_mic_route.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/meeting_output.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/audio/mod.rs',
            'EngineData/Frontend/RustApp/src/app/bridge/runtimeApi.ts',
            'EngineData/Frontend/RustApp/src/app/bridge/runtimeProductFacade.ts',
            'docs/knowledge/next-action.md'
          )
          $changed = @(git status --porcelain --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "Unexpected: $_" }
            throw "Unexpected B1 changed path."
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing: $_" }
            throw "Expected B1 changed path missing."
          }
          git diff --stat

      - name: Prove canonical source contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed." }
          npm run validate:source-contracts
          if ($LASTEXITCODE -ne 0) { throw "source validators failed." }
          npm run preflight:tauri-package
          if ($LASTEXITCODE -ne 0) { throw "package preflight failed." }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "svelte-check failed." }
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed." }

      - name: Prove native Meeting output logic
        shell: pwsh
        run: |
          cargo test --manifest-path "EngineData/Frontend/RustApp/src-tauri/Cargo.toml" meeting_output -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Meeting output tests failed." }
          cargo check --manifest-path "EngineData/Frontend/RustApp/src-tauri/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw "cargo check failed." }

      - name: Prove Tauri release link
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Tauri release build failed." }

      - name: Commit proven B1 correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add -A
          git commit -m "Consolidate Meeting output in Rust audio runtime"
          git push origin HEAD:New
