name: Temporary VoiceLab 128-Line Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-voicelab-128-proof.yml

jobs:
  source-proof:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Validate 128-line varied script contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          p = Path('EngineData/Frontend/RustApp/src-tauri/src/commands/voice_lab_recording.rs')
          text = p.read_text(encoding='utf-8')
          block = text.split('const GUIDED_LINES: &[(u32, &str)] = &[', 1)[1].split('];', 1)[0]
          entries = re.findall(r'^\s*\((\d+),\s*"(.*)"\),\s*$', block, re.MULTILINE)
          assert len(entries) == 128, len(entries)
          ids = [int(i) for i, _ in entries]
          assert ids == list(range(1, 129)), ids
          lines = [s for _, s in entries]
          assert len(lines) == len(set(lines))
          words = [len(s.replace(';', ' ').split()) for s in lines]
          short = sum(n <= 7 for n in words)
          medium = sum(8 <= n <= 17 for n in words)
          long = sum(n >= 18 for n in words)
          assert short >= 12, (short, medium, long)
          assert medium >= 50, (short, medium, long)
          assert long >= 20, (short, medium, long)
          held_out = {
              'Please confirm the final schedule before we send the update to the client.',
              'The system should remain clear and natural during a longer technical discussion.',
              'I can review the latest results tomorrow morning and share my decision with the team.',
          }
          assert not set(lines).intersection(held_out)
          print(f'128 lines PASS: short={short}, medium={medium}, long={long}')
          '@ | python -
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Frontend typecheck
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck
      - name: Frontend production build
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Rust compile with warnings denied
        shell: pwsh
        run: |
          $env:RUSTFLAGS='-Dwarnings'
          cargo check --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Read-only closure guard
        run: git diff --exit-code
