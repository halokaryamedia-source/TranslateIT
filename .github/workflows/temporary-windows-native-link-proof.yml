name: Temporary Windows Native Link Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-windows-native-link-proof.yml

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp

    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Materialize frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Package source preflight
        run: npm run preflight:tauri-package

      - name: Native Tauri build without bundle
        run: npx tauri build --no-bundle

      - name: Verify native executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'src-tauri\target\release\translateit.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected native executable was not produced: $exe"
          }
          $item = Get-Item $exe
          Write-Host "Native executable: $($item.FullName)"
          Write-Host "Size bytes: $($item.Length)"
