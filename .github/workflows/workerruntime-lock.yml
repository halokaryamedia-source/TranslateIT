name: WorkerRuntime Lock Consistency

on:
  workflow_dispatch:
  push:
    branches:
      - Local
      - main
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - run: uv lock --check
      - run: git diff --exit-code -- pyproject.toml uv.lock
