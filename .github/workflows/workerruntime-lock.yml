name: WorkerRuntime Lock Consistency

on:
  workflow_dispatch:
  push:
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"
  pull_request:
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - name: Check canonical lock without modifying it
        run: uv lock --check
      - name: Require verification to remain read-only
        run: git diff --exit-code -- pyproject.toml uv.lock
