name: Temporary P2.3 Real Model Execution Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-p23-real-model-proof.yml

permissions:
  contents: read

jobs:
  prove-real-worker-models:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - name: Install locked-environment resolver
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "uv==0.12.3"
          uv --version

      - name: Materialize canonical locked WorkerRuntime
        shell: pwsh
        run: |
          & "EngineData/Backend/LocalWorker/WorkerRuntime/setup_realtime_worker.ps1"
          if ($LASTEXITCODE -ne 0) { throw "WorkerRuntime setup failed." }

      - name: Prove English TTS provider before model download
        shell: pwsh
        run: |
          $python = "EngineData/Backend/LocalWorker/WorkerRuntime/.venv/Scripts/python.exe"
          & $python ".tmp/p23_remote_model_proof.py" tts-preflight
          if ($LASTEXITCODE -ne 0) { throw "English TTS preflight failed." }

      - name: Observe runner accelerator availability
        shell: pwsh
        run: |
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi -L
            if ($LASTEXITCODE -ne 0) { Write-Host "P23::runner_gpu::nvidia-smi present but no usable GPU was reported" }
          } else {
            Write-Host "P23::runner_gpu::nvidia-smi unavailable"
          }

      - name: Free resolver cache before model assets
        shell: pwsh
        run: |
          uv cache clean
          Get-PSDrive C | Select-Object Name, Used, Free | Format-List

      - name: Download real canonical model assets for proof
        shell: pwsh
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          $python = "EngineData/Backend/LocalWorker/WorkerRuntime/.venv/Scripts/python.exe"
          & $python ".tmp/p23_remote_model_proof.py" download
          if ($LASTEXITCODE -ne 0) { throw "Model asset download failed." }
          Get-PSDrive C | Select-Object Name, Used, Free | Format-List

      - name: Execute persistent worker against real models
        shell: pwsh
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          $python = "EngineData/Backend/LocalWorker/WorkerRuntime/.venv/Scripts/python.exe"
          & $python ".tmp/p23_remote_model_proof.py" prove
          if ($LASTEXITCODE -ne 0) { throw "Real model execution proof failed." }

      - name: Confirm proof did not mutate tracked source
        shell: pwsh
        run: |
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw "P2.3 proof unexpectedly changed tracked or unignored repository files."
          }
          Write-Host "P23::repository_state::clean"
