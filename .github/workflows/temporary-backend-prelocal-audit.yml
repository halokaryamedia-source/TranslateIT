name: Temporary Backend Pre-Local Audit

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-prelocal-audit.yml

permissions:
  contents: write

jobs:
  audit-and-record:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Materialize canonical frontend dependencies
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Reproduce stale validator contracts
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          $startupOutput = & npm.cmd run validate:startup-readiness 2>&1 | Out-String
          $startupExit = $LASTEXITCODE
          Write-Host $startupOutput
          if ($startupExit -eq 0) { throw 'Expected stale startup-readiness marker was not reproduced.' }
          if ($startupOutput -notmatch 'latest_runtime_session_state\(\)\.snapshot\.is_some\(\)') {
            throw 'Startup-readiness validator failed for an unexpected reason.'
          }
          Write-Host 'PRELOCAL_AUDIT::startup_validator_stale_marker_reproduced'

          $routeOutput = & npm.cmd run validate:virtual-route 2>&1 | Out-String
          $routeExit = $LASTEXITCODE
          Write-Host $routeOutput
          if ($routeExit -eq 0) { throw 'Expected virtual-route validator contradiction was not reproduced.' }
          if ($routeOutput -notmatch 'get_virtual_mic_route_contract_status') {
            throw 'Virtual-route validator failed for an unexpected reason.'
          }
          Write-Host 'PRELOCAL_AUDIT::virtual_route_validator_contradiction_reproduced'

      - name: Frontend build baseline
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend

      - name: Rust compile baseline
        shell: pwsh
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Python source baseline
        shell: pwsh
        run: python -m compileall -q EngineData/Backend/LocalWorker/WorkerRuntime

      - name: Record canonical pre-local audit state
        shell: pwsh
        run: |
          python .tmp/backend_prelocal_audit_state.py
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'docs/knowledge/next-action.md') {
            $changed | ForEach-Object { Write-Host $_ }
            throw 'Unexpected canonical audit-state change scope.'
          }

      - name: Commit canonical audit state
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add docs/knowledge/next-action.md
          git commit -m "Map backend pre-local readiness work"
          git push origin HEAD:New
