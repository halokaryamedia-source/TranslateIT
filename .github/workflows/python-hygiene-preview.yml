name: Python Hygiene Preview

on:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/**/*.py"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/python-hygiene-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Install lock-resolved Ruff
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/translateit-ruff.txt"
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = {p.get("name"): p.get("version") for p in lock.get("package", [])}
          version = versions.get("ruff")
          if not version:
              raise SystemExit("canonical uv.lock is missing Ruff")
          print(f"ruff=={version}")
          PY
          python -m pip install -r "$RUNNER_TEMP/translateit-ruff.txt"
      - name: Apply canonical hygiene in workspace
        run: |
          ruff check . --select I --fix
          ruff format .
      - name: Capture patch
        shell: bash
        run: git -C "$GITHUB_WORKSPACE" diff --binary > "$RUNNER_TEMP/python-hygiene.patch"
      - name: Upload patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-hygiene-patch
          path: ${{ runner.temp }}/python-hygiene.patch
          if-no-files-found: error
          retention-days: 1
