name: Temporary R3 License Source Discovery

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r3-license-source-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - name: Resolve lock and PyPI source artifacts for missing-license distributions
        shell: bash
        run: |
          python - <<'PY'
          import json, tomllib, urllib.request
          from pathlib import Path
          names={
            'ctranslate2':'4.8.1','flatbuffers':'25.12.19','jieba':'0.42.1','jieba-fast':'0.53',
            'loguru':'0.7.3','onnxruntime':'1.28.0','sentencepiece':'0.2.2',
            'tensorboard-data-server':'0.7.2','tokenizers':'0.21.4','wordsegment':'1.3.1'
          }
          lock=tomllib.loads(Path('EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock').read_text())
          packages={(p['name'].lower(),str(p['version'])):p for p in lock.get('package',[])}
          for name,version in names.items():
              p=packages.get((name,version))
              print(f'[r3][source] {name}=={version}')
              if not p:
                  print('  LOCK_ENTRY_MISSING'); continue
              print('  lock_sdist=',p.get('sdist'))
              wheels=p.get('wheels',[])
              print('  lock_wheels=',len(wheels))
              url=f'https://pypi.org/pypi/{name}/{version}/json'
              with urllib.request.urlopen(url,timeout=30) as r:
                  data=json.load(r)
              info=data.get('info',{})
              print('  home_page=',info.get('home_page'))
              print('  project_urls=',json.dumps(info.get('project_urls') or {},sort_keys=True))
              for f in data.get('urls',[]):
                  if f.get('packagetype')=='sdist':
                      print('  pypi_sdist=',f.get('url'),'sha256=',(f.get('digests') or {}).get('sha256'))
          PY
