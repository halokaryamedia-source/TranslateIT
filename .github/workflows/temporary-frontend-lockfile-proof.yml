name: Temporary Frontend Lockfile Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-frontend-lockfile-proof.yml
      - EngineData/Frontend/RustApp/package-lock.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp

    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Report toolchain
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Require canonical repository lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'package-lock.json')) {
            throw 'Canonical package-lock.json is missing from the repository checkout.'
          }
          Write-Host 'Using canonical repository package-lock.json only.'

      - name: Validate lockfile root contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e @'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          const root = lock.packages?.[''];
          if (!root) throw new Error('package-lock.json is missing packages[""] root metadata.');
          const sameKeys = (a = {}, b = {}, label) => {
            const left = Object.keys(a).sort();
            const right = Object.keys(b).sort();
            if (JSON.stringify(left) !== JSON.stringify(right)) {
              throw new Error(`${label} root dependency keys differ. package.json=${left.join(',')} lock=${right.join(',')}`);
            }
          };
          sameKeys(pkg.dependencies, root.dependencies, 'dependencies');
          sameKeys(pkg.devDependencies, root.devDependencies, 'devDependencies');
          if (root.name !== pkg.name || root.version !== pkg.version) {
            throw new Error(`Lock root identity differs: ${root.name}@${root.version}`);
          }
          console.log(`lockfileVersion=${lock.lockfileVersion}`);
          console.log(`locked package entries=${Object.keys(lock.packages ?? {}).length}`);
          console.log(`root dependencies=${Object.keys(root.dependencies ?? {}).sort().join(',')}`);
          console.log(`root devDependencies=${Object.keys(root.devDependencies ?? {}).sort().join(',')}`);
          '@

      - name: Deterministic clean install from canonical lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'node_modules') { Remove-Item -Recurse -Force 'node_modules' }
          npm ci --no-audit --no-fund

      - name: Svelte check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build:frontend

      - name: Reconcile canonical project state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e @'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve(process.cwd(), '../../..');
          const contextPath = path.join(root, 'CONTEXT.md');
          const nextPath = path.join(root, 'docs', 'knowledge', 'next-action.md');

          function mustReplace(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`Canonical state replacement marker missing: ${label}`);
            return text.replace(from, to);
          }

          let context = fs.readFileSync(contextPath, 'utf8');
          context = mustReplace(
            context,
            'native Step 1 keyboard focus traversal + visible focus indicators\n',
            'native Step 1 keyboard focus traversal + visible focus indicators\ncanonical package-lock.json + deterministic clean npm ci proof\n',
            'CONTEXT obtained lockfile proof',
          );
          context = mustReplace(
            context,
            'adopt/review canonical frontend dependency lockfile\n',
            '',
            'CONTEXT remove completed lockfile item',
          );
          context = mustReplace(
            context,
            'The removed old `package-lock.json` must not be treated as valid for the current Svelte dependency graph until a canonical lockfile is regenerated, reviewed, and adopted against the proven dependency set.',
            '`EngineData/Frontend/RustApp/package-lock.json` is now the canonical npm lockfile for the current Svelte/Vite/Tauri frontend dependency graph. It was generated with Node 22.16.0 / npm 10.9.2, its root dependency set matches `package.json`, and a separate fresh GitHub-hosted Windows checkout passed strict `npm ci`, `svelte-check` with 0 errors / 0 warnings, and the Vite production build using the committed lockfile only.',
            'CONTEXT canonical lockfile statement',
          );
          fs.writeFileSync(contextPath, context);

          let next = fs.readFileSync(nextPath, 'utf8');
          next = mustReplace(
            next,
            'Native resize / keyboard focus      -> PASS\nFirstSetup Svelte diagnostics       -> PASS: 0 errors / 0 warnings\n',
            'Native resize / keyboard focus      -> PASS\nFirstSetup Svelte diagnostics       -> PASS: 0 errors / 0 warnings\nCanonical frontend package lock     -> PASS: strict npm ci\n',
            'next-action current chain',
          );

          const lockSection = `## Canonical Frontend Dependency Lockfile Baseline\n\n\`EngineData/Frontend/RustApp/package-lock.json\` is now the canonical npm lockfile for the current frontend dependency graph. It adds no second package manager or frontend toolchain; its root runtime and development dependency keys match the existing \`package.json\` owners exactly.\n\nCandidate generation/review run \`31561918268\` used Windows Server 2025 with Node 22.16.0 / npm 10.9.2 and established:\n\n\`\`\`text\nlockfileVersion                         -> 3\nlocked package entries                  -> 163\nroot runtime dependency keys            -> exact package.json match\nroot development dependency keys        -> exact package.json match\nclean npm ci                            -> PASS\nsvelte-check                            -> 0 errors / 0 warnings\nVite production build                   -> PASS\n\`\`\`\n\nThe reviewed candidate was adopted in commit \`a771ad8ef3c74112b8c838958f528f2e3d5c6b73\`. A separate strict repository-checkout proof then deliberately refused to generate a replacement lockfile and required the committed file to exist. Remote run \`31562191693\` passed:\n\n\`\`\`text\ncanonical repository package-lock.json -> present\nlockfile root contract                  -> PASS\nclean npm ci from committed lockfile    -> PASS\nsvelte-check                            -> 0 errors / 0 warnings\nVite production build                   -> PASS\n\`\`\`\n\nThis closes frontend dependency determinism at the current dependency graph. Future dependency changes must update \`package.json\` and the canonical lockfile together rather than relying on floating proof-run installs.\n\n`;
          next = mustReplace(next, '## Priority Map\n', lockSection + '## Priority Map\n', 'next-action lockfile proof section');
          next = mustReplace(
            next,
            'clean First Setup native re-render after warning correction\n',
            'clean First Setup native re-render after warning correction\ncanonical package-lock.json for current frontend dependency graph\nstrict clean npm ci from committed lockfile\n',
            'next-action P2.1 obtained',
          );
          next = mustReplace(
            next,
            'adopt/review canonical dependency lockfile\n',
            '',
            'next-action remove completed lockfile item',
          );
          next = mustReplace(
            next,
            '-> FirstSetup Svelte warning cleanup PASS\n-> canonical frontend dependency lockfile\n-> remaining remote-safe frontend/native proof\n',
            '-> FirstSetup Svelte warning cleanup PASS\n-> canonical frontend dependency lockfile PASS\n-> remote clipboard proof\n-> real runtime-state projection where remotely meaningful\n',
            'next-action sequencing',
          );

          const modeIndex = next.indexOf('## Current Mode\n');
          if (modeIndex < 0) throw new Error('Canonical state replacement marker missing: next-action Current Mode');
          next = next.slice(0, modeIndex) + `## Current Mode\n\n**Proof / frontend interaction boundary** — the canonical frontend lockfile is now adopted and passes strict clean-install/typecheck/build proof from a fresh GitHub-hosted Windows checkout. No user-local-PC, Python/model, or real audio execution occurred.\n\n## Next Step — P2.1 Remote Clipboard Interaction Baseline\n\nUse GitHub-hosted Windows only to exercise the current Text Copy path against a current translated result without starting Python/model/audio. Prove a successful clipboard write when the available WebView/browser clipboard API permits it and truthful product feedback when clipboard access fails or is unavailable. Do not substitute user-local-PC testing if the hosted environment cannot provide meaningful clipboard evidence; record the environment boundary instead.\n`;
          fs.writeFileSync(nextPath, next);
          '@

          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add ../../../CONTEXT.md ../../../docs/knowledge/next-action.md
          if (git diff --cached --quiet) {
            Write-Host 'Canonical project state already reconciled.'
          } else {
            git commit -m 'Record canonical frontend lockfile proof'
            git push origin HEAD:New
          }

      - name: Upload lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: translateit-canonical-frontend-lockfile
          path: EngineData/Frontend/RustApp/package-lock.json
          if-no-files-found: error
