name: Repository Verify

on:
  push:
    branches:
      - New
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "tools/verify_repository.py"
      - ".github/workflows/repository-verify.yml"
  pull_request:
    branches:
      - New
      - Developing
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "tools/verify_repository.py"
      - ".github/workflows/repository-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify repository governance
        run: python tools/verify_repository.py
