name: Repository Verify

on:
  push:
    branches:
      - Local
      - main
    paths:
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "tools/verify_repository.py"
      - ".github/workflows/**"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "tools/verify_repository.py"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Verify repository governance
        run: python tools/verify_repository.py
