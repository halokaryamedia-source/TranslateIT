name: Temporary A6 Rust Source

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-a6-rust-source.yml

permissions:
  contents: write

jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical A6 Rust source gate
        run: python .github/temp-a6-rust-source-gate-v2.py
