name: Temporary Backend Wave A1 Maintenance Proof

on:
  push:
    branches:
      - New
    paths:
      - .github/workflows/temporary-backend-wave-a1.yml

permissions:
  contents: write

jobs:
  maintain-and-prove:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 0

      - name: Apply bounded source correction
        shell: pwsh
        run: python .tmp/backend_wave_a1_patch.py source

      - name: Format bounded Rust changes
        shell: pwsh
        run: cargo fmt --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Validate changed scope
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $allowed = @(
            'EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/engine/capture_lifecycle.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/runtime.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/settings.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs',
            'EngineData/Frontend/RustApp/src-tauri/src/main.rs'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) { throw "Expected changed path missing: $path" }
          }
          git diff --stat

      - name: Targeted runtime authority tests
        shell: pwsh
        run: cargo test --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml runtime_state::tests -- --test-threads=1

      - name: Windows Rust compile baseline
        shell: pwsh
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml

      - name: Materialize canonical frontend dependencies
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Native Tauri release build baseline
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: npx tauri build --no-bundle

      - name: Record closure state
        shell: pwsh
        run: |
          python .tmp/backend_wave_a1_patch.py closure
          git diff --check

      - name: Commit proven correction
        shell: pwsh
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add EngineData/Frontend/RustApp/src-tauri/src/engine/runtime_state.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/engine/capture_lifecycle.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/runtime.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/settings.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/commands/meeting_session.rs
          git add EngineData/Frontend/RustApp/src-tauri/src/main.rs
          git add docs/knowledge/next-action.md
          git commit -m "Harden runtime authority fail-closed claims"
          git push origin HEAD:New
