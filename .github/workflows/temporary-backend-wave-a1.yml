#[cfg(test)]
mod tests {
    use super::*;

    static TEST_SERIAL: Mutex<()> = Mutex::new(());

    fn reset_test_state() {
        let store = RUNTIME_SESSION_STATE.get_or_init(|| Mutex::new(None));
        if let Ok(mut guard) = store.lock() {
            *guard = None;
        }
        RUNTIME_AUTHORITY_GENERATION.store(0, Ordering::Release);
