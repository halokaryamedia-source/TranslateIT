name: Temporary R1.2 State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-2-state-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - name: Update canonical R1.2 state
        run: python .github/scripts/temp-r1-2-state-sync.py

      - name: Commit canonical state
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -m 'Close R1.2 FFmpeg provenance gate'
          git push origin HEAD:New
