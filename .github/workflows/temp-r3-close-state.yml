name: Temporary R3 Closure State Sync

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r3-close-state.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - name: Reconcile canonical R3 state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/knowledge/next-action.md')
          text = path.read_text(encoding='utf-8')

          old_mode = '**Plan / R2 Dependency / Supply-Chain Static Audit CLOSED — R3 CONTROLLED RELEASE-INPUT EVIDENCE NEXT**'
          new_mode = '**Plan / R3 Controlled Release-Input Evidence CLOSED — RELEASE PACKAGING FORMAT DECISION REQUIRED**'
          if old_mode not in text:
              raise SystemExit('R3 mode anchor missing')
          text = text.replace(old_mode, new_mode, 1)

          marker = '## Existing Source-Closed Boundaries\n'
          if marker not in text:
              raise SystemExit('source-closed marker missing')

          section = '''## R3 Controlled Release-Input Evidence / NSIS Size Boundary\n\nR3 established the concrete controlled release inputs without opening local Windows validation. The standard VB-Audio VB-CABLE direction is now pinned to the vendor-hosted Pack45 package and the existing release validator owns the exact 31-file extraction/hash contract. The provider owner records the general end-user donationware distribution boundary separately from managed professional/company/institution deployment, which remains subject to VB-Audio's professional/volume licensing terms. This is source-side policy/provenance evidence, not legal advice or installed-driver proof.\n\nThe hosted controlled staging path successfully assembled and preflighted the exact current release payload:\n\n```text\nCPython 3.12.10 private runtime -> exact archive provenance verified\nWindows no-dev WorkerRuntime -> 116 production distributions before reviewed license-material completion\nASR -> pinned faster-whisper large-v3-turbo revision\nTranslation -> pinned Marian ID->EN and EN->ID revisions\nGPT-SoVITS -> pinned source + pretrained snapshot/hashes\nNLTK data -> pinned cmudict and tagger snapshot/hashes\nFFmpeg -> pinned reviewed BtbN LGPL build + license/source companions\nVB-CABLE -> exact official Pack45 archive + 31-file hash contract\nthird-party notices -> generated from staged payload\nrelease payload preflight -> PASS\n```\n\nThe staged payload size measured on hosted Windows was approximately:\n\n```text\nPythonRuntime  5,028,520,692 bytes\nASR            1,621,668,947 bytes\nTranslation    1,171,204,700 bytes\nVoice          1,595,329,955 bytes\nVB-CABLE           3,467,579 bytes\n--------------------------------\nTotal          9,420,191,873 bytes\n```\n\nInstaller rehearsal then established a packaging-format blocker, not a payload-input blocker. The normal Tauri NSIS path successfully built `translateit.exe` and reached `makensis`, then failed with:\n\n```text\nInternal compiler error #12345: error mmapping file (1806564345, 33554432) is out of range.\n```\n\nThe failure matches the classic NSIS large-installer / 32-bit compressed-data boundary. A second bounded rehearsal, run `31820622912`, temporarily set Tauri NSIS `compression` to `none`. Tauri's current NSIS template maps that setting to `SetCompress off`, so this removed `/SOLID` rather than merely changing compression algorithm. All controlled staging, notice generation, and payload preflight gates passed again; `translateit.exe` built again; `makensis` still failed with the same mmap offset/error. Disk capacity remained healthy (about 121 GB free on the working drive after failure).\n\nTherefore the current approximately 9.4 GB offline payload is not compatible with the standard Tauri/classic-NSIS all-in-one executable path. Trying zlib/bzip2/LZMA variants is not a grounded next step because every Tauri compression mode other than `none` uses `/SOLID`, while `none` has already failed. The project must not call installer generation closed or claim a distributable self-contained setup executable.\n\nNo runtime behavior, frontend behavior, model selection, VoiceLab behavior, or local/installed state was changed by the size-boundary probe. The temporary R3 staging/proof files are removed after this state reconciliation; accepted evidence remains in Git history and hosted workflow runs.\n\n'''
          text = text.replace(marker, section + marker, 1)

          boundary_anchor = 'R2 dependency / supply-chain static audit and bounded actionable containment\n'
          if boundary_anchor in text and 'R3 controlled release-input provenance / staged-payload preflight\n' not in text:
              text = text.replace(boundary_anchor, boundary_anchor + 'R3 controlled release-input provenance / staged-payload preflight\n', 1)

          old_next = '**R3 — controlled release-input evidence gate. Before attempting installer generation, establish the concrete standard VB-CABLE redistribution/licensing status for the intended TranslateIT release and obtain the exact official provider package bytes; stage only the already-pinned CPython/model/GPT-SoVITS/FFmpeg/provider inputs whose provenance, hashes, and required notices can be verified. If provider redistribution rights cannot be established for the intended release, STOP and do not bundle provider bytes. Once all concrete release inputs exist, run one hosted Windows controlled-payload preflight and NSIS installer-generation rehearsal. Do not use placeholder assets, first-use downloads, or call installer generation installed-runtime/clean-machine proof; local Windows validation remains deferred.**'
          new_next = '**DECISION REQUIRED — choose the release packaging boundary before more implementation. The recommended minimum-change direction is to preserve one user-facing installer experience and fully offline installation, but allow the distributable release to contain the installer plus colocated external payload file(s) instead of requiring one self-contained setup executable. Do not implement a bootstrapper, external-payload installer, first-use download system, alternate installer framework, or model/runtime reduction until the user explicitly approves the packaging boundary. Local Windows validation remains deferred.**'
          if old_next not in text:
              raise SystemExit('R3 next-step anchor missing')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text, encoding='utf-8')
          print('[r3-close] canonical state reconciled')
          PY

      - name: Remove temporary R3 proof and staging files
        shell: bash
        run: |
          git rm -f .github/workflows/temp-r3-*.yml .github/scripts/temp-r3-* || true
          git diff --check
          if git diff --name-only | grep -Ev '^(docs/knowledge/next-action.md|\.github/workflows/temp-r3-|\.github/scripts/temp-r3-)' ; then
            echo 'Unexpected R3 closure change' >&2
            exit 1
          fi

      - name: Commit closure state
        shell: bash
        run: |
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add docs/knowledge/next-action.md
          git commit -am 'Record R3 NSIS size boundary'
          git push origin HEAD:New
