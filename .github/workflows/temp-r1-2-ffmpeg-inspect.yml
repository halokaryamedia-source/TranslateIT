name: Temporary R1.2 FFmpeg Candidate Inspection

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-2-ffmpeg-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact BtbN LGPL static candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autobuild-2026-08-10-13-17'
          $asset = 'ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-8.1.zip'
          $expectedArchiveSha = 'b0531e470d73bf2e0d3e22a3a35f6e890781e0791c496950664da9be9ea8c0ab'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$asset"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expectedArchiveSha) { throw "Archive SHA mismatch: $actual" }
          Write-Host "[r1.2] archive_sha256=$actual"
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')

      - name: Inspect executable and license profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $exe = Get-ChildItem -Path $root -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in candidate archive' }
          $exeSha = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          Write-Host "[r1.2] ffmpeg_exe=$($exe.FullName)"
          Write-Host "[r1.2] ffmpeg_exe_sha256=$exeSha"
          $licenseFile = Get-ChildItem -Path $root -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $licenseFile) { throw 'LICENSE.txt not found in candidate archive' }
          $licenseSha = (Get-FileHash -Algorithm SHA256 $licenseFile.FullName).Hash.ToLowerInvariant()
          $licenseText = Get-Content $licenseFile.FullName -Raw
          Write-Host "[r1.2] license_sha256=$licenseSha"
          Write-Host '[r1.2] LICENSE.txt first lines:'
          Get-Content $licenseFile.FullName -TotalCount 80 | ForEach-Object { Write-Host $_ }
          if ($licenseText -notmatch 'GNU Lesser General Public License') { throw 'Archive license file does not contain LGPL notice' }
          Write-Host '[r1.2] archive top-level files:'
          Get-ChildItem -Path $root -Recurse -File | ForEach-Object { Write-Host $_.FullName.Substring($root.Length + 1) }
          $dlls = @(Get-ChildItem -Path $root -Recurse -Filter '*.dll' -File)
          Write-Host "[r1.2] dll_count=$($dlls.Count)"
          if ($dlls.Count -ne 0) { throw 'Static candidate unexpectedly contains DLL dependencies' }
          $version = & $exe.FullName -version 2>&1 | Out-String
          Write-Host '[r1.2] ffmpeg -version:'
          Write-Host $version
          if ($version -notmatch 'n8\.1\.2-34-g9b6c8969e0') { throw 'Unexpected FFmpeg source/version identity' }
          if ($version -match '--enable-gpl') { throw 'GPL configure flag present in LGPL candidate' }
          if ($version -match '--enable-nonfree') { throw 'nonfree configure flag present in LGPL candidate' }
          if ($version -notmatch '--pkg-config-flags=--static') { throw 'Static package configure marker missing' }
          $license = & $exe.FullName -L 2>&1 | Out-String
          Write-Host '[r1.2] ffmpeg -L:'
          Write-Host $license
          if ($license -notmatch 'GNU Lesser General Public License') { throw 'FFmpeg LGPL notice not reported by candidate' }
          if ($license -notmatch 'version 3 of the License') { throw 'Expected LGPL v3 profile not reported by candidate' }
          "FFMPEG_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Required VoiceLab decode smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wav = Join-Path $env:RUNNER_TEMP 'input.wav'
          $raw = Join-Path $env:RUNNER_TEMP 'output.f32le'
          @'
          import math, struct, wave, os
          path = os.environ['WAV_PATH']
          rate = 32000
          frames = rate // 4
          with wave.open(path, 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              data = bytearray()
              for i in range(frames):
                  s = int(5000 * math.sin(2 * math.pi * 440 * i / rate))
                  data.extend(struct.pack('<h', s))
              w.writeframes(bytes(data))
          '@ | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'make_wav.py') -Encoding utf8
          $env:WAV_PATH = $wav
          python (Join-Path $env:RUNNER_TEMP 'make_wav.py')
          & $env:FFMPEG_EXE -nostdin -y -i $wav -f f32le -acodec pcm_f32le -ac 1 -ar 32000 $raw
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg decode smoke failed' }
          if (-not (Test-Path $raw) -or (Get-Item $raw).Length -le 0) { throw 'FFmpeg decode smoke produced no output' }
          Write-Host "[r1.2] decode_bytes=$((Get-Item $raw).Length)"
          Write-Host '[r1.2] pinned LGPL static FFmpeg candidate inspection -> PASS'
