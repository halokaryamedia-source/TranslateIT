name: Temporary R1.1 G2P Distance Containment

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temp-r1-1-g2p-distance-containment.yml

permissions:
  contents: write

jobs:
  contain-and-prove:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install reviewed uv resolver
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.12.0

      - name: Patch bounded dependency owners
        shell: pwsh
        run: |
          $lock = 'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock'
          Copy-Item $lock "$env:RUNNER_TEMP/uv.lock.before"
          python .github/scripts/temp-r1-1-g2p-distance-containment.py patch
          git diff --check

      - name: Regenerate canonical uv lock
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        shell: pwsh
        run: |
          uv lock
          uv lock --check

      - name: Verify bounded lock delta
        shell: pwsh
        run: python .github/scripts/temp-r1-1-g2p-distance-containment.py verify-lock "$env:RUNNER_TEMP/uv.lock.before"

      - name: Verify bounded ownership
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'EngineData/Backend/LocalWorker/README.md',
            'EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected R1.1 source change: $path" }
          }

      - name: Prove exact g2p-en runtime works without Distance
        shell: pwsh
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP 'translateit-g2p-proof'
          uv venv $proofRoot --python 3.12
          $proofPython = Join-Path $proofRoot 'Scripts/python.exe'
          uv pip install --python $proofPython --no-deps g2p-en==2.1.0
          uv pip install --python $proofPython 'numpy<2' 'nltk>=3.9,<4' 'inflect>=7,<8'
          $env:NLTK_DATA = Join-Path $env:RUNNER_TEMP 'translateit-nltk-data'
          & $proofPython .github/scripts/temp-r1-1-g2p-smoke.py

      - name: VoiceLab provider contract regression
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        shell: pwsh
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP 'translateit-g2p-proof'
          $proofPython = Join-Path $proofRoot 'Scripts/python.exe'
          uv pip install --python $proofPython ffmpeg-python
          & $proofPython test_voice_lab_build_contract.py
          & $proofPython -c "import importlib.util; assert importlib.util.find_spec('distance') is None; print('[r1.1-voicelab] VoiceLab contract passed with Distance absent')"

      - name: Validate release package source contract
        working-directory: EngineData/Frontend/RustApp
        shell: pwsh
        run: node scripts/validate_release_package_contract.mjs

      - name: Commit R1.1 containment
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'halokaryamedia-source'
          git config user.email 'halokaryamedia@gmail.com'
          git add EngineData/Backend/LocalWorker/README.md EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs
          git commit -m 'Contain unused G2P Distance dependency'
          git push origin HEAD:New
