name: Temporary First Setup Warning Proof

on:
  push:
    branches: [New]
    paths:
      - .github/workflows/temporary-firstsetup-warning-proof.yml

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp

    steps:
      - name: Checkout New
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Materialize frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Official Svelte autofixer analysis
        run: npx -y @sveltejs/mcp svelte-autofixer ./src/pages/FirstSetup.svelte --svelte-version 5

      - name: Svelte typecheck
        run: npm run typecheck

      - name: Vite production build
        run: npm run build:frontend

      - name: Native Tauri build without bundle
        run: npx tauri build --no-bundle

      - name: Capture fresh native First Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'src-tauri\target\release\translateit.exe'
          if (-not (Test-Path $exe)) { throw "Expected native executable was not produced: $exe" }

          $isolatedLocal = Join-Path $env:RUNNER_TEMP 'TranslateITLocalAppData'
          $isolatedRoaming = Join-Path $env:RUNNER_TEMP 'TranslateITRoamingAppData'
          New-Item -ItemType Directory -Force -Path $isolatedLocal | Out-Null
          New-Item -ItemType Directory -Force -Path $isolatedRoaming | Out-Null
          $env:LOCALAPPDATA = $isolatedLocal
          $env:APPDATA = $isolatedRoaming

          $process = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "TranslateIT exited before First Setup render proof. Exit code: $($process.ExitCode)" }
            $native = Get-Process -Id $process.Id -ErrorAction Stop
          } while (($native.MainWindowHandle -eq 0 -or [string]::IsNullOrWhiteSpace($native.MainWindowTitle)) -and (Get-Date) -lt $deadline)

          if ($native.MainWindowHandle -eq 0) { throw 'TranslateIT did not expose a native main window handle.' }
          if ($native.MainWindowTitle -ne 'TranslateIT') { throw "Unexpected native window title: $($native.MainWindowTitle)" }
          if (-not $native.Responding) { throw 'TranslateIT native process is not responding.' }

          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class TranslateITWarningProof {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")]
            public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdcBlt, uint nFlags);
          }
          '@

          $hwnd = [IntPtr]$native.MainWindowHandle
          $rect = New-Object TranslateITWarningProof+RECT
          if (-not [TranslateITWarningProof]::GetWindowRect($hwnd, [ref]$rect)) { throw 'GetWindowRect failed.' }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          if ($width -lt 1200 -or $height -lt 700) { throw "Unexpected native window size: ${width}x${height}" }

          $artifactDir = Join-Path $env:RUNNER_TEMP 'translateit-firstsetup-warning-proof'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $png = Join-Path $artifactDir 'TranslateIT-FirstSetup-Warning-Clean.png'

          $bitmap = New-Object System.Drawing.Bitmap $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $hdc = $graphics.GetHdc()
            try {
              $ok = [TranslateITWarningProof]::PrintWindow($hwnd, $hdc, 2)
            } finally {
              $graphics.ReleaseHdc($hdc)
            }
          } finally {
            $graphics.Dispose()
          }
          if (-not $ok) {
            $bitmap.Dispose()
            throw 'PrintWindow failed.'
          }
          $bitmap.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          $check = [System.Drawing.Bitmap]::FromFile($png)
          try {
            $samples = New-Object 'System.Collections.Generic.HashSet[string]'
            $stepX = [Math]::Max(1, [int]($check.Width / 80))
            $stepY = [Math]::Max(1, [int]($check.Height / 50))
            for ($x = 0; $x -lt $check.Width; $x += $stepX) {
              for ($y = 0; $y -lt $check.Height; $y += $stepY) {
                $c = $check.GetPixel([Math]::Min($x, $check.Width - 1), [Math]::Min($y, $check.Height - 1))
                [void]$samples.Add("$($c.R),$($c.G),$($c.B)")
              }
            }
            if ($samples.Count -lt 20) { throw "Native First Setup capture appears incomplete; sampled RGB=$($samples.Count)." }
            Write-Host "Native First Setup -> ${width}x${height}, sampled RGB=$($samples.Count), bytes=$((Get-Item $png).Length)"
          } finally {
            $check.Dispose()
          }

          $children = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $process.Id }
          $pythonChildren = @($children | Where-Object { $_.Name -match '^(python|python3|py)\.exe$' })
          if ($pythonChildren.Count -gt 0) { throw 'Fresh First Setup unexpectedly spawned a Python child process.' }
          Write-Host 'Python child process count: 0'

          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2

      - name: Upload First Setup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translateit-firstsetup-warning-proof
          path: ${{ runner.temp }}\translateit-firstsetup-warning-proof\TranslateIT-FirstSetup-Warning-Clean.png
          if-no-files-found: error
