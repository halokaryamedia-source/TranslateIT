[project]
name = "translateit-worker-runtime"
version = "0.0.0"
description = "Internal Python runtime for the TranslateIT desktop application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2==4.8.1",
    "faster-whisper>=1.0.0",
    "sacremoses",
    "sentencepiece",
    "soundfile",
    "torch==2.13.0",
    "transformers>=4.44.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "huggingface-hub",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
