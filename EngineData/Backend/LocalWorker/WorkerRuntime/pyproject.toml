[project]
name = "translateit-worker-runtime"
version = "0.0.0"
description = "Internal Python runtime for the TranslateIT desktop application."
requires-python = ">=3.10"
dependencies = [
    "ctranslate2>=4.4.0",
    "faster-whisper>=1.0.0",
    "numpy",
    "sacremoses",
    "sentencepiece",
    "soundfile",
    "torch",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
virtual-audio-route = [
    "sounddevice>=0.4.6,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
