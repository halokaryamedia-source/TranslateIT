[package]
name = "translateit_rustapp"
version = "0.6.0"
description = "TranslateIT Rust/Tauri conversion shell"
authors = ["Halo Karya Media"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
