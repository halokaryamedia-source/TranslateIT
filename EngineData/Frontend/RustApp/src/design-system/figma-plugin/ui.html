<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 16px; font-family: Inter, Arial, sans-serif; color: #f5f6f8; background: #11141a; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 14px; color: #a5adba; font-size: 12px; line-height: 1.45; }
      textarea { width: 100%; height: 260px; box-sizing: border-box; border: 1px solid #37404b; border-radius: 10px; padding: 10px; color: #f5f6f8; background: #050609; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; }
      button { width: 100%; height: 40px; margin-top: 12px; border: 1px solid #37404b; border-radius: 10px; color: #f5f6f8; background: #151922; font-weight: 800; cursor: pointer; }
      .status { margin-top: 10px; color: #a5adba; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>TranslateIT Design Importer</h1>
    <p>Paste <code>translateit.figma-export.json</code>. The plugin creates a Figma page with token notes and component frames.</p>
    <textarea id="payload" placeholder="Paste JSON export here..."></textarea>
    <button id="importButton">Import Design System</button>
    <div id="status" class="status">Waiting for export JSON.</div>
    <script>
      const payload = document.getElementById("payload");
      const status = document.getElementById("status");
      document.getElementById("importButton").onclick = () => {
        try {
          const json = JSON.parse(payload.value);
          parent.postMessage({ pluginMessage: { type: "import-design-system", payload: json } }, "*");
          status.textContent = "Import sent to Figma.";
        } catch (error) {
          status.textContent = `Invalid JSON: ${error.message}`;
        }
      };
    </script>
  </body>
</html>
