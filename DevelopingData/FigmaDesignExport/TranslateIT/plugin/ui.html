<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; padding: 16px; background: #0b0e14; color: #f5f7fa; font-family: Inter, system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; color: #8d96a6; font-size: 12px; line-height: 1.5; }
    button { width: 100%; height: 38px; border: 1px solid #3a4454; border-radius: 10px; color: #f5f7fa; background: #11151c; font-weight: 700; cursor: pointer; }
    button + button { margin-top: 10px; }
    .secondary { color: #c8ced8; background: transparent; }
    code { color: #d7dde7; }
  </style>
</head>
<body>
  <h1>TranslateIT Design Export</h1>
  <p>Generate editable Figma pages, tokens, icon placeholders, and component frames from the repo export manifests.</p>
  <button id="create">Create Figma Library</button>
  <button id="notes" class="secondary">Create Notes Only</button>
  <script>
    document.getElementById('create').onclick = () => parent.postMessage({ pluginMessage: { type: 'create-library' } }, '*');
    document.getElementById('notes').onclick = () => parent.postMessage({ pluginMessage: { type: 'create-notes' } }, '*');
  </script>
</body>
</html>
