<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #0b0e14; color: #f5f7fa; font-family: Inter, system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 17px; line-height: 1.2; letter-spacing: -.03em; }
    p { margin: 0 0 14px; color: #8d96a6; font-size: 12px; line-height: 1.5; }
    .note { border: 1px solid #242b36; border-radius: 12px; padding: 10px 12px; background: #07090d; color: #c8ced8; font-size: 11px; line-height: 1.45; margin-bottom: 14px; }
    .status { min-height: 72px; max-height: 104px; overflow: auto; white-space: pre-wrap; border: 1px solid #242b36; border-radius: 12px; padding: 10px 12px; color: #8d96a6; background: #030407; font-size: 10px; line-height: 1.45; margin-top: 12px; }
    button { width: 100%; height: 40px; border: 1px solid #3a4454; border-radius: 10px; color: #f5f7fa; background: #11151c; font-weight: 800; cursor: pointer; }
    button + button { margin-top: 10px; }
    .secondary { color: #c8ced8; background: transparent; }
    .danger { color: #ffb3b8; border-color: #5c2730; background: #241014; }
    code { color: #d7dde7; }
  </style>
</head>
<body>
  <h1>TranslateIT Design Export</h1>
  <p>Create editable Figma pages, tokens, SVG icon components, component library frames, templates, and screen drafts.</p>
  <div class="note">Safe mode: this plugin never deletes manual content. Refresh removes only nodes tagged as generated by this plugin.</div>
  <button id="validate" class="secondary">Validate Safety First</button>
  <button id="create">Create New Safe Export</button>
  <button id="refresh" class="danger">Refresh Generated Nodes Only</button>
  <button id="notes" class="secondary">Create Notes Only</button>
  <div id="status" class="status">Ready. Run validation before export.</div>
  <script>
    const send = (type) => parent.postMessage({ pluginMessage: { type } }, '*');
    document.getElementById('validate').onclick = () => send('validate');
    document.getElementById('create').onclick = () => send('create-safe');
    document.getElementById('refresh').onclick = () => send('refresh-generated');
    document.getElementById('notes').onclick = () => send('create-notes');
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'status') document.getElementById('status').textContent = msg.text;
    };
  </script>
</body>
</html>
