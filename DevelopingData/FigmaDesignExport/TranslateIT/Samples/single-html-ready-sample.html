<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #030407;
      --surface: #11151c;
      --surface-2: #171c25;
      --border: #242b36;
      --text: #f5f7fa;
      --muted: #8d96a6;
      --accent: #d7dde7;
    }

    .preview-root {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 32px;
      width: 1180px;
      background: var(--bg);
      color: var(--text);
    }

    .toolbar,
    .card,
    .composer {
      background: var(--surface);
      border-color: var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-direction: row;
      gap: 16px;
      height: 86px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 520px;
      height: 180px;
    }

    .cards {
      display: flex;
      flex-direction: row;
      gap: 20px;
    }

    .composer {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 960px;
      height: 78px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
    }

    .title {
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
    }

    .button {
      display: flex;
      flex-direction: row;
      gap: 10px;
      width: 180px;
      height: 44px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: 12px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="display:none">
    <symbol id="plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="mic" viewBox="0 0 24 24">
      <path d="M12 14a4 4 0 0 0 4-4V7a4 4 0 0 0-8 0v3a4 4 0 0 0 4 4Z" />
      <path d="M19 10a7 7 0 0 1-14 0M12 17v4M8 21h8" />
    </symbol>
    <symbol id="send" viewBox="0 0 24 24">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </symbol>
  </svg>

  <main class="preview-root" data-component="Screen / TranslateIT Sample">
    <section class="toolbar" data-component="Toolbar / Main">
      <div class="button" data-component="Button / New Chat" data-action="chat.new" data-backend="chat_new">
        <span data-icon="plus"></span>
        <span>New Chat</span>
      </div>
      <div class="label" data-bind="worker.status">Worker Ready</div>
    </section>

    <section class="cards" data-component="Cards / Feature Row">
      <article class="card" data-component="Card / Text Input">
        <div class="title">Text input</div>
        <p class="label">Type text and translate it through the local runtime.</p>
      </article>
      <article class="card" data-component="Card / Voice Input">
        <div class="title">Voice input</div>
        <p class="label">Record speech and stream it to the translation worker.</p>
      </article>
    </section>

    <section class="composer" data-component="Composer / Translation Input">
      <span data-icon="plus"></span>
      <span class="label" data-slot="composer.placeholder">Ask anything...</span>
      <span data-icon="mic" data-action="voice.record" data-backend="voice_record"></span>
      <span data-icon="send" data-action="translation.send" data-backend="translation_send"></span>
    </section>
  </main>
</body>
</html>
