name: Dev-Rust Rust Check

on:
  push:
    branches:
      - Dev-Rust
  pull_request:
    branches:
      - Dev-Rust

jobs:
  rust-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EngineData/LauncherApp/RustApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EngineData/LauncherApp/RustApp/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust check
        run: npm run check:rust
